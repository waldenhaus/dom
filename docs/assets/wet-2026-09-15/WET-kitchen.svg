<text x="110.00" y="949.00" font-family="Arial, sans-serif" font-size="18" fill="#303832" text-anchor="start" font-weight="400">* W06: подоконник +1000, верх +2200 → середина +1600 мм по графике P89.</text>
<text x="110.00" y="980.00" font-family="Arial, sans-serif" font-size="16" fill="#697066" text-anchor="start" font-weight="400">Окончательные высоты окна и мебели не назначены. Привязать линию к фактической середине окна.</text>
<text x="110.00" y="1011.00" font-family="Arial, sans-serif" font-size="16" fill="#303832" text-anchor="start" font-weight="400">Под плиткой: согласованная гидроизоляция, герметичные примыкания пола, углов и проходов труб.</text>
<text x="110.00" y="1042.00" font-family="Arial, sans-serif" font-size="16" fill="#697066" text-anchor="start" font-weight="400">Непрерывное основание с учётом движения дерева; плитка сама по себе не гарантирует защиту от протечки.</text>
