<text x="120.00" y="770.00" font-family="Arial, sans-serif" font-size="17" fill="#697066" text-anchor="start" font-weight="400">С ↑ · синим — неподвижное стекло и закрытые двери</text>
<text x="120.00" y="802.00" font-family="Arial, sans-serif" font-size="17" fill="#697066" text-anchor="start" font-weight="400">Коричневым — движение створок внутрь душа</text>
<text x="120.00" y="842.00" font-family="Arial, sans-serif" font-size="16" fill="#697066" text-anchor="start" font-weight="400">Дверь D05 помещения сохраняет предложенное открывание наружу.</text>
<text x="120.00" y="875.00" font-family="Arial, sans-serif" font-size="16" fill="#697066" text-anchor="start" font-weight="400">Её точная навеска и изделие требуют проверки.</text>
<text x="900.00" y="245.00" font-family="Arial, sans-serif" font-size="25" fill="#303832" text-anchor="start" font-weight="600">УГЛОВАЯ КАБИНА</text>
<text x="900.00" y="291.00" font-family="Arial, sans-serif" font-size="18" fill="#303832" text-anchor="start" font-weight="400">Две стены помещения + две стеклянные грани.</text>
<text x="900.00" y="326.00" font-family="Arial, sans-serif" font-size="18" fill="#303832" text-anchor="start" font-weight="400">Одна грань неподвижна; на второй — две двери.</text>
<text x="900.00" y="361.00" font-family="Arial, sans-serif" font-size="18" fill="#303832" text-anchor="start" font-weight="400">Створки номинально 500 + 500 мм.</text>
<text x="900.00" y="396.00" font-family="Arial, sans-serif" font-size="18" fill="#303832" text-anchor="start" font-weight="400">Открывание обеих — внутрь душа.</text>
<text x="900.00" y="431.00" font-family="Arial, sans-serif" font-size="18" fill="#303832" text-anchor="start" font-weight="400">Стекло не продолжается поперёк комнаты.</text>
<text x="900.00" y="466.00" font-family="Arial, sans-serif" font-size="18" fill="#303832" text-anchor="start" font-weight="400">Сантехника вне квадрата душа.</text>
<text x="900.00" y="575.00" font-family="Arial, sans-serif" font-size="23" fill="#303832" text-anchor="start" font-weight="600">ПРОВЕРКА ГЕОМЕТРИИ</text>
<text x="900.00" y="619.00" font-family="Arial, sans-serif" font-size="17" fill="#303832" text-anchor="start" font-weight="400">Радиус створки 500 мм при глубине 1 000 мм.</text>
<text x="900.00" y="654.00" font-family="Arial, sans-serif" font-size="17" fill="#303832" text-anchor="start" font-weight="400">Номинально 500 мм остаётся до задней стены.</text>
<text x="900.00" y="689.00" font-family="Arial, sans-serif" font-size="17" fill="#303832" text-anchor="start" font-weight="400">Перед душем 520 мм до стены помещения.</text>
<text x="900.00" y="724.00" font-family="Arial, sans-serif" font-size="17" fill="#303832" text-anchor="start" font-weight="400">В зоне полотенцесушителя — 420 мм.</text>
<text x="900.00" y="843.00" font-family="Arial, sans-serif" font-size="16" fill="#697066" text-anchor="start" font-weight="400">Размеры стекла, петли и ручки пока не заказные.</text>
<text x="900.00" y="875.00" font-family="Arial, sans-serif" font-size="16" fill="#697066" text-anchor="start" font-weight="400">Проверить опоры стекла, уплотнения и аварийный доступ.</text>
<text x="900.00" y="907.00" font-family="Arial, sans-serif" font-size="16" fill="#697066" text-anchor="start" font-weight="400">Водоизоляция, слив и трубы — отдельное согласование.</text>
