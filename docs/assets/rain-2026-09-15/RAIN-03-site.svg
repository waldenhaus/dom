<rect x="1020.80" y="793.00" width="164.00" height="90.20" fill="#ead7b8" stroke="#277c91" stroke-width="2"/>
<text x="1102.80" y="838.10" font-family="Arial, sans-serif" font-size="13" fill="#303832" text-anchor="middle" font-weight="600">РЕЗЕРВ*</text>
<line x1="1041.30" y1="747.90" x2="1102.80" y2="793.00" stroke="#ad613e" stroke-width="3" stroke-dasharray="6 4"/>
<text x="130.00" y="960.00" font-family="Arial, sans-serif" font-size="16" fill="#303832" text-anchor="start" font-weight="400">С ↑ · резерв площадок проверен внутри предложенных границ участка; траншеи и отметки уточняются.</text>
<text x="130.00" y="992.00" font-family="Arial, sans-serif" font-size="16" fill="#697066" text-anchor="start" font-weight="400">Прямоугольники ёмкости и инфильтрации — резерв места, не габариты выбранного оборудования.</text>
<text x="130.00" y="1023.00" font-family="Arial, sans-serif" font-size="16" fill="#ad613e" text-anchor="start" font-weight="400">* Инфильтрация разрешима только после проверки грунта, грунтовых вод и местных ограничений у озера.</text>
<text x="1200.00" y="229.00" font-family="Arial, sans-serif" font-size="21" fill="#303832" text-anchor="start" font-weight="600">ПОСЛЕДОВАТЕЛЬНОСТЬ</text>
<text x="1200.00" y="276.00" font-family="Arial, sans-serif" font-size="17" fill="#303832" text-anchor="start" font-weight="400">1. Скрытые стояки кровель.</text>
<text x="1200.00" y="319.00" font-family="Arial, sans-serif" font-size="17" fill="#303832" text-anchor="start" font-weight="400">2. Дождеприёмники с пескоуловителями.</text>
<text x="1200.00" y="362.00" font-family="Arial, sans-serif" font-size="17" fill="#303832" text-anchor="start" font-weight="400">3. Ревизии на поворотах и слияниях.</text>
<text x="1200.00" y="405.00" font-family="Arial, sans-serif" font-size="17" fill="#303832" text-anchor="start" font-weight="400">4. Общая труба к ёмкости на полив.</text>
<text x="1200.00" y="448.00" font-family="Arial, sans-serif" font-size="17" fill="#303832" text-anchor="start" font-weight="400">5. Перелив: решение после изысканий.</text>
<text x="1200.00" y="550.00" font-family="Arial, sans-serif" font-size="21" fill="#ad613e" text-anchor="start" font-weight="600">ЧТО ПОКА НЕИЗВЕСТНО</text>
<text x="1200.00" y="594.00" font-family="Arial, sans-serif" font-size="17" fill="#ad613e" text-anchor="start" font-weight="400">Интенсивность расчётного дождя.</text>
<text x="1200.00" y="630.00" font-family="Arial, sans-serif" font-size="17" fill="#ad613e" text-anchor="start" font-weight="400">Отметки лотков, промерзание и УГВ.</text>
<text x="1200.00" y="666.00" font-family="Arial, sans-serif" font-size="17" fill="#ad613e" text-anchor="start" font-weight="400">Фильтрация грунта и ограничения.</text>
<text x="1200.00" y="702.00" font-family="Arial, sans-serif" font-size="17" fill="#ad613e" text-anchor="start" font-weight="400">Место безопасного конечного отвода.</text>
<text x="1200.00" y="738.00" font-family="Arial, sans-serif" font-size="17" fill="#ad613e" text-anchor="start" font-weight="400">Диаметры и уклон труб.</text>
<text x="1200.00" y="774.00" font-family="Arial, sans-serif" font-size="17" fill="#ad613e" text-anchor="start" font-weight="400">Размер и крепление ёмкости.</text>
<text x="1200.00" y="866.00" font-family="Arial, sans-serif" font-size="17" fill="#303832" text-anchor="start" font-weight="600">В септик и озеро выпуск не принят.</text>
<text x="1200.00" y="899.00" font-family="Arial, sans-serif" font-size="17" fill="#303832" text-anchor="start" font-weight="400">Ёмкость без перелива конечна:</text>
<text x="1200.00" y="930.00" font-family="Arial, sans-serif" font-size="17" fill="#303832" text-anchor="start" font-weight="400">10 м³ — лишь сценарий, не подбор.</text>
<line x1="64.00" y1="1094.00" x2="1616.00" y2="1094.00" stroke="#c7c9c0" stroke-width="1"/>
<text x="64.00" y="1127.00" font-family="Arial, sans-serif" font-size="15" fill="#697066" text-anchor="start" font-weight="400">Плановые контуры P89 · концепция ливнёвки · 15.09.2026</text>
<text x="64.00" y="1153.00" font-family="Arial, sans-serif" font-size="15" fill="#697066" text-anchor="start" font-weight="400">Номинальные размеры модели; отделка и изделия уточняются. Не для строительства.</text>
<text x="1616.00" y="1127.00" font-family="Arial, sans-serif" font-size="15" fill="#303832" text-anchor="end" font-weight="400">RAIN-03 / WEB-RAIN-15.09/R2 · Схема, NTS</text>
<text x="1616.00" y="1153.00" font-family="Arial, sans-serif" font-size="13" fill="#697066" text-anchor="end" font-weight="400">Автор: Codex · проверка и утверждение специалистом: не выполнены</text>
</svg>