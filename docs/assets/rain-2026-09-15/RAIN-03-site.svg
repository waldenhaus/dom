<text x="64.00" y="104.00" font-family="Arial, sans-serif" font-size="34" fill="#303832" text-anchor="start" font-weight="600">Дом + навес → ливнёвка на участке</text>
<text x="64.00" y="137.00" font-family="Arial, sans-serif" font-size="17" fill="#697066" text-anchor="start" font-weight="400">Предложенная трасса и резервы места. Не план земляных работ; конечный перелив ещё не подтверждён.</text>
