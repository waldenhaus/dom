<text x="380.00" y="735.00" font-family="Arial, sans-serif" font-size="16" fill="#303832" text-anchor="middle" font-weight="400">Уклонообразующий слой / основание</text>
<line x1="630.00" y1="540.00" x2="620.00" y2="756.00" stroke="#697066" stroke-width="1"/>
<text x="590.00" y="781.00" font-family="Arial, sans-serif" font-size="16" fill="#303832" text-anchor="middle" font-weight="400">Несущие балки: сечение и опоры по расчёту</text>
<line x1="905.00" y1="555.00" x2="860.00" y2="805.00" stroke="#697066" stroke-width="1"/>
<text x="830.00" y="830.00" font-family="Arial, sans-serif" font-size="16" fill="#303832" text-anchor="middle" font-weight="400">Деревянная подшивка</text>
<line x1="1275.00" y1="530.00" x2="1430.00" y2="717.00" stroke="#697066" stroke-width="1"/>
<text x="1400.00" y="742.00" font-family="Arial, sans-serif" font-size="16" fill="#303832" text-anchor="middle" font-weight="400">Графитовая лобовая часть</text>
<text x="120.00" y="908.00" font-family="Arial, sans-serif" font-size="18" fill="#303832" text-anchor="start" font-weight="400">Верх: система мембранной гидроизоляции по сплошному основанию. Фальц дома сохраняется.</text>
<text x="120.00" y="940.00" font-family="Arial, sans-serif" font-size="17" fill="#303832" text-anchor="start" font-weight="400">Водосток внутри съёмной облицовки; герметичный жёлоб с доступом, фланец воронки совместим с мембраной.</text>
<text x="120.00" y="972.00" font-family="Arial, sans-serif" font-size="16" fill="#303832" text-anchor="start" font-weight="400">Если лаундж отапливается: отдельный расчёт утепления, пароизоляции и конденсации. Режим пока не подтверждён.</text>
<text x="120.00" y="1004.00" font-family="Arial, sans-serif" font-size="17" fill="#303832" text-anchor="start" font-weight="400">Снег не считаем автоматически сползающим: нужны снеговой мешок, сход с верхнего ската и расчёт прогиба.</text>
<text x="120.00" y="1035.00" font-family="Arial, sans-serif" font-size="16" fill="#697066" text-anchor="start" font-weight="400">* 2% — сценарий водоотвода. Окончательные уклон, толщина, опоры и снегозадержание назначаются расчётом.</text>
<line x1="64.00" y1="1094.00" x2="1616.00" y2="1094.00" stroke="#c7c9c0" stroke-width="1"/>
<text x="64.00" y="1127.00" font-family="Arial, sans-serif" font-size="15" fill="#697066" text-anchor="start" font-weight="400">Плановые контуры P89 · концепция ливнёвки · 15.09.2026</text>
<text x="64.00" y="1153.00" font-family="Arial, sans-serif" font-size="15" fill="#697066" text-anchor="start" font-weight="400">Номинальные размеры модели; отделка и изделия уточняются. Не для строительства.</text>
<text x="1616.00" y="1127.00" font-family="Arial, sans-serif" font-size="15" fill="#303832" text-anchor="end" font-weight="400">RAIN-02 / WEB-RAIN-15.09/R2 · Принципиальная схема, NTS</text>
<text x="1616.00" y="1153.00" font-family="Arial, sans-serif" font-size="13" fill="#697066" text-anchor="end" font-weight="400">Автор: Codex · проверка и утверждение специалистом: не выполнены</text>
