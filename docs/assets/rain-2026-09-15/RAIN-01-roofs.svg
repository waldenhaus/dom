<text x="1115.00" y="231.00" font-family="Arial, sans-serif" font-size="21" fill="#303832" text-anchor="start" font-weight="600">ВОДА РАЗДЕЛЕНА НА КРОВЛЕ</text>
<text x="1115.00" y="273.00" font-family="Arial, sans-serif" font-size="17" fill="#303832" text-anchor="start" font-weight="400">В1 / В2 — северный жёлоб дома.</text>
<text x="1115.00" y="304.00" font-family="Arial, sans-serif" font-size="17" fill="#303832" text-anchor="start" font-weight="400">В3 / В4 — южный жёлоб дома.</text>
<text x="1115.00" y="335.00" font-family="Arial, sans-serif" font-size="17" fill="#303832" text-anchor="start" font-weight="400">В5 / В6 — навес, два низких пункта.</text>
<text x="1115.00" y="366.00" font-family="Arial, sans-serif" font-size="17" fill="#303832" text-anchor="start" font-weight="400">Дом не сбрасывает воду на навес.</text>
<text x="1115.00" y="397.00" font-family="Arial, sans-serif" font-size="17" fill="#303832" text-anchor="start" font-weight="400">Система объединяется только ниже,</text>
<text x="1115.00" y="428.00" font-family="Arial, sans-serif" font-size="17" fill="#303832" text-anchor="start" font-weight="400">через обслуживаемые дождеприёмники.</text>
<text x="1115.00" y="513.00" font-family="Arial, sans-serif" font-size="22" fill="#303832" text-anchor="start" font-weight="600">СОФИТ И КРАЙ</text>
<text x="1115.00" y="554.00" font-family="Arial, sans-serif" font-size="17" fill="#303832" text-anchor="start" font-weight="400">Графитовая лобовая часть, снизу — дуб.</text>
<text x="1115.00" y="585.00" font-family="Arial, sans-serif" font-size="17" fill="#303832" text-anchor="start" font-weight="400">Красный пунктир — снегозадержание</text>
<text x="1115.00" y="616.00" font-family="Arial, sans-serif" font-size="17" fill="#303832" text-anchor="start" font-weight="400">верхнего ската, предварительная зона.</text>
<text x="1115.00" y="647.00" font-family="Arial, sans-serif" font-size="17" fill="#303832" text-anchor="start" font-weight="400">Крепления и снеговые нагрузки TBC.</text>
<text x="1115.00" y="678.00" font-family="Arial, sans-serif" font-size="17" fill="#303832" text-anchor="start" font-weight="400">Стояки в доступных сервисных коробах.</text>
<text x="1115.00" y="763.00" font-family="Arial, sans-serif" font-size="20" fill="#ad613e" text-anchor="start" font-weight="600">АВАРИЙНЫЙ ПУТЬ — ОТДЕЛЬНО</text>
<text x="1115.00" y="804.00" font-family="Arial, sans-serif" font-size="16" fill="#ad613e" text-anchor="start" font-weight="400">Для каждого жёлоба — независимый перелив.</text>
<text x="1115.00" y="835.00" font-family="Arial, sans-serif" font-size="16" fill="#ad613e" text-anchor="start" font-weight="400">Не подключать его к засоряемому стояку.</text>
<text x="1115.00" y="866.00" font-family="Arial, sans-serif" font-size="16" fill="#ad613e" text-anchor="start" font-weight="400">Выпуск видимый, от входов и оснований.</text>
<text x="1115.00" y="897.00" font-family="Arial, sans-serif" font-size="16" fill="#ad613e" text-anchor="start" font-weight="400">Высота порога и пропускная способность</text>
<text x="1115.00" y="928.00" font-family="Arial, sans-serif" font-size="16" fill="#ad613e" text-anchor="start" font-weight="400">требуют расчёта воды и нагрузки.</text>
<text x="110.00" y="1010.00" font-family="Arial, sans-serif" font-size="16" fill="#303832" text-anchor="start" font-weight="400">* 2% → 98 мм — сценарий водоотвода от дома, не уклон для гарантированного схода снега. Угол ещё не утверждён.</text>
<text x="110.00" y="1040.00" font-family="Arial, sans-serif" font-size="16" fill="#697066" text-anchor="start" font-weight="400">Равномерный снег, мешок у примыкания, сход сверху, прогиб и наледь требуют расчёта. Снеговую нагрузку не снижали.</text>
<line x1="64.00" y1="1094.00" x2="1616.00" y2="1094.00" stroke="#c7c9c0" stroke-width="1"/>
<text x="64.00" y="1127.00" font-family="Arial, sans-serif" font-size="15" fill="#697066" text-anchor="start" font-weight="400">Плановые контуры P89 · концепция ливнёвки · 15.09.2026</text>
<text x="64.00" y="1153.00" font-family="Arial, sans-serif" font-size="15" fill="#697066" text-anchor="start" font-weight="400">Номинальные размеры модели; отделка и изделия уточняются. Не для строительства.</text>
<text x="1616.00" y="1127.00" font-family="Arial, sans-serif" font-size="15" fill="#303832" text-anchor="end" font-weight="400">RAIN-01 / WEB-RAIN-15.09/R2 · 1:75 на A3</text>
<text x="1616.00" y="1153.00" font-family="Arial, sans-serif" font-size="13" fill="#697066" text-anchor="end" font-weight="400">Автор: Codex · проверка и утверждение специалистом: не выполнены</text>
