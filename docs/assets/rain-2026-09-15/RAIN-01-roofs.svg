<text x="591.00" y="368.67" font-family="Arial, sans-serif" font-size="18" fill="#303832" text-anchor="middle" font-weight="600">НАВЕС · 2%* К НАРУЖНОМУ КРАЮ</text>
<text x="591.00" y="392.67" font-family="Arial, sans-serif" font-size="16" fill="#303832" text-anchor="middle" font-weight="400">14 660 × 4 900 = 71,834 м²</text>
<text x="591.00" y="259.33" font-family="Arial, sans-serif" font-size="15" fill="#277c91" text-anchor="middle" font-weight="600">НИЗ · НАРУЖНЫЙ КРАЙ</text>
<text x="591.00" y="478.00" font-family="Arial, sans-serif" font-size="15" fill="#303832" text-anchor="middle" font-weight="600">ВЕРХ · ПРИМЫКАНИЕ К ДОМУ</text>
<text x="607.00" y="848.67" font-family="Arial, sans-serif" font-size="17" fill="#303832" text-anchor="middle" font-weight="400">ДОМ · 114,7296 м² в плане</text>
