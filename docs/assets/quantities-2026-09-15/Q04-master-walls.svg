th="1" stroke-dasharray=""/><text transform="translate(38 323.0) rotate(-90)" text-anchor="middle" fill="#707b64" font-size="16">3 000 мм</text><text x="80" y="570" fill="#303c36" font-size="23" text-anchor="start" font-weight="700">(2.70 + 1.52) × 2 × 3.00 − 0.90 × 2.10 − 0.80 × 0.90 = 22.710 м²</text><text x="80" y="623" fill="#303c36" font-size="20" text-anchor="start" font-weight="400">Все четыре стены облицованы плиткой; за раковиной и тумбой покрытие непрерывное.</text><text x="45" y="704" fill="#707b64" font-size="16" text-anchor="start" font-weight="400">Восточное окно: низ 2000, верх 2900 мм. На южной стене вычтена дверь D05 шириной 900 мм.</text><text x="45" y="728" fill="#707b64" font-size="16" text-anchor="start" font-weight="400">Откосы, примыкания и фактическую высоту нужно измерить. Показана номинальная сетка, не карта заводского раскроя.</text><text x="45" y="752" fill="#707b64" font-size="16" text-anchor="start" font-weight="400">Тёплая песочная отделка соответствует принятому виду; формат 1200×600 мм предложен для сравнения количества швов.</text></g></svg>