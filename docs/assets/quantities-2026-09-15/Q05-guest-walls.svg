<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800"><rect width="1400" height="800" fill="#f5f3ed"/><g font-family="Arial, sans-serif"><text x="45" y="46" fill="#303c36" font-size="29" text-anchor="start" font-weight="700">Гостевой санузел: отделка душевого угла</text><text x="45" y="78" fill="#707b64" font-size="16" text-anchor="start" font-weight="400">DBR-P11 • 15.09.2026 • предварительная раскладка по графической модели</text><rect x="180" y="145" width="170" height="510" fill="#eeeae0" stroke="#303c36" stroke-width="2"/><rect x="180" y="298.0" width="170" height="357.0" fill="#ddd6c8" stroke="none" stroke-width="1"/><line x1="180" y1="400.0" x2="350" y2="400.0" stroke="#ada798" stroke-width="1" stroke-dasharray=""/><line x1="180" y1="502.0" x2="350" y2="502.0" stroke="#ada798" stroke-width="1" stroke-dasharray=""/><line x1="180" y1="604.0" x2="350" y2="604.0" stroke="#ada798" stroke-width="1" stroke-dasharray=""/><text x="180" y="120" fill="#303c36" font-size="22" text-anchor="start" font-weight="700">Стена 1</text><line x1="180" y1="689" x2="350" y2="689" stroke="#707b64" stroke-width="1" stroke-dasharray=""/><line x1="180" y1="682" x2="180" y2="696" stroke="#707b64" stroke-width="1" stroke-dasharray=""/><line x1="350" y1="682" x2="350" y2="696" stroke="#707b64" stroke-width="1" stroke-dasharray=""/><text x="265.0" y="678" fill="#707b64" font-size="16" text-anchor="middle" font-weight="400">1 000 мм</text><rect x="540" y="145" width="170" height="510" fill="#eeeae0" stroke="#303c36" stroke-width="2"/><rect x="540" y="298.0" width="170" height="357.0" fill="#ddd6c8" stroke="none" stroke-width="1"/><line x1="540" y1="400.0" x2="710" y2="400.0" stroke="#ada798" stroke-width="1" stroke-dasharray=""/><line x1="540" y1="502.0" x2="710" y2="502.0" stroke="#ada798" stroke-width="1" stroke-dasharray=""/><line x1="540" y1="604.0" x2="710" y2="604.0" stroke="#ada798" stroke-width="1" stroke-dasharray=""/><text x="540" y="120" fill="#303c36" font-size="22" text-anchor="start" font-weight="700">Стена 2</text><line x1="540" y1="689" x2="710" y2="689" stroke="#707b64" stroke-width="1" stroke-dasharray=""/><line x1="540" y1="682" x2="540" y2="696" stroke="#707b64" stroke-width="1" stroke-dasharray=""/><line x1="710" y1="682" x2="710" y2="696" stroke="#707b64" stroke-width="1" stroke-dasharray=""/><text x="625.0" y="678" fill="#707b64" font-size="16" text-anchor="middle" font-weight="400">1 000 мм</text><line x1="150" y1="298.0" x2="150" y2="655" stroke="#707b64" stroke-width="1" stroke-dasharray=""/><line x1="143" y1="298.0" x2="157" y2="298.0" stroke="#707b64" stroke-width="1" stroke-dasharray=""/><line x1="143" y1="655" x2="157" y2="655" stroke="#707b64" stroke-width="1" stroke-dasharray=""/><text transform="translate(138 476.5) rotate(-90)" text-anchor="middle" fill="#707b64" font-size="16">2 100 мм</text><text x="910" y="230" fill="#303c36" font-size="20" text-anchor="start" font-weight="400">Угловой душ 1000×1000 мм</text><text x="910" y="277" fill="#303c36" font-size="20" text-anchor="start" font-weight="400">Плитка двух стен: 4.20 м²</text><text x="910" y="324" fill="#303c36" font-size="20" text-anchor="start" font-weight="400">Остальные стены — окраска</text><text x="910" y="371" fill="#303c36" font-size="20" text-anchor="start" font-weight="400">За раковиной — моющаяся система</text><text x="45" y="748" fill="#707b64" font-size="16" text-anchor="start" font-weight="400">Высота 2100 мм — предложение для сметы. Оконный проём находится выше/вне плитки душевого угла по плану.</text><text x="45" y="772" fill="#707b64" font-size="16" text-anchor="start" font-weight="400">Ширина листа 1200 мм позволяет перекрыть стену 1000 мм одним элементом с подрезкой. Высоту листов согласовать.</text></g></svg>