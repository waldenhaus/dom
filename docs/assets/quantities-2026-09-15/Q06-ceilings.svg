<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="810" viewBox="0 0 1400 810"><rect width="1400" height="810" fill="#f5f3ed"/><g font-family="Arial, sans-serif"><text x="45" y="46" fill="#303c36" font-size="29" text-anchor="start" font-weight="700">Потолки и наружные подшивки: границы подсчёта</text><text x="45" y="78" fill="#707b64" font-size="16" text-anchor="start" font-weight="400">DBR-P11 • 15.09.2026 • предварительная раскладка по графической модели</text><rect x="75" y="175" width="640" height="310" fill="#e7ddc9" stroke="#303c36" stroke-width="2"/><rect x="197.23738062755797" y="175" width="366.71214188267396" height="310" fill="#c2d0bf" stroke="#303c36" stroke-width="2"/><text x="75" y="135" fill="#303c36" font-size="23" text-anchor="start" font-weight="700">Низ северного навеса</text><line x1="75" y1="153" x2="715" y2="153" stroke="#707b64" stroke-width="1" stroke-dasharray=""/><line x1="75" y1="146" x2="75" y2="160" stroke="#707b64" stroke-width="1" stroke-dasharray=""/><line x1="715" y1="146" x2="715" y2="160" stroke="#707b64" stroke-width="1" stroke-dasharray=""/><text x="395.0" y="142" fill="#707b64" font-size="16" text-anchor="middle" font-weight="400">14 660 мм</text><line x1="44" y1="175" x2="44" y2="485" stroke="#707b64" stroke-width="1" stroke-dasharray=""/><line x1="37" y1="175" x2="51" y2="175" stroke="#707b64" stroke-width="1" stroke-dasharray=""/><line x1="37" y1="485" x2="51" y2="485" stroke="#707b64" stroke-width="1" stroke-dasharray=""/><text transform="translate(32 330.0) rotate(-90)" text-anchor="middle" fill="#707b64" font-size="16">4 900 мм</text><text x="390" y="315" fill="#303c36" font-size="24" text-anchor="middle" font-weight="700">Лаундж 41.16 м²</text><text x="390" y="352" fill="#303c36" font-size="20" text-anchor="middle" font-weight="400">потолочная вагонка</text><text x="75" y="538" fill="#303c36" font-size="22" text-anchor="start" font-weight="700">Снаружи: 71.834 − 41.160 = 30.674 м²</text><text x="820" y="150" fill="#303c36" font-size="21" text-anchor="start" font-weight="400">Гостиная, скаты: 25.515 м²</text><text x="820" y="193" fill="#303c36" font-size="21" text-anchor="start" font-weight="400">Потолки прочих сухих зон: 40.869 м²</text><text x="820" y="236" fill="#303c36" font-size="21" text-anchor="start" font-weight="400">Лаундж: 41.160 м²</text><text x="820" y="279" fill="#303c36" font-size="21" text-anchor="start" font-weight="700">Вагонка всего: 107.544 м²</text><text x="820" y="322" fill="#303c36" font-size="21" text-anchor="start" font-weight="400"></text><text x="820" y="365" fill="#303c36" font-size="21" text-anchor="start" font-weight="400">Софит навеса: 30.674 м²</text><text x="820" y="408" fill="#303c36" font-size="21" text-anchor="start" font-weight="400">Подшивка западного свеса: 22.100 м²</text><text x="820" y="451" fill="#303c36" font-size="21" text-anchor="start" font-weight="700">Наружная подшивка: 52.774 м²</text><text x="75" y="625" fill="#303c36" font-size="22" text-anchor="start" font-weight="400">Западный свес: 2.50 × 8.16 × √(1 + (1.70 / 4.08)²) = 22.100 м²</text><text x="45" y="734" fill="#707b64" font-size="16" text-anchor="start" font-weight="400">Горизонтальная подшивка под навесом и наклонная кровля — разные поверхности. В площадь потолка уклон не добавляется.</text><text x="45" y="758" fill="#707b64" font-size="16" text-anchor="start" font-weight="400">Западная подшивка принята по скатам. Торцевые доски, вентиляционные вставки и профили пока не имеют спецификации.</text><text x="45" y="782" fill="#707b64" font-size="16" text-anchor="start" font-weight="400">Вагонка в лаундже отделена от наружного софита. Потолки санузлов: натяжной материал 9.992 м².</text></g></svg>