dth="1" stroke-dasharray=""/><text x="780" y="695" fill="#303c36" font-size="18" text-anchor="start" font-weight="400">2.38 × 1.60 = 3.808 м²</text><line x1="780" y1="491.5" x2="1172.7" y2="491.5" stroke="#707b64" stroke-width="2" stroke-dasharray="8 5"/><text x="788" y="481.5" fill="#707b64" font-size="15" text-anchor="start" font-weight="400">столешница условно</text><line x1="780" y1="676" x2="1172.7" y2="676" stroke="#707b64" stroke-width="1" stroke-dasharray=""/><line x1="780" y1="669" x2="780" y2="683" stroke="#707b64" stroke-width="1" stroke-dasharray=""/><line x1="1172.7" y1="669" x2="1172.7" y2="683" stroke="#707b64" stroke-width="1" stroke-dasharray=""/><text x="976.35" y="665" fill="#707b64" font-size="16" text-anchor="middle" font-weight="400">2 380 мм</text><line x1="754" y1="376.0" x2="754" y2="640" stroke="#707b64" stroke-width="1" stroke-dasharray=""/><line x1="747" y1="376.0" x2="761" y2="376.0" stroke="#707b64" stroke-width="1" stroke-dasharray=""/><line x1="747" y1="640" x2="761" y2="640" stroke="#707b64" stroke-width="1" stroke-dasharray=""/><text transform="translate(742 508.0) rotate(-90)" text-anchor="middle" fill="#707b64" font-size="16">1 600</text><text x="70" y="742" fill="#303c36" font-size="23" text-anchor="start" font-weight="700">Кухонная плитка нетто: 8.464 м²</text><text x="45" y="794" fill="#707b64" font-size="16" text-anchor="start" font-weight="400">Фартук продолжается за нижними шкафами и холодильником. У двери D02 покрытие заканчивается на косяке.</text><text x="45" y="818" fill="#707b64" font-size="16" text-anchor="start" font-weight="400">Линия 1600 мм получена из графических отметок W06: низ 1000, верх 2200. Откосы добавляются после замера.</text><text x="45" y="842" fill="#707b64" font-size="16" text-anchor="start" font-weight="400">1200×600 мм: спокойная прямая раскладка; нижняя подрезка скрыта мебелью. Цвет — тёплый светлый, как в принятом виде.</text></g></svg>