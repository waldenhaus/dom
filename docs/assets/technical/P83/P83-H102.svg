<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="420mm" height="297mm" viewBox="0 0 420 297" data-view-id="P83-H102"><rect width="420" height="297" fill="white"/><g font-family="Arial, DejaVu Sans, sans-serif" fill="#203f40"><text x="12" y="11" font-size="3" font-weight="normal" fill="#203f40" text-anchor="start">DBR-P11 • P83 • 09.09.2026 • ДЛЯ СОГЛАСОВАНИЯ</text><text x="12" y="23" font-size="5.3" font-weight="bold" fill="#203f40" text-anchor="start">Спальни: южные простенки для радиаторов</text><line x1="10" y1="34" x2="410" y2="34" stroke="#385b5c" stroke-width="0.3"/><line x1="10" y1="278" x2="410" y2="278" stroke="#385b5c" stroke-width="0.3"/><text x="12" y="285" font-size="2.6" font-weight="normal" fill="#203f40" text-anchor="start">НЕ ДЛЯ СТРОИТЕЛЬСТВА / Автор: Codex AI / Проверяющий и утверждающий: не назначены</text><text x="12" y="291" font-size="2.5" font-weight="normal" fill="#203f40" text-anchor="start">Основа: P81 / комплект P82. P83: отопление и концепция посадки. Все монтажные размеры требуют проверки.</text><text x="335" y="273" font-size="2.7" font-weight="normal" fill="#203f40" text-anchor="start">P83-H102 / 1:25 фрагменты / схемы NTS / A3</text><text x="15" y="49" font-size="4.2" font-weight="bold" fill="#203f40" text-anchor="start">Основная спальня · RAD-01</text><polygon points="15,88 79,88 79,104 15,104" fill="#eef7fa" stroke="#458092" stroke-width="0.3" /><text x="47" y="100" font-size="3.5" font-weight="normal" fill="#203f40" text-anchor="middle">W02 / 1600</text><polygon points="79,88 131.8,88 131.8,104 79,104" fill="#c7d0ca" stroke="#385b5c" stroke-width="0.3" /><line x1="79" y1="83" x2="131.8" y2="83" stroke="#385b5c" stroke-width="0.3"/><text x="105.4" y="80" font-size="3.4" font-weight="bold" fill="#203f40" text-anchor="middle">1320 мм</text><line x1="81" y1="87" x2="129.8" y2="87" stroke="#c44624" stroke-width="1.8"/><polygon points="131.8,64 155.0,64 155.0,88 131.8,88" fill="#e4ecea" stroke="#385b5c" stroke-width="0.3" /><text x="134.8" y="60" font-size="3" font-weight="normal" fill="#203f40" text-anchor="start">гардероб</text><text x="15" y="129" font-size="3.5" font-weight="normal" fill="#203f40" text-anchor="start">Доступный отрезок по номинальной модели: X=8960…10280;</text><text x="15" y="134.7" font-size="3.5" font-weight="normal" fill="#203f40" text-anchor="start">внутренняя грань стены Y=7760 мм.</text><text x="15" y="148.39999999999998" font-size="3.5" font-weight="normal" fill="#203f40" text-anchor="start">Это длина свободной стены, не допустимая длина радиатора.</text><text x="15" y="154.09999999999997" font-size="3.5" font-weight="normal" fill="#203f40" text-anchor="start">Уменьшить её на требуемые боковые зазоры, арматуру, примыкания</text><text x="15" y="159.79999999999995" font-size="3.5" font-weight="normal" fill="#203f40" text-anchor="start">и доступ по паспорту выбранного изделия.</text><text x="15" y="173.49999999999994" font-size="3.5" font-weight="normal" fill="#203f40" text-anchor="start">Определить теплопотери комнаты; подобрать мощность при</text><text x="15" y="179.19999999999993" font-size="3.5" font-weight="normal" fill="#203f40" text-anchor="start">реальном графике воды; проверить кронштейны и закладные в</text><text x="15" y="184.89999999999992" font-size="3.5" font-weight="normal" fill="#203f40" text-anchor="start">каркасной стене, шторы и уборку.</text><text x="15" y="198.5999999999999" font-size="3.5" font-weight="normal" fill="#203f40" text-anchor="start">Высота установки, толщина корпуса, диаметр труб, модель и</text><text x="15" y="204.2999999999999" font-size="3.5" font-weight="normal" fill="#203f40" text-anchor="start">число секций: TBC. Условный красный знак не задаёт монтажный</text><text x="15" y="209.9999999999999" font-size="3.5" font-weight="normal" fill="#203f40" text-anchor="start">габарит.</text><text x="217" y="49" font-size="4.2" font-weight="bold" fill="#203f40" text-anchor="start">Спальня 2 · RAD-02</text><polygon points="217,88 281,88 281,104 217,104" fill="#eef7fa" stroke="#458092" stroke-width="0.3" /><text x="249" y="100" font-size="3.5" font-weight="normal" fill="#203f40" text-anchor="middle">W05 / 1600</text><polygon points="281,88 321.0,88 321.0,104 281,104" fill="#c7d0ca" stroke="#385b5c" stroke-width="0.3" /><line x1="281" y1="83" x2="321.0" y2="83" stroke="#385b5c" stroke-width="0.3"/><text x="301.0" y="80" font-size="3.4" font-weight="bold" fill="#203f40" text-anchor="middle">1000 мм</text><line x1="283" y1="87" x2="319.0" y2="87" stroke="#c44624" stroke-width="1.8"/><text x="217" y="129" font-size="3.5" font-weight="normal" fill="#203f40" text-anchor="start">Доступный отрезок по номинальной модели: X=5600…6600;</text><text x="217" y="134.7" font-size="3.5" font-weight="normal" fill="#203f40" text-anchor="start">внутренняя грань стены Y=7760 мм.</text><text x="217" y="148.39999999999998" font-size="3.5" font-weight="normal" fill="#203f40" text-anchor="start">Это длина свободной стены, не допустимая длина радиатора.</text><text x="217" y="154.09999999999997" font-size="3.5" font-weight="normal" fill="#203f40" text-anchor="start">Уменьшить её на требуемые боковые зазоры, арматуру, примыкания</text><text x="217" y="159.79999999999995" font-size="3.5" font-weight="normal" fill="#203f40" text-anchor="start">и доступ по паспорту выбранного изделия.</text><text x="217" y="173.49999999999994" font-size="3.5" font-weight="normal" fill="#203f40" text-anchor="start">Определить теплопотери комнаты; подобрать мощность при</text><text x="217" y="179.19999999999993" font-size="3.5" font-weight="normal" fill="#203f40" text-anchor="start">реальном графике воды; проверить кронштейны и закладные в</text><text x="217" y="184.89999999999992" font-size="3.5" font-weight="normal" fill="#203f40" text-anchor="start">каркасной стене, шторы и уборку.</text><text x="217" y="198.5999999999999" font-size="3.5" font-weight="normal" fill="#203f40" text-anchor="start">Высота установки, толщина корпуса, диаметр труб, модель и</text><text x="217" y="204.2999999999999" font-size="3.5" font-weight="normal" fill="#203f40" text-anchor="start">число секций: TBC. Условный красный знак не задаёт монтажный</text><text x="217" y="209.9999999999999" font-size="3.5" font-weight="normal" fill="#203f40" text-anchor="start">габарит.</text><text x="15" y="252" font-size="3.1" font-weight="normal" fill="#203f40" text-anchor="start">Окна сохранены полноразмерными до пола. Изображения P82 не содержат новых радиаторов; схема P83 имеет приоритет по размещению отопления.</text></g></svg>