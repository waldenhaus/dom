<text id="P82-B101-TXT-15" x="303.0000" y="59.0000" font-family="Arial" font-size="3.2" text-anchor="start" fill="#203936" font-weight="bold">Исходный контур</text>
<text id="P82-B101-TXT-16" x="303.0000" y="65.0000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">Дом 11560 × 8160. Периметр 39,44 м. Это контур наружных граней</text>
<text id="P82-B101-TXT-17" x="303.0000" y="69.6000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">стен, не край плиты, оси свай или разбивочные оси.</text>
<text id="P82-B101-TXT-18" x="303.0000" y="84.7000" font-family="Arial" font-size="3.2" text-anchor="start" fill="#203936" font-weight="bold">Разные основания</text>
<text id="P82-B101-TXT-19" x="303.0000" y="90.7000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">Дом, периодически тёплый лаундж, открытые террасы, навес и</text>
<text id="P82-B101-TXT-20" x="303.0000" y="95.3000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">тяжёлая печь имеют разные нагрузки и температурные режимы.</text>
<text id="P82-B101-TXT-21" x="303.0000" y="99.9000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">Совместность/разделение решает конструктор.</text>
<text id="P82-B101-TXT-22" x="303.0000" y="115.0000" font-family="Arial" font-size="3.2" text-anchor="start" fill="#203936" font-weight="bold">Нужны реакции</text>
<text id="P82-B101-TXT-23" x="303.0000" y="121.0000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">Стены и опоры крыши, W01, навес, печь/дымоход, бак с водой,</text>
<text id="P82-B101-TXT-24" x="303.0000" y="125.6000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">эксплуатационные и климатические воздействия. Сечения и сетка</text>
<text id="P82-B101-TXT-25" x="303.0000" y="130.2000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">опор не назначены.</text>
<text id="P82-B101-TXT-26" x="303.0000" y="145.3000" font-family="Arial" font-size="3.2" text-anchor="start" fill="#203936" font-weight="bold">Стоп до расчёта</text>
<text id="P82-B101-TXT-27" x="303.0000" y="151.3000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">Тип, глубина, сваи, толщина плиты, армирование и земляные работы</text>
<text id="P82-B101-TXT-28" x="303.0000" y="155.9000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">остаются TBC. Запас материала не заменяет расчёт осадок и</text>
<text id="P82-B101-TXT-29" x="303.0000" y="160.5000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">прочности.</text></svg>