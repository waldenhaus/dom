<text id="P82-M105-TXT-2" x="10.0000" y="20.0000" font-family="Arial" font-size="4.8" text-anchor="start" fill="#203936" font-weight="bold">Северная стена гостевого: две непроверенные альтернативы</text>
<text id="P82-M105-TXT-3" x="10.0000" y="29.0000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">Вид из комнаты на север: запад слева, восток справа. B1/B2 не выбраны; глубины и сервис неизвестны.</text>
<text id="P82-M105-TXT-4" x="10.0000" y="279.0000" font-family="Arial" font-size="2.5" text-anchor="start" fill="#8e462d" font-weight="bold">ДЛЯ СОГЛАСОВАНИЯ / НЕ ДЛЯ СТРОИТЕЛЬСТВА</text>
<text id="P82-M105-TXT-5" x="10.0000" y="285.0000" font-family="Arial" font-size="2.5" text-anchor="start" fill="#203936">FFL 0 — условный чистый пол. Изделия, монтаж и инженерные расчёты: TBC.</text>
<text id="P82-M105-TXT-6" x="10.0000" y="291.0000" font-family="Arial" font-size="2.5" text-anchor="start" fill="#6d7a77">Подготовка: Codex / AI. Профессиональные проверяющий и утверждающий не назначены.</text>
