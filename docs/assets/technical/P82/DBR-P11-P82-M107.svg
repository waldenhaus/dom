<text id="P82-M107-TXT-1" x="10.0000" y="10.0000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#6d7a77">DBR-P11 / P82 / 08.09.2026 / ОТДЕЛКА · ПОТОЛКИ · СВЕТ</text>
<text id="P82-M107-TXT-2" x="10.0000" y="20.0000" font-family="Arial" font-size="5.0" text-anchor="start" fill="#203936" font-weight="bold">Печь: видимый дымоход через навес</text>
<text id="P82-M107-TXT-3" x="10.0000" y="29.0000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">Разрез по оси X3350, взгляд на восток. Все размеры трубы графические, не расчёт тяги.</text>
<text id="P82-M107-TXT-4" x="10.0000" y="279.0000" font-family="Arial" font-size="2.5" text-anchor="start" fill="#8e462d" font-weight="bold">ДЛЯ СОГЛАСОВАНИЯ / НЕ ДЛЯ СТРОИТЕЛЬСТВА</text>
<text id="P82-M107-TXT-5" x="10.0000" y="285.0000" font-family="Arial" font-size="2.5" text-anchor="start" fill="#203936">P79: примерка отделки и света. Изделия, крепления, пироги и пожарные узлы не утверждены.</text>
<text id="P82-M107-TXT-6" x="10.0000" y="291.0000" font-family="Arial" font-size="2.5" text-anchor="start" fill="#6d7a77">Подготовка: Codex / AI. Проверяющий и утверждающий специалист: не назначены.</text>
<text id="P82-M107-TXT-7" x="356.0000" y="279.0000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936" font-weight="bold">P82-M107</text>
<text id="P82-M107-TXT-8" x="356.0000" y="286.0000" font-family="Arial" font-size="2.6" text-anchor="start" fill="#203936">М 1:50 / мм / A3</text>
<rect x="82.5000" y="74.8860" width="48.0369" height="3.6360" fill="#fff" stroke="none"/>
<text id="P82-M107-TXT-9" x="83.0000" y="77.6000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">+5.500 верх трубы: только графика</text>
<rect x="158.5000" y="84.8860" width="28.8592" height="3.6360" fill="#fff" stroke="none"/>
<text id="P82-M107-TXT-10" x="159.0000" y="87.6000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">+5.000 конёк модели</text>
<rect x="28.5000" y="124.8860" width="31.7670" height="3.6360" fill="#fff" stroke="none"/>
<text id="P82-M107-TXT-11" x="29.0000" y="127.6000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">+3.000 подшивка: цель</text>
<rect x="28.5000" y="184.8860" width="39.4045" height="3.6360" fill="#fff" stroke="none"/>
<text id="P82-M107-TXT-12" x="29.0000" y="187.6000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">±0.000 условный чистый пол</text>
<text id="P82-M107-TXT-13" x="303.0000" y="59.0000" font-family="Arial" font-size="3.2" text-anchor="start" fill="#203936" font-weight="bold">Нет расчёта высоты</text>
<text id="P82-M107-TXT-14" x="303.0000" y="65.0000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">Разность 5500 - 5000 = 500 мм показывает только эту картинку. Не</text>
<text id="P82-M107-TXT-15" x="303.0000" y="69.6000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">правило «500 над коньком». Существующая топка не подобрана,</text>
<text id="P82-M107-TXT-16" x="303.0000" y="74.2000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">температура и расход газов неизвестны.</text>
<text id="P82-M107-TXT-17" x="303.0000" y="89.3000" font-family="Arial" font-size="3.2" text-anchor="start" fill="#203936" font-weight="bold">Полный дымоход</text>
<text id="P82-M107-TXT-18" x="303.0000" y="95.3000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">Нужны изделие, внутренний диаметр, расчёт, приток, прочистка,</text>
<text id="P82-M107-TXT-19" x="303.0000" y="99.9000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">несущая система и крепления высокой наружной части. Печь и</text>
<text id="P82-M107-TXT-20" x="303.0000" y="104.5000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">кухонная вытяжка не объединяются.</text>
<text id="P82-M107-TXT-21" x="303.0000" y="119.6000" font-family="Arial" font-size="3.2" text-anchor="start" fill="#203936" font-weight="bold">Проход навеса</text>
<text id="P82-M107-TXT-22" x="303.0000" y="125.6000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">На визуале труба проходит через условное отверстие. Отступы до</text>
<text id="P82-M107-TXT-23" x="303.0000" y="130.2000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">дерева/утеплителя, проходной узел, фартук, герметизация и</text>
<text id="P82-M107-TXT-24" x="303.0000" y="134.8000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">снег/ветер не разработаны.</text>
<text id="P82-M107-TXT-25" x="303.0000" y="149.9000" font-family="Arial" font-size="3.2" text-anchor="start" fill="#203936" font-weight="bold">До растопки</text>
<text id="P82-M107-TXT-26" x="303.0000" y="155.9000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">Основание кирпичной печи, ниша под дрова, близость мебели/двери,</text>
<text id="P82-M107-TXT-27" x="303.0000" y="160.5000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">пожарная защита и проверка специалистом остаются блокерами.</text>
<text id="P82-M107-TXT-28" x="12.0000" y="247.0000" font-family="Arial" font-size="3" text-anchor="start" fill="#203936">Визуальное наличие трубы устраняет пропуск на картинке, но не закрывает проект дымохода. Основная крыша, односкатный навес и дерево должны быть проверены совместно.</text></svg>