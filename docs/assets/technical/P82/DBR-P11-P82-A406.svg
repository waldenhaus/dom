<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" data-view-id="P82-A406"><rect x="0.0000" y="0.0000" width="420.0000" height="297.0000" fill="#fff" stroke="none" stroke-width="0.18"/>
<polyline points="10.0000,34.0000 410.0000,34.0000" fill="none" stroke="#203936" stroke-width="0.45" data-object-id="PAPER-CHECK-400MM"/>
<polyline points="10.0000,274.0000 410.0000,274.0000" fill="none" stroke="#203936" stroke-width="0.45"/>
<text id="P82-A406-TXT-1" x="10.0000" y="10.0000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#6d7a77">DBR-P11 / P82 / 08.09.2026 / ОТДЕЛКА · ПОТОЛКИ · СВЕТ</text>
<text id="P82-A406-TXT-2" x="10.0000" y="20.0000" font-family="Arial" font-size="5.0" text-anchor="start" fill="#203936" font-weight="bold">Навес: высота и защита от летнего нагрева</text>
<text id="P82-A406-TXT-3" x="10.0000" y="29.0000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">Координационная примерка. Не инструкция для монтажа.</text>
<text id="P82-A406-TXT-4" x="10.0000" y="279.0000" font-family="Arial" font-size="2.5" text-anchor="start" fill="#8e462d" font-weight="bold">ДЛЯ СОГЛАСОВАНИЯ / НЕ ДЛЯ СТРОИТЕЛЬСТВА</text>
<text id="P82-A406-TXT-5" x="10.0000" y="285.0000" font-family="Arial" font-size="2.5" text-anchor="start" fill="#203936">P79: примерка отделки и света. Изделия, крепления, пироги и пожарные узлы не утверждены.</text>
<text id="P82-A406-TXT-6" x="10.0000" y="291.0000" font-family="Arial" font-size="2.5" text-anchor="start" fill="#6d7a77">Подготовка: Codex / AI. Проверяющий и утверждающий специалист: не назначены.</text>
<text id="P82-A406-TXT-7" x="356.0000" y="279.0000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936" font-weight="bold">P82-A406</text>
<text id="P82-A406-TXT-8" x="356.0000" y="286.0000" font-family="Arial" font-size="2.6" text-anchor="start" fill="#203936">М NTS / мм / A3</text>
<text id="P82-A406-TXT-9" x="12.0000" y="48.0000" font-family="Arial" font-size="3.5" text-anchor="start" fill="#203936" font-weight="bold">Факт текущей модели</text>
<text id="P82-A406-TXT-10" x="12.0000" y="54.0000" font-family="Arial" font-size="3" text-anchor="start" fill="#203936">Условный пол ±0.000. Стекло +2.940. Прежняя плоскость навеса +3.100, без установленного уклона, толщины и опор. Абсолютная отметка пола над участком неизвестна.</text>
<text id="P82-A406-TXT-11" x="12.0000" y="67.2000" font-family="Arial" font-size="3.5" text-anchor="start" fill="#203936" font-weight="bold">Предлагаемая чистая высота</text>
<text id="P82-A406-TXT-12" x="12.0000" y="73.2000" font-family="Arial" font-size="3" text-anchor="start" fill="#203936">Цель примерки +3.000 до подшивки. Между +3.000 и прежней плоскостью только 100 мм: это НЕ резерв, в котором доказан полный пирог. Поднимать крышу или опускать стекло без координации нельзя.</text>
<text id="P82-A406-TXT-13" x="12.0000" y="86.4000" font-family="Arial" font-size="3.5" text-anchor="start" fill="#203936" font-weight="bold">Концепция слоёв, не монтажный узел</text>
<text id="P82-A406-TXT-14" x="12.0000" y="92.4000" font-family="Arial" font-size="3" text-anchor="start" fill="#203936">Фальцевая кровля и водозащитная система → проветриваемая кровельная полость → тепловой контур → согласованное воздухопароограничение → сервисная зона → светлая деревянная подшивка. Порядок конкретных мембран и толщины определить по</text>
<text id="P82-A406-TXT-15" x="12.0000" y="97.1000" font-family="Arial" font-size="3" text-anchor="start" fill="#203936">выбранной системе и расчёту.</text>
<text id="P82-A406-TXT-16" x="12.0000" y="110.3000" font-family="Arial" font-size="3.5" text-anchor="start" fill="#203936" font-weight="bold">Почему не просто фольга</text>
<text id="P82-A406-TXT-17" x="12.0000" y="116.3000" font-family="Arial" font-size="3" text-anchor="start" fill="#203936">Обычный утеплитель уменьшает передачу тепла; отражающий слой работает иначе и требует воздушного пространства. Его нельзя считать заменой полноценного утепления или гарантией прохлады. Источник P79-S01: DOE, Types of Insulation, раздел How.</text>
<text id="P82-A406-TXT-18" x="12.0000" y="129.5000" font-family="Arial" font-size="3.5" text-anchor="start" fill="#203936" font-weight="bold">Периодическое отопление</text>
<text id="P82-A406-TXT-19" x="12.0000" y="135.5000" font-family="Arial" font-size="3" text-anchor="start" fill="#203936">Лаундж то холодный, то прогревается. Нужны теплотехническая и влажностная проверки, непрерывность контура, вентиляция и влагостойкость покрытия. Толщина утеплителя и время прогрева пока неизвестны.</text>
<text id="P82-A406-TXT-20" x="12.0000" y="148.7000" font-family="Arial" font-size="3.5" text-anchor="start" fill="#203936" font-weight="bold">Проверка до изготовления</text>
<text id="P82-A406-TXT-21" x="12.0000" y="154.7000" font-family="Arial" font-size="3" text-anchor="start" fill="#203936">Архитектор + конструктор + специалист по оболочке: односкатный уклон, примыкание к основной крыше, опоры, вода/перелив, верх стекла и проходка дымохода. Эта картинка не подтверждает летнюю температуру потолка.</text></svg>