<text id="P82-A401-TXT-42" x="303.0000" y="125.6000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">проёмы не увеличены по высоте.</text>
<text id="P82-A401-TXT-43" x="303.0000" y="140.7000" font-family="Arial" font-size="3.2" text-anchor="start" fill="#203936" font-weight="bold">Вечерний свет</text>
<text id="P82-A401-TXT-44" x="303.0000" y="146.7000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">Скрытая линия вдоль перехода X=3300. Тип профиля, драйвер,</text>
<text id="P82-A401-TXT-45" x="303.0000" y="151.3000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">световой поток и монтажная ниша TBC.</text></svg>