<text id="P82-A401-TXT-38" x="303.0000" y="95.3000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">Видимые элементы на 100 ниже подшивки — графика, не полное</text>
<text id="P82-A401-TXT-39" x="303.0000" y="99.9000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">сечение.</text>
<text id="P82-A401-TXT-40" x="303.0000" y="115.0000" font-family="Arial" font-size="3.2" text-anchor="start" fill="#203936" font-weight="bold">Остальные комнаты</text>
