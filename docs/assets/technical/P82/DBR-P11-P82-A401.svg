<text id="P82-A401-TXT-2" x="10.0000" y="20.0000" font-family="Arial" font-size="5.0" text-anchor="start" fill="#203936" font-weight="bold">План потолков: свод гостиной и плоская кухня</text>
<text id="P82-A401-TXT-3" x="10.0000" y="29.0000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">План сверху. X — восток, Y — юг. Не план несущих балок.</text>
<text id="P82-A401-TXT-4" x="405.0000" y="43.0000" font-family="Arial" font-size="3" text-anchor="middle" fill="#203936" font-weight="bold">С</text>
<text id="P82-A401-TXT-5" x="10.0000" y="279.0000" font-family="Arial" font-size="2.5" text-anchor="start" fill="#8e462d" font-weight="bold">ДЛЯ СОГЛАСОВАНИЯ / НЕ ДЛЯ СТРОИТЕЛЬСТВА</text>
<text id="P82-A401-TXT-6" x="10.0000" y="285.0000" font-family="Arial" font-size="2.5" text-anchor="start" fill="#203936">Стены 400/200 — резервы. Контур P76 сохранён; потолок и кухня P78. Узлы и заказ: TBC.</text>
<text id="P82-A401-TXT-7" x="10.0000" y="291.0000" font-family="Arial" font-size="2.5" text-anchor="start" fill="#6d7a77">Подготовка: Codex / AI. Проверяющий и утверждающий специалист: не назначены.</text>
