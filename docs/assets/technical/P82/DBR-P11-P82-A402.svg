<text id="P82-A402-TXT-2" x="10.0000" y="20.0000" font-family="Arial" font-size="5.0" text-anchor="start" fill="#203936" font-weight="bold">Разрез гостиной по скатам: север — юг</text>
<text id="P82-A402-TXT-3" x="10.0000" y="29.0000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">X=1700, взгляд на восток. Север слева, юг справа. Высоты от условного чистого пола.</text>
