<text id="P82-A402-TXT-17" x="12.0000" y="245.0000" font-family="Arial" font-size="3" text-anchor="start" fill="#203936">Не удалять затяжки/фермы ради этого вида. Несущую схему, опоры, прогибы, распор и узлы назначает конструктор. Верхняя поверхность перехода к плоскому потолку должна замыкать тепловой и воздушный контуры.</text></svg>