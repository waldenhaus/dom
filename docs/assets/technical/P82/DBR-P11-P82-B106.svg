<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" data-view-id="P82-B106"><rect x="0.0000" y="0.0000" width="420.0000" height="297.0000" fill="#fff" stroke="none" stroke-width="0.18"/>
<polyline points="10.0000,34.0000 410.0000,34.0000" fill="none" stroke="#203936" stroke-width="0.45" data-object-id="PAPER-CHECK-400MM"/>
<polyline points="10.0000,274.0000 410.0000,274.0000" fill="none" stroke="#203936" stroke-width="0.45"/>
<text id="P82-B106-TXT-1" x="10.0000" y="10.0000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#6d7a77">DBR-P11 / P82 / 08.09.2026 / РАСШИРЕННЫЙ ДОМ · ПОТОЛОК И КУХНЯ P78</text>
<text id="P82-B106-TXT-2" x="10.0000" y="20.0000" font-family="Arial" font-size="5.0" text-anchor="start" fill="#203936" font-weight="bold">Как подрядчик должен вернуть смету под ключ</text>
<text id="P82-B106-TXT-3" x="10.0000" y="29.0000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">Задание для предложения подрядчика. Не разрешение на изготовление или строительство.</text>
<text id="P82-B106-TXT-4" x="10.0000" y="279.0000" font-family="Arial" font-size="2.5" text-anchor="start" fill="#8e462d" font-weight="bold">ДЛЯ СОГЛАСОВАНИЯ / НЕ ДЛЯ СТРОИТЕЛЬСТВА</text>
<text id="P82-B106-TXT-5" x="10.0000" y="285.0000" font-family="Arial" font-size="2.5" text-anchor="start" fill="#203936">Стены 400/200 — резервы. Контур P76 сохранён; потолок и кухня P78. Узлы и заказ: TBC.</text>
<text id="P82-B106-TXT-6" x="10.0000" y="291.0000" font-family="Arial" font-size="2.5" text-anchor="start" fill="#6d7a77">Подготовка: Codex / AI. Проверяющий и утверждающий специалист: не назначены.</text>
<text id="P82-B106-TXT-7" x="356.0000" y="279.0000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936" font-weight="bold">P82-B106</text>
<text id="P82-B106-TXT-8" x="356.0000" y="286.0000" font-family="Arial" font-size="2.6" text-anchor="start" fill="#203936">М NTS / мм / A3</text>
<text id="P82-B106-TXT-9" x="12.0000" y="49.0000" font-family="Arial" font-size="3.5" text-anchor="start" fill="#203936" font-weight="bold">Единая форма предложения</text>
<text id="P82-B106-TXT-10" x="12.0000" y="55.0000" font-family="Arial" font-size="3" text-anchor="start" fill="#203936">Для каждой позиции: ID/зона, точное изделие или материал, единица, чистое количество, нахлёсты/отходы/запас отдельно, количество к закупке и упаковки, цена материала, работа, доставка/разгрузка, сумма, валюта, дата/срок действия, налоги. Приложить</text>
<text id="P82-B106-TXT-11" x="12.0000" y="59.9000" font-family="Arial" font-size="3" text-anchor="start" fill="#203936">основание количества — лист или спецификацию.</text>
<text id="P82-B106-TXT-12" x="12.0000" y="74.3000" font-family="Arial" font-size="3.5" text-anchor="start" fill="#203936" font-weight="bold">Разделить пакеты</text>
<text id="P82-B106-TXT-13" x="12.0000" y="80.3000" font-family="Arial" font-size="3" text-anchor="start" fill="#203936">Подготовка участка и временные работы; фундамент/земля/дренаж; каркас/соединения; полы; крыша/фальц/водосток; утепление и мембраны; окна/двери; фасады; перегородки и отделка; лаундж/террасы/печь; инженерия; доставка/монтаж/пусконаладка;</text>
<text id="P82-B106-TXT-14" x="12.0000" y="85.2000" font-family="Arial" font-size="3" text-anchor="start" fill="#203936">проектирование и исполнительные документы.</text>
<text id="P82-B106-TXT-15" x="12.0000" y="99.6000" font-family="Arial" font-size="3.5" text-anchor="start" fill="#203936" font-weight="bold">Неизвестные позиции не прятать</text>
<text id="P82-B106-TXT-16" x="12.0000" y="105.6000" font-family="Arial" font-size="3" text-anchor="start" fill="#203936">Если изделие или конструкция не выбраны — стоимость отдельным предварительным допущением с его границами. «Включено» должно иметь состав. Не выводить точный итог «под ключ» без согласованного объёма, даты цен и исключений. В нашей ведомости</text>
<text id="P82-B106-TXT-17" x="12.0000" y="110.5000" font-family="Arial" font-size="3" text-anchor="start" fill="#203936">цены намеренно пустые.</text>
<text id="P82-B106-TXT-18" x="12.0000" y="124.9000" font-family="Arial" font-size="3.5" text-anchor="start" fill="#203936" font-weight="bold">Резерв с объяснением</text>
<text id="P82-B106-TXT-19" x="12.0000" y="130.9000" font-family="Arial" font-size="3" text-anchor="start" fill="#203936">Резерв привязать к риску: грунт, раскрой, замена изделий, доставка, неизвестный узел. Производственный отход не равен запасу прочности. Процент не назначен: подрядчик раскрывает и обосновывает отдельно по материалам.</text>
<text id="P82-B106-TXT-20" x="12.0000" y="145.3000" font-family="Arial" font-size="3.5" text-anchor="start" fill="#203936" font-weight="bold">Что запросить от завода</text>
<text id="P82-B106-TXT-21" x="12.0000" y="151.3000" font-family="Arial" font-size="3" text-anchor="start" fill="#203936">3D/IFC или согласованный обменный формат, КД панелей/стен с ID, марки деталей, ведомость древесины по сечениям и длинам, крепёж, чертежи соединений и закладных, раскрой листов, упаковочные листы, инструкция/очерёдность сборки, QA и ответственность</text>
<text id="P82-B106-TXT-22" x="12.0000" y="156.2000" font-family="Arial" font-size="3" text-anchor="start" fill="#203936">за расчёт.</text></svg>