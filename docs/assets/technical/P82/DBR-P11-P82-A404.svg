<text id="P82-A404-TXT-17" x="303.0000" y="59.0000" font-family="Arial" font-size="3.2" text-anchor="start" fill="#203936" font-weight="bold">Паркет</text>
<text id="P82-A404-TXT-18" x="303.0000" y="65.0000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">Гостиная и столовая западнее X3300; обе спальни. Светлый дуб,</text>
<text id="P82-A404-TXT-19" x="303.0000" y="69.6000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">прямая укладка - вариант палитры, не заказ изделия.</text>
<text id="P82-A404-TXT-20" x="303.0000" y="84.7000" font-family="Arial" font-size="3.2" text-anchor="start" fill="#203936" font-weight="bold">Плитка</text>
<text id="P82-A404-TXT-21" x="303.0000" y="90.7000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">Кухня, прихожая, два санузла; проход кухня-прихожая и закрытый</text>
<text id="P82-A404-TXT-22" x="303.0000" y="95.3000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">лаундж отдельно.</text>
<text id="P82-A404-TXT-23" x="303.0000" y="110.4000" font-family="Arial" font-size="3.2" text-anchor="start" fill="#203936" font-weight="bold">Переходы</text>
<text id="P82-A404-TXT-24" x="303.0000" y="116.4000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">Стремимся к одному уровню чистого пола. Перепады компенсировать</text>
<text id="P82-A404-TXT-25" x="303.0000" y="121.0000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">проектом основания, не предположением одинаковой толщины</text>
<text id="P82-A404-TXT-26" x="303.0000" y="125.6000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">паркета и плитки.</text>
<text id="P82-A404-TXT-27" x="303.0000" y="140.7000" font-family="Arial" font-size="3.2" text-anchor="start" fill="#203936" font-weight="bold">Терраса</text>
<text id="P82-A404-TXT-28" x="303.0000" y="146.7000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">Открытая деревянная терраса сохранена. Зона холодной примерки</text>
<text id="P82-A404-TXT-29" x="303.0000" y="151.3000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">мангала и казана - A407, без разрешения растопки.</text>
<text id="P82-A404-TXT-30" x="12.0000" y="251.0000" font-family="Arial" font-size="2.9" text-anchor="start" fill="#203936">Площади по границам зон модели, включая места под мебелью. Пороги/монтажные зазоры/раскрой/запас и фактические толщины считаются отдельно. Не закупочная ведомость.</text></svg>