<text id="P82-A404-TXT-1" x="10.0000" y="10.0000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#6d7a77">DBR-P11 / P82 / 08.09.2026 / ОТДЕЛКА · ПОТОЛКИ · СВЕТ</text>
<text id="P82-A404-TXT-2" x="10.0000" y="20.0000" font-family="Arial" font-size="5.0" text-anchor="start" fill="#203936" font-weight="bold">Полы: паркет в жилых зонах, плитка в остальных</text>
<text id="P82-A404-TXT-3" x="10.0000" y="29.0000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">Север сверху; озеро на западе. Граница покрытий X=3300. Чистые толщины ещё не подобраны.</text>
<text id="P82-A404-TXT-4" x="405.0000" y="43.0000" font-family="Arial" font-size="3" text-anchor="middle" fill="#203936" font-weight="bold">С</text>
<text id="P82-A404-TXT-5" x="10.0000" y="279.0000" font-family="Arial" font-size="2.5" text-anchor="start" fill="#8e462d" font-weight="bold">ДЛЯ СОГЛАСОВАНИЯ / НЕ ДЛЯ СТРОИТЕЛЬСТВА</text>
<text id="P82-A404-TXT-6" x="10.0000" y="285.0000" font-family="Arial" font-size="2.5" text-anchor="start" fill="#203936">P79: примерка отделки и света. Изделия, крепления, пироги и пожарные узлы не утверждены.</text>
<text id="P82-A404-TXT-7" x="10.0000" y="291.0000" font-family="Arial" font-size="2.5" text-anchor="start" fill="#6d7a77">Подготовка: Codex / AI. Проверяющий и утверждающий специалист: не назначены.</text>
<text id="P82-A404-TXT-8" x="356.0000" y="279.0000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936" font-weight="bold">P82-A404</text>
