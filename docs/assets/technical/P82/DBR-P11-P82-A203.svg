<text id="P82-A203-TXT-6" x="10.0000" y="285.0000" font-family="Arial" font-size="2.5" text-anchor="start" fill="#203936">Стены 400/200 — резервы. Контур P76 сохранён; потолок и кухня P78. Узлы и заказ: TBC.</text>
