<text id="P82-A409-TXT-37" x="303.0000" y="59.0000" font-family="Arial" font-size="3.2" text-anchor="start" fill="#203936" font-weight="bold">W01 / основа</text>
<text id="P82-A409-TXT-38" x="303.0000" y="65.0000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">Все сухие стены, кроме W02. На фронтонах до скатов продолжаются</text>
<text id="P82-A409-TXT-39" x="303.0000" y="69.6000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">тот же цвет и горизонтальный рисунок.</text>
<text id="P82-A409-TXT-40" x="303.0000" y="84.7000" font-family="Arial" font-size="3.2" text-anchor="start" fill="#203936" font-weight="bold">W02 / акценты</text>
<text id="P82-A409-TXT-41" x="303.0000" y="90.7000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">Южная стена гостиной X100–3300, Y7760. Западная стена</text>
<text id="P82-A409-TXT-42" x="303.0000" y="95.3000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">мастер-спальни X6800, Y4160–7760. Только доступные поверхности,</text>
<text id="P82-A409-TXT-43" x="303.0000" y="99.9000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">без мебели и проёмов.</text>
<text id="P82-A409-TXT-44" x="303.0000" y="115.0000" font-family="Arial" font-size="3.2" text-anchor="start" fill="#203936" font-weight="bold">Лаундж</text>
<text id="P82-A409-TXT-45" x="303.0000" y="121.0000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">Внутренняя сторона глухой восточной стены X8400. Стена дома у печи</text>
<text id="P82-A409-TXT-46" x="303.0000" y="125.6000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">и её защитная зона остаются отдельной нерешённой системой.</text>
<text id="P82-A409-TXT-47" x="303.0000" y="140.7000" font-family="Arial" font-size="3.2" text-anchor="start" fill="#203936" font-weight="bold">Без дерева</text>
<text id="P82-A409-TXT-48" x="303.0000" y="146.7000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">Санузлы; кухонный рабочий фартук; защитные поверхности у печи. Их</text>
<text id="P82-A409-TXT-49" x="303.0000" y="151.3000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">пригодность и состав требуют отдельных выбранных систем.</text>
<text id="P82-A409-TXT-50" x="12.0000" y="251.0000" font-family="Arial" font-size="2.9" text-anchor="start" fill="#203936">Отделка показана на существующей границе чистых поверхностей. Толщина доски и обрешётки не назначена; фактический монтажный резерв в стенах не подтверждён. Перепроверить до раскроя и заказа дверей.</text></svg>