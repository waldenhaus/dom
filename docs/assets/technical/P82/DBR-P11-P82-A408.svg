<text id="P82-A408-TXT-1" x="10.0000" y="10.0000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#6d7a77">DBR-P11 / P82 / 08.09.2026 / ОТДЕЛКА · ПОТОЛКИ · СВЕТ</text>
<text id="P82-A408-TXT-2" x="10.0000" y="20.0000" font-family="Arial" font-size="5.0" text-anchor="start" fill="#203936" font-weight="bold">Палитра стен: один профиль, два цвета</text>
<text id="P82-A408-TXT-3" x="10.0000" y="29.0000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">Цвета на экране ориентировочные. Утверждать физические выкрасы на выбранной древесине.</text>
<text id="P82-A408-TXT-4" x="10.0000" y="279.0000" font-family="Arial" font-size="2.5" text-anchor="start" fill="#8e462d" font-weight="bold">ДЛЯ СОГЛАСОВАНИЯ / НЕ ДЛЯ СТРОИТЕЛЬСТВА</text>
<text id="P82-A408-TXT-5" x="10.0000" y="285.0000" font-family="Arial" font-size="2.5" text-anchor="start" fill="#203936">P80: примерка отделки и света. Изделия, крепления, пироги и пожарные узлы не утверждены.</text>
<text id="P82-A408-TXT-6" x="10.0000" y="291.0000" font-family="Arial" font-size="2.5" text-anchor="start" fill="#6d7a77">Подготовка: Codex / AI. Проверяющий и утверждающий специалист: не назначены.</text>
<text id="P82-A408-TXT-7" x="356.0000" y="279.0000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936" font-weight="bold">P82-A408</text>
<text id="P82-A408-TXT-8" x="356.0000" y="286.0000" font-family="Arial" font-size="2.6" text-anchor="start" fill="#203936">М NTS / мм / A3</text>
<text id="P82-A408-TXT-9" x="14.0000" y="125.0000" font-family="Arial" font-size="3.1" text-anchor="start" fill="#203936" font-weight="bold">ОТД-W01 / Молочный - основа</text>
<text id="P82-A408-TXT-10" x="14.0000" y="133.0000" font-family="Arial" font-size="3" text-anchor="start" fill="#203936">Гостиная и фронтоны, кухня, прихожая, спальни и глухая восточная стена</text>
<text id="P82-A408-TXT-11" x="14.0000" y="137.8000" font-family="Arial" font-size="3" text-anchor="start" fill="#203936">лаунджа. Дерево у печи и в мокрых зонах исключено.</text>
<text id="P82-A408-TXT-12" x="145.0000" y="125.0000" font-family="Arial" font-size="3.1" text-anchor="start" fill="#203936" font-weight="bold">ОТД-W02 / Серо-оливковый - акцент</text>
<text id="P82-A408-TXT-13" x="145.0000" y="133.0000" font-family="Arial" font-size="3" text-anchor="start" fill="#203936">Вся доступная южная стена гостиной за ТВ и западная стена мастер-спальни за</text>
<text id="P82-A408-TXT-14" x="145.0000" y="137.8000" font-family="Arial" font-size="3" text-anchor="start" fill="#203936">изголовьем. Светлые шкафы не перекрашивать.</text>
<text id="P82-A408-TXT-15" x="276.0000" y="125.0000" font-family="Arial" font-size="3.1" text-anchor="start" fill="#203936" font-weight="bold">C01 / Светлое дерево - потолок</text>
<text id="P82-A408-TXT-16" x="276.0000" y="133.0000" font-family="Arial" font-size="3" text-anchor="start" fill="#203936">Светлая потолочная вагонка P79 сохраняется. Балки немного натуральнее, без</text>
<text id="P82-A408-TXT-17" x="276.0000" y="137.8000" font-family="Arial" font-size="3" text-anchor="start" fill="#203936">тёмно-коричневого контраста. Санузлы - белый натяжной потолок.</text>
<text id="P82-A408-TXT-18" x="14.0000" y="184.0000" font-family="Arial" font-size="3.2" text-anchor="start" fill="#203936">Укладка стен горизонтальная; малая фаска. Ориентир видимой ширины 180–200 мм, шаг рендера 200 мм. Шов и рельеф на картинке условные, не размер крепежа или усушки.</text>
<text id="P82-A408-TXT-19" x="14.0000" y="208.0000" font-family="Arial" font-size="3.2" text-anchor="start" fill="#203936">Смена цвета по углам целой стены. Без отдельного цветного треугольника фронтона, реечных вставок, микроцемента и дополнительного камня. Простые прямые наличники и плинтусы - намерение, не рабочий узел.</text>
<text id="P82-A408-TXT-20" x="14.0000" y="238.0000" font-family="Arial" font-size="3" text-anchor="start" fill="#203936">Выкрасы рядом с паркетом и вагонкой: дневной свет, вечер и выбранные светильники. Товарный код краски, порода, сорт, влажность и система нанесения ещё не выбраны.</text></svg>