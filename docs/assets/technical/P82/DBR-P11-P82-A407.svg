<text id="P82-A407-TXT-1" x="10.0000" y="10.0000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#6d7a77">DBR-P11 / P82 / 08.09.2026 / ОТДЕЛКА · ПОТОЛКИ · СВЕТ</text>
<text id="P82-A407-TXT-2" x="10.0000" y="20.0000" font-family="Arial" font-size="5.0" text-anchor="start" fill="#203936" font-weight="bold">Мангал 1000 и казан 20 л: северная открытая часть</text>
<text id="P82-A407-TXT-3" x="10.0000" y="29.0000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">Показаны холодные приборы. Это не разрешённое место эксплуатации и не готовое огнезащитное основание.</text>
<text id="P82-A407-TXT-4" x="405.0000" y="43.0000" font-family="Arial" font-size="3" text-anchor="middle" fill="#203936" font-weight="bold">С</text>
<text id="P82-A407-TXT-5" x="10.0000" y="279.0000" font-family="Arial" font-size="2.5" text-anchor="start" fill="#8e462d" font-weight="bold">ДЛЯ СОГЛАСОВАНИЯ / НЕ ДЛЯ СТРОИТЕЛЬСТВА</text>
<text id="P82-A407-TXT-6" x="10.0000" y="285.0000" font-family="Arial" font-size="2.5" text-anchor="start" fill="#203936">P79: примерка отделки и света. Изделия, крепления, пироги и пожарные узлы не утверждены.</text>
<text id="P82-A407-TXT-7" x="10.0000" y="291.0000" font-family="Arial" font-size="2.5" text-anchor="start" fill="#6d7a77">Подготовка: Codex / AI. Проверяющий и утверждающий специалист: не назначены.</text>
<text id="P82-A407-TXT-8" x="356.0000" y="279.0000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936" font-weight="bold">P82-A407</text>
<text id="P82-A407-TXT-9" x="356.0000" y="286.0000" font-family="Arial" font-size="2.6" text-anchor="start" fill="#203936">М 1:20 / мм / A3</text>
<rect x="111.5603" y="139.8740" width="66.8795" height="3.5240" fill="#fff" stroke="none"/>
<text id="P82-A407-TXT-10" x="145.0000" y="142.5000" font-family="Arial" font-size="2.7" text-anchor="middle" fill="#203936">КРАЙ НАВЕСА / ОГОНЬ ЗДЕСЬ НЕ СОГЛАСОВАН</text>
<rect x="104.3689" y="102.6100" width="21.2623" height="3.8600" fill="#fff" stroke="none"/>
<text id="P82-A407-TXT-11" x="115.0000" y="105.5000" font-family="Arial" font-size="3" text-anchor="middle" fill="#203936">МАНГАЛ 1000</text>
<rect x="168.9655" y="105.6100" width="7.0689" height="3.8600" fill="#fff" stroke="none"/>
<text id="P82-A407-TXT-12" x="172.5000" y="108.5000" font-family="Arial" font-size="3" text-anchor="middle" fill="#203936">20 л</text>
<rect x="111.3077" y="81.6860" width="7.3846" height="3.6360" fill="#fff" stroke="none"/>
<text id="P82-A407-TXT-13" x="115.0000" y="84.4000" font-family="Arial" font-size="2.8" text-anchor="middle" fill="#203936">1000</text>
<text id="P82-A407-TXT-14" x="303.0000" y="59.0000" font-family="Arial" font-size="3.2" text-anchor="start" fill="#203936" font-weight="bold">Пожарный стоп</text>
<text id="P82-A407-TXT-15" x="303.0000" y="65.0000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">Открытая полоска глубиной 1000 мм не доказывает нужного удаления</text>
<text id="P82-A407-TXT-16" x="303.0000" y="69.6000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">от кромки крыши. После выбора приборов расположение может</text>
<text id="P82-A407-TXT-17" x="303.0000" y="74.2000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">потребовать выноса дальше от террасы.</text>
<text id="P82-A407-TXT-18" x="303.0000" y="89.3000" font-family="Arial" font-size="3.2" text-anchor="start" fill="#203936" font-weight="bold">Основание</text>
<text id="P82-A407-TXT-19" x="303.0000" y="95.3000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">Серая вставка - только область поиска негорючей защиты. Толщина,</text>
<text id="P82-A407-TXT-20" x="303.0000" y="99.9000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">теплопередача вниз, опоры и дистанции до дерева неизвестны.</text>
<text id="P82-A407-TXT-21" x="303.0000" y="104.5000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">Плитка на досках не считается защитой.</text>
<text id="P82-A407-TXT-22" x="303.0000" y="119.6000" font-family="Arial" font-size="3.2" text-anchor="start" fill="#203936" font-weight="bold">Приборы</text>
<text id="P82-A407-TXT-23" x="303.0000" y="125.6000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">1000 мм мангала и 20 л казана заданы клиентом. Остальные размеры</text>
<text id="P82-A407-TXT-24" x="303.0000" y="130.2000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">примерочные; паспорт и посадка казана нужны до закупки.</text>
<text id="P82-A407-TXT-25" x="303.0000" y="145.3000" font-family="Arial" font-size="3.2" text-anchor="start" fill="#203936" font-weight="bold">Дым</text>
<text id="P82-A407-TXT-26" x="303.0000" y="151.3000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">Южный ветер - наблюдение клиента. Завихрения вокруг навеса и</text>
<text id="P82-A407-TXT-27" x="303.0000" y="155.9000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">попадание дыма в открытые створки не проверены. Визуал без</text>
<text id="P82-A407-TXT-28" x="303.0000" y="160.5000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">пламени и топлива.</text></svg>