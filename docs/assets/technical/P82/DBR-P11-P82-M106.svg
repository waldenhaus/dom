<text id="P82-M106-TXT-13" x="303.0000" y="59.0000" font-family="Arial" font-size="3.2" text-anchor="start" fill="#203936" font-weight="bold">Потолок</text>
<text id="P82-M106-TXT-14" x="303.0000" y="65.0000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">Светлая подшивка на пробной отметке +3.000. Это цель по чистой</text>
<text id="P82-M106-TXT-15" x="303.0000" y="69.6000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">высоте, не подтверждённый пирог кровли.</text>
<text id="P82-M106-TXT-16" x="303.0000" y="84.7000" font-family="Arial" font-size="3.2" text-anchor="start" fill="#203936" font-weight="bold">Три режима</text>
<text id="P82-M106-TXT-17" x="303.0000" y="90.7000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">L15 - стол; L16 - мойка и рабочая поверхность; L17 - проход к двум</text>
<text id="P82-M106-TXT-18" x="303.0000" y="95.3000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">входам. Отдельные группы и местное ручное управление.</text>
<text id="P82-M106-TXT-19" x="303.0000" y="110.4000" font-family="Arial" font-size="3.2" text-anchor="start" fill="#203936" font-weight="bold">Не только свет</text>
<text id="P82-M106-TXT-20" x="303.0000" y="116.4000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">Плитка и водяной пол с подходящим гликолем: отопление, датчик и</text>
<text id="P82-M106-TXT-21" x="303.0000" y="121.0000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">Wi-Fi сохраняются как задание HVAC. Дистанционный запуск не</text>
<text id="P82-M106-TXT-22" x="303.0000" y="125.6000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">заменяет местную защиту.</text>
<text id="P82-M106-TXT-23" x="303.0000" y="140.7000" font-family="Arial" font-size="3.2" text-anchor="start" fill="#203936" font-weight="bold">Среда и печь</text>
<text id="P82-M106-TXT-24" x="303.0000" y="146.7000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">Светильники/драйверы подбираются для фактических температуры и</text>
<text id="P82-M106-TXT-25" x="303.0000" y="151.3000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">влажности. Не вести трассы и подшивку через нерассчитанную</text>
<text id="P82-M106-TXT-26" x="303.0000" y="155.9000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">горячую зону.</text>
<text id="P82-M106-TXT-27" x="12.0000" y="251.0000" font-family="Arial" font-size="2.9" text-anchor="start" fill="#203936">Положение приборов и Z на M108 - примерка от местного чистого пола. Люксы, IP, мощности, кабели, автоматы, зоны влажных помещений и крепления требуют отдельного проекта.</text></svg>