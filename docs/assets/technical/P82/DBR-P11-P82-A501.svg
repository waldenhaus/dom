<text id="P82-A501-TXT-18" x="303.0000" y="59.0000" font-family="Arial" font-size="3.2" text-anchor="start" fill="#203936" font-weight="bold">Поверхности</text>
<text id="P82-A501-TXT-19" x="303.0000" y="65.0000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">Два ската основной крыши: по 62,1452 м² в графической модели.</text>
<text id="P82-A501-TXT-20" x="303.0000" y="69.6000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">Длина каждого ската 4420 мм при подъёме 1700. Проходки и раскрой</text>
<text id="P82-A501-TXT-21" x="303.0000" y="74.2000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">отдельно.</text>
<text id="P82-A501-TXT-22" x="303.0000" y="89.3000" font-family="Arial" font-size="3.2" text-anchor="start" fill="#203936" font-weight="bold">Кромки</text>
<text id="P82-A501-TXT-23" x="303.0000" y="95.3000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">Конёк 14060; две нижние кромки по 14060; четыре торца по 4420. Это</text>
<text id="P82-A501-TXT-24" x="303.0000" y="99.9000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">длины границ, не готовая спецификация доборов.</text>
<text id="P82-A501-TXT-25" x="303.0000" y="115.0000" font-family="Arial" font-size="3.2" text-anchor="start" fill="#203936" font-weight="bold">Навес</text>
<text id="P82-A501-TXT-26" x="303.0000" y="121.0000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">Односкатное намерение, но фактические уклон и водосток не</text>
<text id="P82-A501-TXT-27" x="303.0000" y="125.6000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">определены. Проекция 71,834 м² — не заказная площадь.</text>
<text id="P82-A501-TXT-28" x="303.0000" y="140.7000" font-family="Arial" font-size="3.2" text-anchor="start" fill="#203936" font-weight="bold">Каркас и проходки</text>
<text id="P82-A501-TXT-29" x="303.0000" y="146.7000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">Нет назначения опор, сечений, снегозадержателей, вырезов или</text>
<text id="P82-A501-TXT-30" x="303.0000" y="151.3000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">крепежа. Дымоход координируется отдельным листом M107.</text></svg>