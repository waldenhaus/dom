<text id="P82-A504-TXT-21" x="303.0000" y="59.0000" font-family="Arial" font-size="3.2" text-anchor="start" fill="#203936" font-weight="bold">Оболочка дома</text>
<text id="P82-A504-TXT-22" x="303.0000" y="65.0000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">Показан основной дом без перекрывающего его лаунджа/навеса,</text>
<text id="P82-A504-TXT-23" x="303.0000" y="69.6000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">чтобы видеть все проёмы. Общий облик — в 3D и плане оболочки.</text>
<text id="P82-A504-TXT-24" x="303.0000" y="84.7000" font-family="Arial" font-size="3.2" text-anchor="start" fill="#203936" font-weight="bold">Уровни — графические</text>
<text id="P82-A504-TXT-25" x="303.0000" y="90.7000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">Низ/верх проёмов и 3300/5000 сохранены из модели. Абсолютная</text>
<text id="P82-A504-TXT-26" x="303.0000" y="95.3000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">посадка на участок и монтажные отметки неизвестны.</text>
<text id="P82-A504-TXT-27" x="303.0000" y="110.4000" font-family="Arial" font-size="3.2" text-anchor="start" fill="#203936" font-weight="bold">Отделка</text>
<text id="P82-A504-TXT-28" x="303.0000" y="116.4000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">Фальцевая кровля; часть фасадов — окрашенная ЦСП с</text>
<text id="P82-A504-TXT-29" x="303.0000" y="121.0000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">вентиляционным зазором. Границы ЦСП, другая отделка, раскладка и</text>
<text id="P82-A504-TXT-30" x="303.0000" y="125.6000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">цвет не выбраны.</text>
<text id="P82-A504-TXT-31" x="303.0000" y="140.7000" font-family="Arial" font-size="3.2" text-anchor="start" fill="#203936" font-weight="bold">До производства</text>
<text id="P82-A504-TXT-32" x="303.0000" y="146.7000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">Требуются перемычки, простенки, монтажные зазоры, опоры W01,</text>
<text id="P82-A504-TXT-33" x="303.0000" y="151.3000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">стеклопакеты, открывание и допуски. Эти листы не заказ окон.</text>
<text id="P82-A504-TXT-34" x="12.0000" y="245.0000" font-family="Arial" font-size="2.9" text-anchor="start" fill="#203936">Высотные и площадные обмеры этой оболочки — сценарий графической модели, не спецификация изделий. Северный фасад специально развёрнут как реальный вид снаружи: D01 расположен левее D02.</text></svg>