<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" data-view-id="P82-M103"><rect x="0.0000" y="0.0000" width="420.0000" height="297.0000" fill="#fff" stroke="none" stroke-width="0.18"/>
<polyline points="10.0000,34.0000 410.0000,34.0000" fill="none" stroke="#203936" stroke-width="0.45" data-object-id="PAPER-CHECK-400MM"/>
<polyline points="10.0000,274.0000 410.0000,274.0000" fill="none" stroke="#203936" stroke-width="0.45"/>
<text id="P82-M103-TXT-1" x="10.0000" y="10.0000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#6d7a77">DBR-P11 / P82 / 08.09.2026 / ОТДЕЛКА · ПОТОЛКИ · СВЕТ</text>
<text id="P82-M103-TXT-2" x="10.0000" y="20.0000" font-family="Arial" font-size="5.0" text-anchor="start" fill="#203936" font-weight="bold">Сценарии света и понятное управление</text>
<text id="P82-M103-TXT-3" x="10.0000" y="29.0000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">Координационная примерка. Не инструкция для монтажа.</text>
<text id="P82-M103-TXT-4" x="10.0000" y="279.0000" font-family="Arial" font-size="2.5" text-anchor="start" fill="#8e462d" font-weight="bold">ДЛЯ СОГЛАСОВАНИЯ / НЕ ДЛЯ СТРОИТЕЛЬСТВА</text>
<text id="P82-M103-TXT-5" x="10.0000" y="285.0000" font-family="Arial" font-size="2.5" text-anchor="start" fill="#203936">P79: примерка отделки и света. Изделия, крепления, пироги и пожарные узлы не утверждены.</text>
<text id="P82-M103-TXT-6" x="10.0000" y="291.0000" font-family="Arial" font-size="2.5" text-anchor="start" fill="#6d7a77">Подготовка: Codex / AI. Проверяющий и утверждающий специалист: не назначены.</text>
<text id="P82-M103-TXT-7" x="356.0000" y="279.0000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936" font-weight="bold">P82-M103</text>
<text id="P82-M103-TXT-8" x="356.0000" y="286.0000" font-family="Arial" font-size="2.6" text-anchor="start" fill="#203936">М NTS / мм / A3</text>
<text id="P82-M103-TXT-9" x="12.0000" y="48.0000" font-family="Arial" font-size="3.5" text-anchor="start" fill="#203936" font-weight="bold">Гостиная / столовая</text>
<text id="P82-M103-TXT-10" x="12.0000" y="54.0000" font-family="Arial" font-size="3" text-anchor="start" fill="#203936">У входа из прихожей: общий свет и стол отдельно; рядом - отдельная клавиша/диммер карниза L04. У дивана - управление вечерним/ТВ-режимом. Яркий свет треков не нужен в режиме просмотра ТВ.</text>
<text id="P82-M103-TXT-11" x="12.0000" y="67.2000" font-family="Arial" font-size="3.5" text-anchor="start" fill="#203936" font-weight="bold">Кухня</text>
<text id="P82-M103-TXT-12" x="12.0000" y="73.2000" font-family="Arial" font-size="3" text-anchor="start" fill="#203936">Трек L05 - рабочая зона; подсветку столешницы и свет у острова дополнительно проверить с кухонной мебелью. Готовка, еда и вечер - разные группы, а не один выключатель на весь объём.</text>
<text id="P82-M103-TXT-13" x="12.0000" y="86.4000" font-family="Arial" font-size="3.5" text-anchor="start" fill="#203936" font-weight="bold">Спальни</text>
<text id="P82-M103-TXT-14" x="12.0000" y="92.4000" font-family="Arial" font-size="3" text-anchor="start" fill="#203936">Общий свет L07/L09, шкафы L08/L10 отдельно. Прикроватное чтение слева/справа и низкий ночной свет P78 сохраняются; выключение общего света у двери и кровати.</text>
<text id="P82-M103-TXT-15" x="12.0000" y="105.6000" font-family="Arial" font-size="3.5" text-anchor="start" fill="#203936" font-weight="bold">Прихожая / санузлы</text>
<text id="P82-M103-TXT-16" x="12.0000" y="111.6000" font-family="Arial" font-size="3" text-anchor="start" fill="#203936">L06 у входа, ручное включение и отдельный низкий ночной маршрут. В санузлах общий свет L11-L14 отдельно от зеркала; датчик не должен гасить свет во время душа. Места клавиш сверить с дверями и мокрыми зонами.</text>
<text id="P82-M103-TXT-17" x="12.0000" y="124.8000" font-family="Arial" font-size="3.5" text-anchor="start" fill="#203936" font-weight="bold">Лаундж</text>
<text id="P82-M103-TXT-18" x="12.0000" y="130.8000" font-family="Arial" font-size="3" text-anchor="start" fill="#203936">У D01 и D02 доступно управление L17 проходом; стол L15 и рабочая линия L16 независимо. Ночной вход без яркого света на весь стол. Тёплый пол управляется отдельно от света.</text>
<text id="P82-M103-TXT-19" x="12.0000" y="144.0000" font-family="Arial" font-size="3.5" text-anchor="start" fill="#203936" font-weight="bold">Без интернета</text>
<text id="P82-M103-TXT-20" x="12.0000" y="150.0000" font-family="Arial" font-size="3" text-anchor="start" fill="#203936">Базовое включение/выключение работает локально. Wi-Fi - дополнительное управление. Совместимость диммеров/драйверов, поведение после сбоя и минимальная яркость проверяются на выбранных изделиях. Клавиши Sxx на плане питания P78 пока позиции,</text>
<text id="P82-M103-TXT-21" x="12.0000" y="154.7000" font-family="Arial" font-size="3" text-anchor="start" fill="#203936">назначение групп уточнено здесь.</text></svg>