<text id="P82-A502-TXT-18" x="303.0000" y="59.0000" font-family="Arial" font-size="3.2" text-anchor="start" fill="#203936" font-weight="bold">Основная крыша</text>
<text id="P82-A502-TXT-19" x="303.0000" y="65.0000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">Графический подъём 1700 на полупролёте 4080. Наклон 22,619865°.</text>
<text id="P82-A502-TXT-20" x="303.0000" y="69.6000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">Длина ската 4420. Это обмер; не расчёт стропил.</text>
<text id="P82-A502-TXT-21" x="303.0000" y="84.7000" font-family="Arial" font-size="3.2" text-anchor="start" fill="#203936" font-weight="bold">Тепловой контур</text>
<text id="P82-A502-TXT-22" x="303.0000" y="90.7000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">Этот разрез проходит восточнее свода: здесь потолок +3.000.</text>
<text id="P82-A502-TXT-23" x="303.0000" y="95.3000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">Западная гостиная по скатам показана на A402. Стык тепловых</text>
<text id="P82-A502-TXT-24" x="303.0000" y="99.9000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">контуров не разработан.</text>
<text id="P82-A502-TXT-25" x="303.0000" y="115.0000" font-family="Arial" font-size="3.2" text-anchor="start" fill="#203936" font-weight="bold">Северный навес</text>
<text id="P82-A502-TXT-26" x="303.0000" y="121.0000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">Линия +3.100 — только опорная графическая плоскость. Требуется</text>
<text id="P82-A502-TXT-27" x="303.0000" y="125.6000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">односкатная крыша; фактический уклон, толщина и водоотвод ещё не</text>
<text id="P82-A502-TXT-28" x="303.0000" y="130.2000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">определены.</text>
<text id="P82-A502-TXT-29" x="303.0000" y="145.3000" font-family="Arial" font-size="3.2" text-anchor="start" fill="#203936" font-weight="bold">Ниже чистого пола</text>
<text id="P82-A502-TXT-30" x="303.0000" y="151.3000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">Пирог пола, цоколь, фундамент и уровень земли неизвестны.</text>
<text id="P82-A502-TXT-31" x="303.0000" y="155.9000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">Условный ±0.000 не привязан к Балтийской системе высот.</text>
<text id="P82-A502-TXT-32" x="12.0000" y="247.0000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">Нельзя вырезать стропила или заказывать кровельные картины по этому разрезу: отсутствуют узлы, толщины, опоры, расчётные прогибы и монтажные допуски. Лаундж периодически отапливается и рассчитывается отдельно.</text></svg>