<text id="P82-A403-TXT-18" x="220.0000" y="50.0000" font-family="Arial" font-size="3" text-anchor="start" fill="#203936">Север слева; юг справа. Вид из кухни на восточную стену.</text>
<text id="P82-A403-TXT-19" x="220.0000" y="77.0000" font-family="Arial" font-size="3" text-anchor="start" fill="#203936">F59: пробный модуль 600 × 580 × 850, фронт обращён на запад. F60: рабочая поверхность на 900. Это не паспорт</text>
<text id="P82-A403-TXT-20" x="220.0000" y="82.0000" font-family="Arial" font-size="3" text-anchor="start" fill="#203936">выбранного морозильника.</text>
<text id="P82-A403-TXT-21" x="220.0000" y="119.0000" font-family="Arial" font-size="3" text-anchor="start" fill="#203936">Высокий морозильник в прежнем ряду либо примыкает к варочной, либо перекрывает проход. Для двух высоких приборов</text>
<text id="P82-A403-TXT-22" x="220.0000" y="124.0000" font-family="Arial" font-size="3" text-anchor="start" fill="#203936">нужна отдельная перекомпоновка кухни.</text>
<text id="P82-A403-TXT-23" x="220.0000" y="162.0000" font-family="Arial" font-size="3" text-anchor="start" fill="#203936">Проход у острова с закрытой техникой 900. При условной дверце580 остаётся320 до острова: это не доказанный</text>
<text id="P82-A403-TXT-24" x="220.0000" y="167.0000" font-family="Arial" font-size="3" text-anchor="start" fill="#203936">сервисный/пользовательский проход.</text>
<text id="P82-A403-TXT-25" x="12.0000" y="244.0000" font-family="Arial" font-size="3" text-anchor="start" fill="#203936">Проверить конкретные модели: тепло от варочной, вентиляция, полный выкат ящиков, место человеку, доступ к розетке и замена прибора. Электрическая точка F59 отдельная; цепь и монтажная высота TBC.</text></svg>