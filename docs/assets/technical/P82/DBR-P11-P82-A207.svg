<text id="P82-A207-TXT-34" x="303.0000" y="62.0000" font-family="Arial" font-size="3.2" text-anchor="start" fill="#203936" font-weight="bold">Замена одного ряда</text>
<text id="P82-A207-TXT-35" x="303.0000" y="68.0000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">F50-F53 убраны. F61: диван 3000 × 650, спинка 880. Четыре южных</text>
<text id="P82-A207-TXT-36" x="303.0000" y="72.6000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">стула F54-F57 и стол F47 не сдвинуты.</text>
<text id="P82-A207-TXT-37" x="303.0000" y="87.7000" font-family="Arial" font-size="3.2" text-anchor="start" fill="#203936" font-weight="bold">За спинкой</text>
<text id="P82-A207-TXT-38" x="303.0000" y="93.7000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">600 до контрольной линии стекла; 540 до внутренней графической</text>
<text id="P82-A207-TXT-39" x="303.0000" y="98.3000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">грани рамы. Это не проход. Створки, ручки и шторы ещё не</text>
<text id="P82-A207-TXT-40" x="303.0000" y="102.9000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">подобраны.</text>
<text id="P82-A207-TXT-41" x="303.0000" y="118.0000" font-family="Arial" font-size="3.2" text-anchor="start" fill="#203936" font-weight="bold">Восемь мест — намерение</text>
<text id="P82-A207-TXT-42" x="303.0000" y="124.0000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">На диване 2880 между подлокотниками: 4 × 720. К средним местам</text>
<text id="P82-A207-TXT-43" x="303.0000" y="128.6000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">садятся с торца и сдвигаются вдоль сиденья. Отдельного выхода</text>
<text id="P82-A207-TXT-44" x="303.0000" y="133.2000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">каждого места нет.</text>
<text id="P82-A207-TXT-45" x="303.0000" y="148.3000" font-family="Arial" font-size="3.2" text-anchor="start" fill="#203936" font-weight="bold">Подходы с торцов</text>
<text id="P82-A207-TXT-46" x="303.0000" y="154.3000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">Зелёные зоны: два подхода по 1200, южная полоса 1000 и связь к D01</text>
<text id="P82-A207-TXT-47" x="303.0000" y="158.9000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">шириной 900. Проверены только корпуса в закрытой расстановке.</text>
<text id="P82-A207-TXT-48" x="303.0000" y="174.0000" font-family="Arial" font-size="3.2" text-anchor="start" fill="#203936" font-weight="bold">Что ещё проверить</text>
<text id="P82-A207-TXT-49" x="303.0000" y="180.0000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">Отодвинутые стулья, люди, створки и столовые опоры — на</text>
<text id="P82-A207-TXT-50" x="303.0000" y="184.6000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">выбранных изделиях. Конфликт рабочей зоны мойки с маршрутом и</text>
<text id="P82-A207-TXT-51" x="303.0000" y="189.2000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">пожарные вопросы P80 остаются открыты.</text>
<text id="P82-A207-TXT-52" x="12.0000" y="235.0000" font-family="Arial" font-size="2.9" text-anchor="start" fill="#203936">* Размеры маршрутов — геометрия этой примерки, не нормативные минимумы. Н — сохранённая ниша для принадлежностей из P63 между печью и столешницей, как в 3D. Свет, печь, дымоход, мойка, два входа и расширенный контур дома сохранены.</text></svg>