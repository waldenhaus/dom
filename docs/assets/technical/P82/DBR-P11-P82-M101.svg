<text id="P82-M101-TXT-24" x="303.0000" y="59.0000" font-family="Arial" font-size="3.2" text-anchor="start" fill="#203936" font-weight="bold">Отделка потолков</text>
<text id="P82-M101-TXT-25" x="303.0000" y="65.0000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">Светлая матовая вагонка в гостиной, кухне, спальнях и прихожей;</text>
<text id="P82-M101-TXT-26" x="303.0000" y="69.6000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">санузлы - белое матовое натяжное полотно.</text>
<text id="P82-M101-TXT-27" x="303.0000" y="84.7000" font-family="Arial" font-size="3.2" text-anchor="start" fill="#203936" font-weight="bold">Деревянный потолок</text>
<text id="P82-M101-TXT-28" x="303.0000" y="90.7000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">Треки и накладные светильники. Крепления в согласованное</text>
<text id="P82-M101-TXT-29" x="303.0000" y="95.3000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">основание; проводка в доступной сервисной зоне. Глубокие врезки в</text>
<text id="P82-M101-TXT-30" x="303.0000" y="99.9000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">утепление не назначены.</text>
<text id="P82-M101-TXT-31" x="303.0000" y="115.0000" font-family="Arial" font-size="3.2" text-anchor="start" fill="#203936" font-weight="bold">Мягкий вечер</text>
<text id="P82-M101-TXT-32" x="303.0000" y="121.0000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">L04 - самостоятельная скрытая подсветка карниза. Свет на дерево</text>
<text id="P82-M101-TXT-33" x="303.0000" y="125.6000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">требует макета, чтобы проверить блики, полосы и яркость.</text>
<text id="P82-M101-TXT-34" x="303.0000" y="140.7000" font-family="Arial" font-size="3.2" text-anchor="start" fill="#203936" font-weight="bold">Дополнительные слои</text>
<text id="P82-M101-TXT-35" x="303.0000" y="146.7000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">Зеркала, прикроватное чтение, подсветка ТВ и ночного маршрута P78</text>
<text id="P82-M101-TXT-36" x="303.0000" y="151.3000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">сохранены отдельно в реестре. Не заменяются потолочным светом.</text>
<text id="P82-M101-TXT-37" x="12.0000" y="251.0000" font-family="Arial" font-size="2.9" text-anchor="start" fill="#203936">Положение приборов и Z на M108 - примерка от местного чистого пола. Люксы, IP, мощности, кабели, автоматы, зоны влажных помещений и крепления требуют отдельного проекта.</text></svg>