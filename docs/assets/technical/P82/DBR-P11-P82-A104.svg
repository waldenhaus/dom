<rect x="162.5096" y="225.9860" width="8.9808" height="3.6360" fill="#fff" stroke="none"/>
<text id="P82-A104-TXT-13" x="167.0000" y="228.7000" font-family="Arial" font-size="2.8" text-anchor="middle" fill="#203936">11560</text>
<text id="P82-A104-TXT-14" x="303.0000" y="59.0000" font-family="Arial" font-size="3.2" text-anchor="start" fill="#203936" font-weight="bold">Вылеты — предложение</text>
<text id="P82-A104-TXT-15" x="303.0000" y="65.0000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">Сохранены относительно новых наружных стен: запад 2500, восток</text>
<text id="P82-A104-TXT-16" x="303.0000" y="69.6000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">навеса 600. Это геометрия P76, не расчёт несущих элементов.</text>
<text id="P82-A104-TXT-17" x="303.0000" y="84.7000" font-family="Arial" font-size="3.2" text-anchor="start" fill="#203936" font-weight="bold">Основная крыша</text>
<text id="P82-A104-TXT-18" x="303.0000" y="90.7000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">Проекция 14060 × 8160. Конёк Y=4080. Графические уровни 3300/5000</text>
<text id="P82-A104-TXT-19" x="303.0000" y="95.3000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">сохранены. Площадь покрытия не равна проекции.</text>
<text id="P82-A104-TXT-20" x="303.0000" y="110.4000" font-family="Arial" font-size="3.2" text-anchor="start" fill="#203936" font-weight="bold">Фундамент и каркас</text>
<text id="P82-A104-TXT-21" x="303.0000" y="116.4000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">Передан новый внешний контур. Опоры, пролёты, нагрузки, сечения,</text>
<text id="P82-A104-TXT-22" x="303.0000" y="121.0000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">армирование и деформации требуют расчёта конструктора.</text>
<text id="P82-A104-TXT-23" x="303.0000" y="136.1000" font-family="Arial" font-size="3.2" text-anchor="start" fill="#203936" font-weight="bold">Лаундж и дымоход</text>
<text id="P82-A104-TXT-24" x="303.0000" y="142.1000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">Лаундж и печь не сдвинуты. Ось дымохода — конёк: 4480 по плану.</text>
<text id="P82-A104-TXT-25" x="303.0000" y="146.7000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">Высота трубы и проходка не утверждены.</text></svg>