<text id="P82-A412-TXT-1" x="10.0000" y="10.0000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#6d7a77">DBR-P11 / P82 / 08.09.2026 / ОТДЕЛКА И ДИВАН У СТЕКЛА</text>
<text id="P82-A412-TXT-2" x="10.0000" y="20.0000" font-family="Arial" font-size="5.0" text-anchor="start" fill="#203936" font-weight="bold">Диван: высоты и логика отделки стен</text>
<text id="P82-A412-TXT-3" x="10.0000" y="29.0000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">Габариты мебели — проектное предложение, не выбранная модель. Развёртка дивана: взгляд с юга на север.</text>
<text id="P82-A412-TXT-4" x="10.0000" y="279.0000" font-family="Arial" font-size="2.5" text-anchor="start" fill="#8e462d" font-weight="bold">ДЛЯ СОГЛАСОВАНИЯ / НЕ ДЛЯ СТРОИТЕЛЬСТВА</text>
<text id="P82-A412-TXT-5" x="10.0000" y="285.0000" font-family="Arial" font-size="2.5" text-anchor="start" fill="#203936">P81: примерка мебели и фактуры. Изделия, отделка, открывание стекла и пожарные отступы: TBC.</text>
<text id="P82-A412-TXT-6" x="10.0000" y="291.0000" font-family="Arial" font-size="2.5" text-anchor="start" fill="#6d7a77">Подготовка: Codex / AI. Проверяющий и утверждающий специалист: не назначены.</text>
<text id="P82-A412-TXT-7" x="356.0000" y="279.0000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936" font-weight="bold">P82-A412</text>
<text id="P82-A412-TXT-8" x="356.0000" y="286.0000" font-family="Arial" font-size="2.6" text-anchor="start" fill="#203936">М 1:20 / NTS / мм / A3</text>
<rect x="109.3077" y="83.1860" width="7.3846" height="3.6360" fill="#fff" stroke="none"/>
<text id="P82-A412-TXT-9" x="113.0000" y="85.9000" font-family="Arial" font-size="2.8" text-anchor="middle" fill="#203936">3000</text>
<rect x="201.7000" y="117.1860" width="5.7885" height="3.6360" fill="#fff" stroke="none"/>
<text id="P82-A412-TXT-10" x="202.2000" y="119.9000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">880</text>
<rect x="20.5115" y="127.1860" width="5.7885" height="3.6360" fill="#fff" stroke="none"/>
<text id="P82-A412-TXT-11" x="25.8000" y="129.9000" font-family="Arial" font-size="2.8" text-anchor="end" fill="#203936">480</text>
<text id="P82-A412-TXT-12" x="38.0000" y="158.0000" font-family="Arial" font-size="3" text-anchor="start" fill="#203936">2 модуля по 1500 · 4 места по 720 между подлокотниками</text>
<text id="P82-A412-TXT-13" x="38.0000" y="166.0000" font-family="Arial" font-size="3" text-anchor="start" fill="#203936">Глубина корпуса 650; подушка сиденья 500. Подушка спинки выступает над ней на 40: на её уровне остаётся 460. Низкая спинка 880. Модули для уборки</text>
<text id="P82-A412-TXT-14" x="38.0000" y="170.8000" font-family="Arial" font-size="3" text-anchor="start" fill="#203936">отодвигаются; массу и проход доставки проверить при выборе.</text>
<text id="P82-A412-TXT-15" x="38.0000" y="190.0000" font-family="Arial" font-size="3" text-anchor="start" fill="#203936">В модели: сиденье 480, верх стола 770, разность 290. Между передней гранью дивана и столешницей в плане 50. Это не доказанная эргономика: нужны реальные</text>
<text id="P82-A412-TXT-16" x="38.0000" y="194.8000" font-family="Arial" font-size="3" text-anchor="start" fill="#203936">подушки, опоры и пространство для коленей.</text>
<text id="P82-A412-TXT-17" x="303.0000" y="59.0000" font-family="Arial" font-size="3.2" text-anchor="start" fill="#203936" font-weight="bold">Стены: что показываем</text>
<text id="P82-A412-TXT-18" x="303.0000" y="65.0000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">Широкая горизонтальная имитация бруса. Графический шаг 200.</text>
<text id="P82-A412-TXT-19" x="303.0000" y="69.6000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">Молочная основа; серо-оливковая стена ТВ и стена за изголовьем</text>
<text id="P82-A412-TXT-20" x="303.0000" y="74.2000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">мастер-спальни.</text>
<text id="P82-A412-TXT-21" x="303.0000" y="89.3000" font-family="Arial" font-size="3.2" text-anchor="start" fill="#203936" font-weight="bold">Что стало заметнее</text>
<text id="P82-A412-TXT-22" x="303.0000" y="95.3000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">Фаска, тень горизонтального стыка и продольный рисунок древесины.</text>
<text id="P82-A412-TXT-23" x="303.0000" y="99.9000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">Цвета P80 сохранены; потолочная вагонка — другой, более узкий</text>
<text id="P82-A412-TXT-24" x="303.0000" y="104.5000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">рисунок.</text>
<text id="P82-A412-TXT-25" x="303.0000" y="119.6000" font-family="Arial" font-size="3.2" text-anchor="start" fill="#203936" font-weight="bold">Исключения</text>
<text id="P82-A412-TXT-26" x="303.0000" y="125.6000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">Фартук кухни остаётся гладким. Санузлы, фасад и непроверенная</text>
<text id="P82-A412-TXT-27" x="303.0000" y="130.2000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">теплозащита у печи не покрываются новым материалом</text>
<text id="P82-A412-TXT-28" x="303.0000" y="134.8000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">автоматически.</text>
<text id="P82-A412-TXT-29" x="303.0000" y="149.9000" font-family="Arial" font-size="3.2" text-anchor="start" fill="#203936" font-weight="bold">Для образца</text>
<text id="P82-A412-TXT-30" x="303.0000" y="155.9000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">Профиль, порода, толщина, покрытие и точный цвет ещё не выбраны.</text>
<text id="P82-A412-TXT-31" x="303.0000" y="160.5000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">Фактура процедурная: не каталог изделия и не узел крепления.</text>
<text id="P82-A412-TXT-32" x="303.0000" y="165.1000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">Утвердить физический образец при вашем свете.</text>
<text id="P82-A412-TXT-33" x="12.0000" y="247.0000" font-family="Arial" font-size="2.9" text-anchor="start" fill="#203936">Отделка показана материалом на сохранённых гранях модели. Толщина доски/обрешётки, акустическое основание и чистые размеры после выбора системы требуют отдельной координации.</text></svg>