<text id="P82-M104-TXT-18" x="303.0000" y="48.0000" font-family="Arial" font-size="3.2" text-anchor="start" fill="#203936" font-weight="bold">T1 · требование250л</text>
<text id="P82-M104-TXT-19" x="303.0000" y="54.0000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">Единого выбранного корпуса250л нет. Привязка к восточной грани10860</text>
<text id="P82-M104-TXT-20" x="303.0000" y="58.5000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">известна, тело, подводки, масса и монтажная сборка — нет.</text>
<text id="P82-M104-TXT-21" x="303.0000" y="71.5000" font-family="Arial" font-size="3.2" text-anchor="start" fill="#203936" font-weight="bold">B100 · только сравнение</text>
<text id="P82-M104-TXT-22" x="303.0000" y="77.5000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">Пунктиром невыбранная100л-примерка288×510, h1305. Это не решение</text>
<text id="P82-M104-TXT-23" x="303.0000" y="82.0000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">запроса250л и не проверенный сервис.</text>
<text id="P82-M104-TXT-24" x="303.0000" y="95.0000" font-family="Arial" font-size="3.2" text-anchor="start" fill="#203936" font-weight="bold">Что ещё не размещено</text>
<text id="P82-M104-TXT-25" x="303.0000" y="101.0000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">Две колонны очистки железа/H₂S, солевой бак, точные байпасы и</text>
<text id="P82-M104-TXT-26" x="303.0000" y="105.5000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">смена загрузки. Их нельзя скрывать или объявлять влезшими.</text>
<text id="P82-M104-TXT-27" x="303.0000" y="118.5000" font-family="Arial" font-size="3.2" text-anchor="start" fill="#203936" font-weight="bold">Вход в душ</text>
<text id="P82-M104-TXT-28" x="303.0000" y="124.5000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">Номинальная створка600 внутрь показана как намерение. Чистый вход,</text>
<text id="P82-M104-TXT-29" x="303.0000" y="129.0000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">фурнитура, спасательный доступ и окноW03 TBC.</text>
<text id="P82-M104-TXT-30" x="18.0000" y="211.0000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">F15 душ · F16 стиралка/сушилка · F17 WC · F18 умывальник · F20 полотенцесушитель</text>
<text id="P82-M104-TXT-31" x="18.0000" y="225.0000" font-family="Arial" font-size="3" text-anchor="start" fill="#203936">Северное оборудование показано на M105 только по фронтальным ширинам/высотам; его глубина неизвестна. Путь доставки и обслуживания250л не подтверждён. Ни схемы</text>
<text id="P82-M104-TXT-32" x="18.0000" y="229.8000" font-family="Arial" font-size="3" text-anchor="start" fill="#203936">труб, ни выпусков канализации по этим символам делать нельзя.</text></svg>