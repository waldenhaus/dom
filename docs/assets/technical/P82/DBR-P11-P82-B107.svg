<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" data-view-id="P82-B107"><rect x="0.0000" y="0.0000" width="420.0000" height="297.0000" fill="#fff" stroke="none" stroke-width="0.18"/>
<polyline points="10.0000,34.0000 410.0000,34.0000" fill="none" stroke="#203936" stroke-width="0.45" data-object-id="PAPER-CHECK-400MM"/>
<polyline points="10.0000,274.0000 410.0000,274.0000" fill="none" stroke="#203936" stroke-width="0.45"/>
<text id="P82-B107-TXT-1" x="10.0000" y="10.0000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#6d7a77">DBR-P11 / P82 / 08.09.2026 / РАСШИРЕННЫЙ ДОМ · ПОТОЛОК И КУХНЯ P78</text>
<text id="P82-B107-TXT-2" x="10.0000" y="20.0000" font-family="Arial" font-size="5.0" text-anchor="start" fill="#203936" font-weight="bold">Реестр обязательных уточнений перед производством</text>
<text id="P82-B107-TXT-3" x="10.0000" y="29.0000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936">Задание для предложения подрядчика. Не разрешение на изготовление или строительство.</text>
<text id="P82-B107-TXT-4" x="10.0000" y="279.0000" font-family="Arial" font-size="2.5" text-anchor="start" fill="#8e462d" font-weight="bold">ДЛЯ СОГЛАСОВАНИЯ / НЕ ДЛЯ СТРОИТЕЛЬСТВА</text>
<text id="P82-B107-TXT-5" x="10.0000" y="285.0000" font-family="Arial" font-size="2.5" text-anchor="start" fill="#203936">Стены 400/200 — резервы. Контур P76 сохранён; потолок и кухня P78. Узлы и заказ: TBC.</text>
<text id="P82-B107-TXT-6" x="10.0000" y="291.0000" font-family="Arial" font-size="2.5" text-anchor="start" fill="#6d7a77">Подготовка: Codex / AI. Проверяющий и утверждающий специалист: не назначены.</text>
<text id="P82-B107-TXT-7" x="356.0000" y="279.0000" font-family="Arial" font-size="2.8" text-anchor="start" fill="#203936" font-weight="bold">P82-B107</text>
<text id="P82-B107-TXT-8" x="356.0000" y="286.0000" font-family="Arial" font-size="2.6" text-anchor="start" fill="#203936">М NTS / мм / A3</text>
<text id="P82-B107-TXT-9" x="12.0000" y="49.0000" font-family="Arial" font-size="3.5" text-anchor="start" fill="#203936" font-weight="bold">Участок и основание — конструктор / геотехник</text>
<text id="P82-B107-TXT-10" x="12.0000" y="55.0000" font-family="Arial" font-size="3" text-anchor="start" fill="#203936">Подписанный полный отчёт; актуальность топо и границ; привязка пятна и скважин; отметки/сток/вода; действующие расчётные нормы; грунтовая модель, нагрузки и реакции. Без них производство фундамента не выпускать.</text>
<text id="P82-B107-TXT-11" x="12.0000" y="69.4000" font-family="Arial" font-size="3.5" text-anchor="start" fill="#203936" font-weight="bold">Архитектура — архитектор / заказчик</text>
<text id="P82-B107-TXT-12" x="12.0000" y="75.4000" font-family="Arial" font-size="3" text-anchor="start" fill="#203936">Принять наружные составы в резерве 400 мм и внутренние в 200 мм; чистые размеры после мокрых слоёв; монтажные проёмы и открывание; пороги двух входов в лаундж; узкие простенки D01/W03/W04/D04; карта ЦСП/прочей отделки и цвета.</text>
<text id="P82-B107-TXT-13" x="12.0000" y="89.8000" font-family="Arial" font-size="3.5" text-anchor="start" fill="#203936" font-weight="bold">Каркас/кровля — завод / конструктор</text>
<text id="P82-B107-TXT-14" x="12.0000" y="95.8000" font-family="Arial" font-size="3" text-anchor="start" fill="#203936">Несущая схема, класс и влажность древесины, сечения/шаг, диафрагмы, опоры выносов, узлы и крепёж; раскрой фальца; противопожарные примыкания; теплотехника/влагорежим; допуски крупного остекления.</text>
<text id="P82-B107-TXT-15" x="12.0000" y="110.2000" font-family="Arial" font-size="3.5" text-anchor="start" fill="#203936" font-weight="bold">Инженерия — проектировщики систем</text>
<text id="P82-B107-TXT-16" x="12.0000" y="116.2000" font-family="Arial" font-size="3" text-anchor="start" fill="#203936">Ввод и выделенная мощность, фазы/заземление, группы и защиты, трассы/высоты; вода/канализация/зимняя мойка; вентиляция/вытяжка; отопление дома и отдельного лаунджа; точные изделия T1/робот/инсталляции, сервис и закладные.</text>
<text id="P82-B107-TXT-17" x="12.0000" y="130.6000" font-family="Arial" font-size="3.5" text-anchor="start" fill="#203936" font-weight="bold">Приёмка и выпуск</text>
<text id="P82-B107-TXT-18" x="12.0000" y="136.6000" font-family="Arial" font-size="3" text-anchor="start" fill="#203936">После согласования — независимая проверка расчётов и междисциплинарных конфликтов, спецификации с ревизией, перечень скрытых работ, испытания, исполнительные планы и передача паспортов. P78 имеет только статус для согласования/расчёта</text>
<text id="P82-B107-TXT-19" x="12.0000" y="141.5000" font-family="Arial" font-size="3" text-anchor="start" fill="#203936">предложения.</text></svg>