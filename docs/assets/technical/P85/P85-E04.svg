><rect x="35.700" y="124.900" width="20.044" height="3.600" fill="#ffffff" stroke="none" stroke-width="0.3" /><text x="36.200" y="127.500" font-size="2.6" font-weight="700" fill="#176c73" text-anchor="start">P17 / SW13 →</text></g><circle cx="15.000" cy="146.000" r="1.2" fill="white" stroke="#9c5140" stroke-width="0.4"/><text x="18.000" y="147.000" font-size="2.5" font-weight="400" fill="#9c5140" text-anchor="start">P84</text><rect x="34.000" y="144.800" width="2.400" height="2.400" fill="#176c73" stroke="none" stroke-width="0.3" /><text x="39.000" y="147.000" font-size="2.5" font-weight="400" fill="#176c73" text-anchor="start">предложение P85</text><text x="86.000" y="147.000" font-size="2.3" font-weight="400" fill="#697878" text-anchor="start">Дуги дверей - пробные</text><text x="175.000" y="55.000" font-size="2.8" font-weight="700" fill="#9c5140" text-anchor="start">ПРОБЛЕМА</text><text x="175.000" y="59.500" font-size="3.8" font-weight="400" fill="#9c5140" text-anchor="start">Розетки и клавиши не соосны; высоты мебели и бра неизвестны.</text><text x="175.000" y="67.300" font-size="2.8" font-weight="700" fill="#176c73" text-anchor="start">ПРЕДЛОЖЕНИЕ</text><text x="175.000" y="71.800" font-size="3.8" font-weight="400" fill="#176c73" text-anchor="start">Четыре вертикальные пары по центрам тумб: Y 4985/7335. Розетки 650 мм*, управление 950 мм*; бра отдельно.</text><text x="175.000" y="79.600" font-size="2.8" font-weight="700" fill="#697878" text-anchor="start">АЛЬТЕРНАТИВА</text><text x="175.000" y="84.100" font-size="3.8" font-weight="400" fill="#697878" text-anchor="start">Блоки в неподвижной панели выбранного изголовья.</text><text x="175.000" y="91.900" font-size="2.8" font-weight="700" fill="#17383c" text-anchor="start">РЕШЕНИЕ ALEX</text><text x="175.000" y="96.400" font-size="3.8" font-weight="400" fill="#17383c" text-anchor="start">Принять такую схему с каждой стороны обеих кроватей?</text><text x="175.000" y="104.200" font-size="2.8" font-weight="700" fill="#697878" text-anchor="start">НУЖНЫ ДАННЫЕ</text><text x="175.000" y="108.700" font-size="3.8" font-weight="400" fill="#697878" text-anchor="start">Реальные тумбы, изголовье, бра, рамки и положение лёжа.</text><text x="12.000" y="153.000" font-size="2.3" font-weight="400" fill="#697878" text-anchor="start">Вопросы P84: 012, 018</text><line x1="12.000" y1="163.000" x2="408.000" y2="163.000" stroke="#d0ddd7" stroke-width="0.3"/><text x="12.000" y="171.000" font-size="4.4" font-weight="700" fill="#176c73" text-anchor="start">P85-D-08  Северный диван: нужна ли местная зарядка</text><defs><clipPath id="P85-E04-plan-1"><rect x="12" y="176" width="153" height="90"/></clipPath></defs><g clip-path="url(#P85-E04-plan-1)"><polygon points="-1.500,208.188 181.750,208.188 181.750,269.438 -1.500,269.438" fill="#f5f5ef" stroke="#b7bdae" stroke-width="0.2" /><polygon points="33.500,208.188 138.500,208.188 138.500,269.438 33.500,269.438" fill="#f4f7f4" stroke="#9bafaa" stroke-width="0.4" /><polygon points="52.250,224.438 87.250,224.438 87.250,236.938 52.250,236.938" fill="#e9ede7" stroke="#a1b1a6" stroke-width="0.2" /><polygon points="51.000,215.688 88.500,215.688 88.500,223.812 51.000,223.812" fill="#e9ede7" stroke="#a1b1a6" stroke-width="0.2" /></g><text x="162.000" y="182.000" font-size="3.5" font-weight="700" fill="#176c73" text-anchor="end">С ↑</text><text x="14.000" y="264.000" font-size="2.5" font-weight="400" fill="#697878" text-anchor="start">Масштаб 1:80</text><line x1="77.000" y1="262.000" x2="89.500" y2="262.000" stroke="#17383c" stroke-width="0.6"/><text x="83.250" y="260.000" font-size="2.3" font-weight="400" fill="#17383c" text-anchor="middle">1000 мм</text><g clip-path="url(#P85-E04-plan-1)"><polygon points="51.000,215.688 88.500,215.688 88.500,223.812 51.000,223.812" fill="none" stroke="#176c73" stroke-width="0.5" stroke-dasharray="1.5,1"/><rect x="54.250" y="222.350" width="34.924" height="3.400" fill="#ffffff" stroke="none" stroke-width="0.3" /><text x="54.750" y="224.750" font-size="2.4" font-weight="700" fill="#176c73" text-anchor="start">Диван / точка не задана</text><circle cx="138.500" cy="229.438" r="1.4" fill="white" stroke="#9c5140" stroke-width="0.5"/><rect x="140.700" y="224.838" width="5.700" height="3.600" fill="#ffffff" stroke="none" stroke-width="0.3" /><text x="141.200" y="227.438" font-size="2.6" font-weight="700" fill="#9c5140" text-anchor="start">P31</text></g><circle cx="15.000" cy="270.000" r="1.2" fill="white" stroke="#9c5140" stroke-width="0.4"/><text x="18.000" y="271.000" font-size="2.5" font-weight="400" fill="#9c5140" text-anchor="start">P84</text><rect x="34.000" y="268.800" width="2.400" height="2.400" fill="#176c73" stroke="none" stroke-width="0.3" /><text x="39.000" y="271.000" font-size="2.5" font-weight="400" fill="#176c73" text-anchor="start">предложение P85</text><text x="86.000" y="271.000" font-size="2.3" font-weight="400" fill="#697878" text-anchor="start">Дуги дверей - пробные</text><text x="175.000" y="179.000" font-size="2.8" font-weight="700" fill="#9c5140" text-anchor="start">ПРОБЛЕМА</text><text x="175.000" y="183.500" font-size="3.8" font-weight="400" fill="#9c5140" text-anchor="start">У дивана стекло; местной зарядки нет, P31 находится на восточной стене.</text><text x="175.000" y="191.300" font-size="2.8" font-weight="700" fill="#176c73" text-anchor="start">ПРЕДЛОЖЕНИЕ</text><text x="175.000" y="195.800" font-size="3.8" font-weight="400" fill="#176c73" text-anchor="start">Если нужна: одна обслуживаемая точка в неподвижном мебельном элементе со скрытым подводом.</text><text x="175.000" y="203.600" font-size="2.8" font-weight="700" fill="#697878" text-anchor="start">АЛЬТЕРНАТИВА</text><text x="175.000" y="208.100" font-size="3.8" font-weight="400" fill="#697878" text-anchor="start">Не добавлять местную зарядку; сохранить текущие точки в других зонах.</text><text x="175.000" y="215.900" font-size="2.8" font-weight="700" fill="#17383c" text-anchor="start">РЕШЕНИЕ ALEX</text><text x="175.000" y="220.400" font-size="3.8" font-weight="400" fill="#17383c" text-anchor="start">Нужна ли отдельная зарядка у дивана?</text><text x="175.000" y="228.200" font-size="2.8" font-weight="700" fill="#697878" text-anchor="start">НУЖНЫ ДАННЫЕ</text><text x="175.000" y="232.700" font-size="3.8" font-weight="400" fill="#697878" text-anchor="start">Модель дивана, неподвижная поверхность крепления, стекло и скрытый маршрут.</text><text x="12.000" y="277.000" font-size="2.3" font-weight="400" fill="#697878" text-anchor="start">Вопросы P84: 021</text></g></svg>