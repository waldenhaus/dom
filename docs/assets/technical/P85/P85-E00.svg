<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297"><rect width="420" height="297" fill="white"/><g font-family="Arial,DejaVu Sans,sans-serif"><text x="12.000" y="9.000" font-size="3" font-weight="700" fill="#176c73" text-anchor="start">DBR-P11  /  ЭЛЕКТРИКА  /  P85</text><text x="408.000" y="9.000" font-size="2.8" font-weight="700" fill="#176c73" text-anchor="end">09.09.2026  /  ОЖИДАЕТ РЕШЕНИЯ ALEX</text><text x="12.000" y="23.000" font-size="6" font-weight="700" fill="#17383c" text-anchor="start">Электрика: 10 решений перед деталировкой</text><text x="12.000" y="31.000" font-size="3" font-weight="400" fill="#697878" text-anchor="start">Порядок работы: выбрать принцип решения, затем уточнить изделия и выпустить следующую ревизию.</text><line x1="10.000" y1="37.000" x2="410.000" y2="37.000" stroke="#176c73" stroke-width="0.5"/><line x1="10.000" y1="279.000" x2="410.000" y2="279.000" stroke="#cfdcd8" stroke-width="0.3"/><text x="12.000" y="285.000" font-size="2.7" font-weight="700" fill="#a45322" text-anchor="start">НЕ ДЛЯ МОНТАЖА. * Пробная высота h: от локального чистого пола до центра блока.</text><text x="12.000" y="291.000" font-size="2.6" font-weight="400" fill="#697878" text-anchor="start">Автор: Codex / проверка: AI + автоматические проверки / инженер и утверждение: не назначены.</text><text x="408.000" y="285.000" font-size="3" font-weight="700" fill="#176c73" text-anchor="end">P85-E00</text><text x="408.000" y="291.000" font-size="2.5" font-weight="400" fill="#697878" text-anchor="end">A3 / мм / По видам</text><text x="12.000" y="50.000" font-size="3.3" font-weight="700" fill="#176c73" text-anchor="start">ЧТО РЕШАЕМ СЕЙЧАС</text><text x="12.000" y="60.000" font-size="3.5" font-weight="700" fill="#176c73" text-anchor="start">P85-D-01</text><text x="40.000" y="60.000" font-size="3.5" font-weight="400" fill="#17383c" text-anchor="start">Вход: один понятный блок управления</text><text x="12.000" y="70.000" font-size="3.5" font-weight="700" fill="#176c73" text-anchor="start">P85-D-02</text><text x="40.000" y="70.000" font-size="3.5" font-weight="400" fill="#17383c" text-anchor="start">Гостевой С/У: узкий простенок 150 мм</text><text x="12.000" y="80.000" font-size="3.5" font-weight="700" fill="#176c73" text-anchor="start">P85-D-03</text><text x="40.000" y="80.000" font-size="3.5" font-weight="400" fill="#17383c" text-anchor="start">Мастер С/У: перенести клавишу на правый простенок</text><text x="12.000" y="90.000" font-size="3.5" font-weight="700" fill="#176c73" text-anchor="start">P85-D-04</text><text x="40.000" y="90.000" font-size="3.5" font-weight="400" fill="#17383c" text-anchor="start">Спальни: убрать точки с узкой двери и фасада шкафа</text><text x="12.000" y="100.000" font-size="3.5" font-weight="700" fill="#176c73" text-anchor="start">P85-D-05</text><text x="40.000" y="100.000" font-size="3.5" font-weight="400" fill="#17383c" text-anchor="start">Мокрые помещения: доступные подключения</text><text x="12.000" y="110.000" font-size="3.5" font-weight="700" fill="#176c73" text-anchor="start">P85-D-06</text><text x="40.000" y="110.000" font-size="3.5" font-weight="400" fill="#17383c" text-anchor="start">Лаундж: освободить узкий участок у столешницы</text><text x="12.000" y="120.000" font-size="3.5" font-weight="700" fill="#176c73" text-anchor="start">P85-D-07</text><text x="40.000" y="120.000" font-size="3.5" font-weight="400" fill="#17383c" text-anchor="start">У кроватей: одинаковая понятная схема</text><text x="12.000" y="130.000" font-size="3.5" font-weight="700" fill="#176c73" text-anchor="start">P85-D-08</text><text x="40.000" y="130.000" font-size="3.5" font-weight="400" fill="#17383c" text-anchor="start">Северный диван: нужна ли местная зарядка</text><text x="12.000" y="140.000" font-size="3.5" font-weight="700" fill="#176c73" text-anchor="start">P85-D-09</text><text x="40.000" y="140.000" font-size="3.5" font-weight="400" fill="#17383c" text-anchor="start">Свет: принять понятные сцены и местное управление</text><text x="12.000" y="150.000" font-size="3.5" font-weight="700" fill="#176c73" text-anchor="start">P85-D-10</text><text x="40.000" y="150.000" font-size="3.5" font-weight="400" fill="#17383c" text-anchor="start">Инженерные задания: что нужно после выбора мест</text><rect x="240.000" y="45.000" width="168.000" height="84.000" fill="#eff5f2" stroke="none" stroke-width="0.3" /><text x="247.000" y="56.000" font-size="3.7" font-weight="700" fill="#176c73" text-anchor="start">Все 21 вопрос P84 остаются открытыми</text><text x="247.000" y="66.000" font-size="3.5" font-weight="400" fill="#17383c" text-anchor="start">Этот лист предлагает решения. Ваше «го» разрешило подготовить документ; оно не</text><text x="247.000" y="71.200" font-size="3.5" font-weight="400" fill="#17383c" text-anchor="start">утверждает переносы и высоты.</text><text x="247.000" y="94.000" font-size="3.5" font-weight="400" fill="#17383c" text-anchor="start">P81/P83 и P84 сохранены. Выбранные здесь предложения станут входом следующей</text><text x="247.000" y="99.200" font-size="3.5" font-weight="400" fill="#17383c" text-anchor="start">ревизии после вашего ответа.</text><text x="240.000" y="143.000" font-size="3.3" font-weight="700" fill="#176c73" text-anchor="start">КАК ОТВЕТИТЬ</text><text x="240.000" y="153.000" font-size="3.6" font-weight="400" fill="#17383c" text-anchor="start">Для каждой карточки: «принимаю предложение», «выбираю альтернативу» или короткая</text><text x="240.000" y="158.400" font-size="3.6" font-weight="400" fill="#17383c" text-anchor="start">правка. Ответ можно дать по коду карточки.</text><text x="240.000" y="185.000" font-size="3.3" font-weight="700" fill="#176c73" text-anchor="start">ЧТО НЕ ЗАКРЫВАЕТ ЭТОТ ЛИСТ</text><text x="240.000" y="195.000" font-size="3.5" font-weight="400" fill="#17383c" text-anchor="start">Подбор кабелей и защиты, расчёты, влажные зоны, трассы, противопожарные и инженерные</text><text x="240.000" y="200.200" font-size="3.5" font-weight="400" fill="#17383c" text-anchor="start">интерфейсы. Список исходных данных - на последнем листе.</text><line x1="12.000" y1="250.000" x2="408.000" y2="250.000" stroke="#d0ddd7" stroke-width="0.3"/><text x="12.000" y="259.000" font-size="3.1" font-weight="400" fill="#17383c" text-anchor="start">На планах: круг = предложение P84; квадрат со стрелкой = вариант P85. Размеры относятся к номинальной модели, не к обмеру готовой отделки. Точное исполнение рамок, наличников и дверных ограничителей ещё не выбрано.</text></g></svg>