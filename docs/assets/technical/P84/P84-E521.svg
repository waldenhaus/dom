<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297"><rect width="420" height="297" fill="white"/><g font-family="Arial,DejaVu Sans,sans-serif"><text x="12.000" y="9.000" font-size="3" font-weight="700" fill="#176c73" text-anchor="start">DBR-P11  /  ЭЛЕКТРИКА  /  P84</text><text x="408.000" y="9.000" font-size="2.8" font-weight="700" fill="#176c73" text-anchor="end">09.09.2026 · ДЛЯ СОГЛАСОВАНИЯ</text><text x="12.000" y="23.000" font-size="6" font-weight="700" fill="#17383c" text-anchor="start">Сцены света: состав и нерешённые связи 1</text><text x="12.000" y="31.000" font-size="3" font-weight="400" fill="#697878" text-anchor="start">База P81/P83. Пробные привязки и высоты. Монтажное решение ещё не принято.</text><line x1="10.000" y1="36.000" x2="410.000" y2="36.000" stroke="#176c73" stroke-width="0.5"/><text x="12.000" y="285.000" font-size="2.7" font-weight="700" fill="#a45322" text-anchor="start">НЕ ДЛЯ МОНТАЖА  ·  h от локального чистого пола; числовые h — предложения, не нормы.</text><text x="12.000" y="291.000" font-size="2.5" font-weight="400" fill="#697878" text-anchor="start">Проходки, кабели, защита, влажные зоны, изделия и окончательные отметки требуют проектного решения.</text><text x="408.000" y="285.000" font-size="3.3" font-weight="700" fill="#176c73" text-anchor="end">P84-E521</text><text x="408.000" y="291.000" font-size="2.6" font-weight="400" fill="#697878" text-anchor="end">A3 · NTS</text><rect x="12.000" y="45.000" width="396.000" height="8.000" fill="#176c73" stroke="none" stroke-width="0.3" /><text x="14.000" y="50.400" font-size="2.8" font-weight="700" fill="white" text-anchor="start">Сцена</text><text x="57.000" y="50.400" font-size="2.8" font-weight="700" fill="white" text-anchor="start">Включить</text><text x="132.000" y="50.400" font-size="2.8" font-weight="700" fill="white" text-anchor="start">По выбору</text><text x="207.000" y="50.400" font-size="2.8" font-weight="700" fill="white" text-anchor="start">Выключить</text><text x="282.000" y="50.400" font-size="2.8" font-weight="700" fill="white" text-anchor="start">Предложение / уточнение</text><rect x="12.000" y="53.000" width="396.000" height="18.500" fill="#f0f5f3" stroke="none" stroke-width="0.3" /><text x="14.000" y="57.000" font-size="2.7" font-weight="400" fill="#17383c" text-anchor="start">Готовим</text><text x="57.000" y="57.000" font-size="2.7" font-weight="400" fill="#17383c" text-anchor="start">KITCHEN</text><text x="132.000" y="57.000" font-size="2.7" font-weight="400" fill="#17383c" text-anchor="start">DINING</text><text x="207.000" y="57.000" font-size="2.7" font-weight="400" fill="#17383c" text-anchor="start">P65-L-V2</text><text x="282.000" y="57.000" font-size="2.7" font-weight="400" fill="#17383c" text-anchor="start">Рабочие зоны ярче фоновых; численные уровни после светорасчёта.</text><line x1="12.000" y1="71.500" x2="408.000" y2="71.500" stroke="#d9e2df" stroke-width="0.15"/><rect x="12.000" y="71.500" width="396.000" height="18.500" fill="white" stroke="none" stroke-width="0.3" /><text x="14.000" y="75.500" font-size="2.7" font-weight="400" fill="#17383c" text-anchor="start">Ужин</text><text x="57.000" y="75.500" font-size="2.7" font-weight="400" fill="#17383c" text-anchor="start">DINING</text><text x="132.000" y="75.500" font-size="2.7" font-weight="400" fill="#17383c" text-anchor="start">P65-L-V2</text><text x="207.000" y="75.500" font-size="2.7" font-weight="400" fill="#17383c" text-anchor="start">KITCHEN, LIVING</text><text x="282.000" y="75.500" font-size="2.7" font-weight="400" fill="#17383c" text-anchor="start">[&#x27;P84: DINING включён, KITCHEN по умолчанию выключен; непрямой TV-свет доступен как</text><text x="282.000" y="79.800" font-size="2.7" font-weight="400" fill="#17383c" text-anchor="start">опция. Рабочую кухню можно отдельно включить местной клавишей. Прежние K1/K2</text><text x="282.000" y="84.100" font-size="2.7" font-weight="400" fill="#17383c" text-anchor="start">объединены P79, независимость старых слоёв не обещается.&#x27;]</text><line x1="12.000" y1="90.000" x2="408.000" y2="90.000" stroke="#d9e2df" stroke-width="0.15"/><rect x="12.000" y="90.000" width="396.000" height="18.500" fill="#f0f5f3" stroke="none" stroke-width="0.3" /><text x="14.000" y="94.000" font-size="2.7" font-weight="400" fill="#17383c" text-anchor="start">Кино</text><text x="57.000" y="94.000" font-size="2.7" font-weight="400" fill="#17383c" text-anchor="start">P65-L-V2</text><text x="132.000" y="94.000" font-size="2.7" font-weight="400" fill="#17383c" text-anchor="start">COVE</text><text x="207.000" y="94.000" font-size="2.7" font-weight="400" fill="#17383c" text-anchor="start">DINING, KITCHEN, LIVING</text><text x="282.000" y="94.000" font-size="2.7" font-weight="400" fill="#17383c" text-anchor="start">Непрямой слабый фон за экраном; не обещание стандартной яркости. Карниз включать</text><text x="282.000" y="98.300" font-size="2.7" font-weight="400" fill="#17383c" text-anchor="start">только после проверки отражений в TV и окне.</text><line x1="12.000" y1="108.500" x2="408.000" y2="108.500" stroke="#d9e2df" stroke-width="0.15"/><rect x="12.000" y="108.500" width="396.000" height="18.500" fill="white" stroke="none" stroke-width="0.3" /><text x="14.000" y="112.500" font-size="2.7" font-weight="400" fill="#17383c" text-anchor="start">Уборка</text><text x="57.000" y="112.500" font-size="2.7" font-weight="400" fill="#17383c" text-anchor="start">DINING, HALL, KITCHEN, LIVING</text><text x="132.000" y="112.500" font-size="2.7" font-weight="400" fill="#17383c" text-anchor="start">—</text><text x="207.000" y="112.500" font-size="2.7" font-weight="400" fill="#17383c" text-anchor="start">—</text><text x="282.000" y="112.500" font-size="2.7" font-weight="400" fill="#17383c" text-anchor="start">Слои включаются вместе вручную; это не расчёт электропотребления.</text><line x1="12.000" y1="127.000" x2="408.000" y2="127.000" stroke="#d9e2df" stroke-width="0.15"/><rect x="12.000" y="127.000" width="396.000" height="18.500" fill="#f0f5f3" stroke="none" stroke-width="0.3" /><text x="14.000" y="131.000" font-size="2.7" font-weight="400" fill="#17383c" text-anchor="start">Мастер: сон / чтение</text><text x="57.000" y="131.000" font-size="2.7" font-weight="400" fill="#17383c" text-anchor="start">P65-L-B2</text><text x="132.000" y="131.000" font-size="2.7" font-weight="400" fill="#17383c" text-anchor="start">P65-L-B3, P65-L-B4</text><text x="207.000" y="131.000" font-size="2.7" font-weight="400" fill="#17383c" text-anchor="start">P26-A-R04-GENERAL, P26-A-R04-WARDROBE</text><text x="282.000" y="131.000" font-size="2.7" font-weight="400" fill="#17383c" text-anchor="start">Каждое чтение независимо. Общий свет управляется с двери и обеих тумб.</text><line x1="12.000" y1="145.500" x2="408.000" y2="145.500" stroke="#d9e2df" stroke-width="0.15"/><rect x="12.000" y="145.500" width="396.000" height="18.500" fill="white" stroke="none" stroke-width="0.3" /><text x="14.000" y="149.500" font-size="2.7" font-weight="400" fill="#17383c" text-anchor="start">Спальня2: сон / чтение</text><text x="57.000" y="149.500" font-size="2.7" font-weight="400" fill="#17383c" text-anchor="start">P65-L-C2</text><text x="132.000" y="149.500" font-size="2.7" font-weight="400" fill="#17383c" text-anchor="start">P65-L-C3, P65-L-C4</text><text x="207.000" y="149.500" font-size="2.7" font-weight="400" fill="#17383c" text-anchor="start">P26-A-R05-GENERAL, P26-A-R05-WARDROBE</text><text x="282.000" y="149.500" font-size="2.7" font-weight="400" fill="#17383c" text-anchor="start">Без телефона и WiFi для обычного управления.</text><line x1="12.000" y1="164.000" x2="408.000" y2="164.000" stroke="#d9e2df" stroke-width="0.15"/><rect x="12.000" y="164.000" width="396.000" height="18.500" fill="#f0f5f3" stroke="none" stroke-width="0.3" /><text x="14.000" y="168.000" font-size="2.7" font-weight="400" fill="#17383c" text-anchor="start">Ночью к С/У</text><text x="57.000" y="168.000" font-size="2.7" font-weight="400" fill="#17383c" text-anchor="start">P65-L-H2</text><text x="132.000" y="168.000" font-size="2.7" font-weight="400" fill="#17383c" text-anchor="start">P26-A-R03-GENERAL, P65-L-B4, P65-L-C4</text><text x="207.000" y="168.000" font-size="2.7" font-weight="400" fill="#17383c" text-anchor="start">DINING, KITCHEN</text><text x="282.000" y="168.000" font-size="2.7" font-weight="400" fill="#17383c" text-anchor="start">Датчики возможны только с местным ручным режимом; специальных ночных lux здесь нет.</text><line x1="12.000" y1="182.500" x2="408.000" y2="182.500" stroke="#d9e2df" stroke-width="0.15"/><rect x="12.000" y="182.500" width="396.000" height="18.500" fill="white" stroke="none" stroke-width="0.3" /><text x="14.000" y="186.500" font-size="2.7" font-weight="400" fill="#17383c" text-anchor="start">Лаундж: ужин</text><text x="57.000" y="186.500" font-size="2.7" font-weight="400" fill="#17383c" text-anchor="start">LOUNGE-DINING</text><text x="132.000" y="186.500" font-size="2.7" font-weight="400" fill="#17383c" text-anchor="start">LOUNGE-PASSAGE</text><text x="207.000" y="186.500" font-size="2.7" font-weight="400" fill="#17383c" text-anchor="start">LOUNGE-WORK, P65-L-E1, P65-L-E2</text><text x="282.000" y="186.500" font-size="2.7" font-weight="400" fill="#17383c" text-anchor="start">[&#x27;P84: включён текущий подвес стола, проходной трек доступен как опция; отсутствующий</text><text x="282.000" y="190.800" font-size="2.7" font-weight="400" fill="#17383c" text-anchor="start">акцент печи A4 исключён из текущей сцены. Его исходная потребность сохранена</text><text x="282.000" y="195.100" font-size="2.7" font-weight="400" fill="#17383c" text-anchor="start">отдельно; добавление требует нового согласованного светильника и проверки теплово…</text><line x1="12.000" y1="201.000" x2="408.000" y2="201.000" stroke="#d9e2df" stroke-width="0.15"/><rect x="12.000" y="201.000" width="396.000" height="18.500" fill="#f0f5f3" stroke="none" stroke-width="0.3" /><text x="14.000" y="205.000" font-size="2.7" font-weight="400" fill="#17383c" text-anchor="start">Лаундж: мойка</text><text x="57.000" y="205.000" font-size="2.7" font-weight="400" fill="#17383c" text-anchor="start">LOUNGE-PASSAGE, LOUNGE-WORK</text><text x="132.000" y="205.000" font-size="2.7" font-weight="400" fill="#17383c" text-anchor="start">LOUNGE-DINING</text><text x="207.000" y="205.000" font-size="2.7" font-weight="400" fill="#17383c" text-anchor="start">—</text><text x="282.000" y="205.000" font-size="2.7" font-weight="400" fill="#17383c" text-anchor="start">Сохраняется конфликт1м² прохода с рабочим местом мойки.</text><line x1="12.000" y1="219.500" x2="408.000" y2="219.500" stroke="#d9e2df" stroke-width="0.15"/><rect x="12.000" y="219.500" width="396.000" height="18.500" fill="white" stroke="none" stroke-width="0.3" /><text x="14.000" y="223.500" font-size="2.7" font-weight="400" fill="#17383c" text-anchor="start">Терраса: пройти</text><text x="57.000" y="223.500" font-size="2.7" font-weight="400" fill="#17383c" text-anchor="start">P65-L-E1, P65-L-E2</text><text x="132.000" y="223.500" font-size="2.7" font-weight="400" fill="#17383c" text-anchor="start">—</text><text x="207.000" y="223.500" font-size="2.7" font-weight="400" fill="#17383c" text-anchor="start">—</text><text x="282.000" y="223.500" font-size="2.7" font-weight="400" fill="#17383c" text-anchor="start">Экранированный локальный свет вниз, выключаем когда не нужен.</text><line x1="12.000" y1="238.000" x2="408.000" y2="238.000" stroke="#d9e2df" stroke-width="0.15"/><rect x="12.000" y="238.000" width="396.000" height="18.500" fill="#f0f5f3" stroke="none" stroke-width="0.3" /><text x="14.000" y="242.000" font-size="2.7" font-weight="400" fill="#17383c" text-anchor="start">Гостиная: интимный вечер</text><text x="57.000" y="242.000" font-size="2.7" font-weight="400" fill="#17383c" text-anchor="start">COVE</text><text x="132.000" y="242.000" font-size="2.7" font-weight="400" fill="#17383c" text-anchor="start">P65-L-V2</text><text x="207.000" y="242.000" font-size="2.7" font-weight="400" fill="#17383c" text-anchor="start">DINING, KITCHEN, LIVING</text><text x="282.000" y="242.000" font-size="2.7" font-weight="400" fill="#17383c" text-anchor="start">Низкий тёплый уровень подбирается на объекте. Процент/минимальный уровень не обещаны;</text><text x="282.000" y="246.300" font-size="2.7" font-weight="400" fill="#17383c" text-anchor="start">S03/S04/S05 — физически и без WiFi.</text><line x1="12.000" y1="256.500" x2="408.000" y2="256.500" stroke="#d9e2df" stroke-width="0.15"/><text x="12.000" y="266.000" font-size="2.8" font-weight="400" fill="#17383c" text-anchor="start">Названия групп соответствуют связям E5xx. «Ужин»: кухонная группа по умолчанию выключена, включается вручную при необходимости. «Лаундж: ужин»: отсутствующий акцент A4 исключён; новый прибор не добавлен.</text></g></svg>