<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297"><rect width="420" height="297" fill="white"/><g font-family="Arial,DejaVu Sans,sans-serif"><text x="12.000" y="9.000" font-size="3" font-weight="700" fill="#176c73" text-anchor="start">DBR-P11  /  ЭЛЕКТРИКА  /  P84</text><text x="408.000" y="9.000" font-size="2.8" font-weight="700" fill="#176c73" text-anchor="end">09.09.2026 · ДЛЯ СОГЛАСОВАНИЯ</text><text x="12.000" y="23.000" font-size="6" font-weight="700" fill="#17383c" text-anchor="start">Электрика: точки, высоты и управление</text><text x="12.000" y="31.000" font-size="3" font-weight="400" fill="#697878" text-anchor="start">База P81/P83. Пробные привязки и высоты. Монтажное решение ещё не принято.</text><line x1="10.000" y1="36.000" x2="410.000" y2="36.000" stroke="#176c73" stroke-width="0.5"/><text x="12.000" y="285.000" font-size="2.7" font-weight="700" fill="#a45322" text-anchor="start">НЕ ДЛЯ МОНТАЖА  ·  h от локального чистого пола; числовые h — предложения, не нормы.</text><text x="12.000" y="291.000" font-size="2.5" font-weight="400" fill="#697878" text-anchor="start">Проходки, кабели, защита, влажные зоны, изделия и окончательные отметки требуют проектного решения.</text><text x="408.000" y="285.000" font-size="3.3" font-weight="700" fill="#176c73" text-anchor="end">P84-E001</text><text x="408.000" y="291.000" font-size="2.6" font-weight="400" fill="#697878" text-anchor="end">A3 · NTS</text><text x="12.000" y="50.000" font-size="4.5" font-weight="700" fill="#17383c" text-anchor="start">Дополнение к выбранной архитектуре P81 / комплекту P83</text><rect x="12.000" y="60.000" width="94.000" height="32.000" fill="#eef4f0" stroke="none" stroke-width="0.3" /><text x="17.000" y="74.000" font-size="8" font-weight="700" fill="#b24630" text-anchor="start">17</text><text x="17.000" y="84.000" font-size="3.5" font-weight="700" fill="#17383c" text-anchor="start">Питание</text><rect x="112.000" y="60.000" width="94.000" height="32.000" fill="#eef4f0" stroke="none" stroke-width="0.3" /><text x="117.000" y="74.000" font-size="8" font-weight="700" fill="#226ba0" text-anchor="start">17</text><text x="117.000" y="84.000" font-size="3.5" font-weight="700" fill="#17383c" text-anchor="start">Управление</text><rect x="212.000" y="60.000" width="94.000" height="32.000" fill="#eef4f0" stroke="none" stroke-width="0.3" /><text x="217.000" y="74.000" font-size="8" font-weight="700" fill="#986512" text-anchor="start">32</text><text x="217.000" y="84.000" font-size="3.5" font-weight="700" fill="#17383c" text-anchor="start">Свет</text><rect x="312.000" y="60.000" width="94.000" height="32.000" fill="#eef4f0" stroke="none" stroke-width="0.3" /><text x="317.000" y="74.000" font-size="8" font-weight="700" fill="#715298" text-anchor="start">33</text><text x="317.000" y="84.000" font-size="3.5" font-weight="700" fill="#17383c" text-anchor="start">Интерфейс</text><text x="12.000" y="107.000" font-size="3.8" font-weight="700" fill="#176c73" text-anchor="start">Что сделано</text><text x="12.000" y="113.000" font-size="3.3" font-weight="400" fill="#17383c" text-anchor="start">Единая модель точек на выбранной геометрии. Покомнатные планы, физические развёртки стен, ведомость координат и высот, связи выключателей с актуальным светом и направления дальнейшей разводки.</text><text x="12.000" y="125.000" font-size="3.8" font-weight="700" fill="#176c73" text-anchor="start">Как читать высоты</text><text x="12.000" y="131.000" font-size="3.3" font-weight="400" fill="#17383c" text-anchor="start">h* — предложение относительно локального чистого пола комнаты. Для розеток и клавиш это центр механизма/блока. Для светильников сохраняется отдельная ссылка на графическую точку: это не монтажная высота изделия. TBC —</text><text x="12.000" y="136.000" font-size="3.3" font-weight="400" fill="#17383c" text-anchor="start">значение ещё не установлено.</text><text x="12.000" y="148.000" font-size="3.8" font-weight="700" fill="#176c73" text-anchor="start">Как читать маршруты</text><text x="12.000" y="154.000" font-size="3.3" font-weight="400" fill="#17383c" text-anchor="start">Пунктир показывает направление для координации. Место щита, сечение трассы, высота, проходки и спуски зависят от конструкции и оборудования. Линии управления не являются кабельными трассами. Длины кабеля не</text><text x="12.000" y="159.000" font-size="3.3" font-weight="400" fill="#17383c" text-anchor="start">подсчитывались.</text><text x="12.000" y="171.000" font-size="3.8" font-weight="700" fill="#176c73" text-anchor="start">Что согласовать по этому комплекту</text><text x="12.000" y="177.000" font-size="3.3" font-weight="400" fill="#17383c" text-anchor="start">Расположение точек у мебели; высоты розеток/клавиш; доступ к подключению техники; группы света и управление от входа/кровати. Отдельно отмечены узкие простенки, технические выводы и свет у шкафа спальни 2.</text><text x="12.000" y="189.000" font-size="3.8" font-weight="700" fill="#176c73" text-anchor="start">Что нужно для монтажного выпуска</text><text x="12.000" y="195.000" font-size="3.3" font-weight="400" fill="#17383c" text-anchor="start">Подтверждённые ввод и заземление; выбранные приборы; нагрузки; конструкция потолков и стен; профессиональный расчёт цепей и защиты, влажных зон и освещения. Все монтажные approvals в этом выпуске отсутствуют.</text></g></svg>