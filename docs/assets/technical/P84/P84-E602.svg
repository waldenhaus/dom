<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297"><rect width="420" height="297" fill="white"/><g font-family="Arial,DejaVu Sans,sans-serif"><text x="12.000" y="9.000" font-size="3" font-weight="700" fill="#176c73" text-anchor="start">DBR-P11  /  ЭЛЕКТРИКА  /  P84</text><text x="408.000" y="9.000" font-size="2.8" font-weight="700" fill="#176c73" text-anchor="end">09.09.2026 · ДЛЯ СОГЛАСОВАНИЯ</text><text x="12.000" y="23.000" font-size="6" font-weight="700" fill="#17383c" text-anchor="start">Что требуется для рабочего раздела электрики</text><text x="12.000" y="31.000" font-size="3" font-weight="400" fill="#697878" text-anchor="start">База P81/P83. Пробные привязки и высоты. Монтажное решение ещё не принято.</text><line x1="10.000" y1="36.000" x2="410.000" y2="36.000" stroke="#176c73" stroke-width="0.5"/><text x="12.000" y="285.000" font-size="2.7" font-weight="700" fill="#a45322" text-anchor="start">НЕ ДЛЯ МОНТАЖА  ·  h от локального чистого пола; числовые h — предложения, не нормы.</text><text x="12.000" y="291.000" font-size="2.5" font-weight="400" fill="#697878" text-anchor="start">Проходки, кабели, защита, влажные зоны, изделия и окончательные отметки требуют проектного решения.</text><text x="408.000" y="285.000" font-size="3.3" font-weight="700" fill="#176c73" text-anchor="end">P84-E602</text><text x="408.000" y="291.000" font-size="2.6" font-weight="400" fill="#697878" text-anchor="end">A3 · NTS</text><rect x="12.000" y="45.000" width="396.000" height="8.000" fill="#176c73" stroke="none" stroke-width="0.3" /><text x="14.000" y="50.400" font-size="2.8" font-weight="700" fill="white" text-anchor="start">Пакет</text><text x="60.000" y="50.400" font-size="2.8" font-weight="700" fill="white" text-anchor="start">Конкретный результат</text><text x="314.000" y="50.400" font-size="2.8" font-weight="700" fill="white" text-anchor="start">Кто закрывает</text><rect x="12.000" y="53.000" width="396.000" height="25.000" fill="#f0f5f3" stroke="none" stroke-width="0.3" /><text x="14.000" y="57.000" font-size="3.1" font-weight="400" fill="#17383c" text-anchor="start">Ввод и щит</text><text x="60.000" y="57.000" font-size="3.1" font-weight="400" fill="#17383c" text-anchor="start">Мощность, фазы, система заземления, данные КЗ; место и доступ к щиту.</text><text x="314.000" y="57.000" font-size="3.1" font-weight="400" fill="#17383c" text-anchor="start">Электропроектировщик / поставщик сети</text><line x1="12.000" y1="78.000" x2="408.000" y2="78.000" stroke="#d9e2df" stroke-width="0.15"/><rect x="12.000" y="78.000" width="396.000" height="25.000" fill="white" stroke="none" stroke-width="0.3" /><text x="14.000" y="82.000" font-size="3.1" font-weight="400" fill="#17383c" text-anchor="start">Оборудование</text><text x="60.000" y="82.000" font-size="3.1" font-weight="400" fill="#17383c" text-anchor="start">Точные модели кухни, бойлера/котла, насосов, вентиляции и систем управления; паспортные нагрузки.</text><text x="314.000" y="82.000" font-size="3.1" font-weight="400" fill="#17383c" text-anchor="start">Alex + владельцы инженерных разделов</text><line x1="12.000" y1="103.000" x2="408.000" y2="103.000" stroke="#d9e2df" stroke-width="0.15"/><rect x="12.000" y="103.000" width="396.000" height="25.000" fill="#f0f5f3" stroke="none" stroke-width="0.3" /><text x="14.000" y="107.000" font-size="3.1" font-weight="400" fill="#17383c" text-anchor="start">Стены / потолки</text><text x="60.000" y="107.000" font-size="3.1" font-weight="400" fill="#17383c" text-anchor="start">Финишные поверхности, слои, глубины коробок, сервисные полости и проходки без нарушения каркаса.</text><text x="314.000" y="107.000" font-size="3.1" font-weight="400" fill="#17383c" text-anchor="start">Архитектор + конструктор</text><line x1="12.000" y1="128.000" x2="408.000" y2="128.000" stroke="#d9e2df" stroke-width="0.15"/><rect x="12.000" y="128.000" width="396.000" height="25.000" fill="white" stroke="none" stroke-width="0.3" /><text x="14.000" y="132.000" font-size="3.1" font-weight="400" fill="#17383c" text-anchor="start">Линии / защита</text><text x="60.000" y="132.000" font-size="3.1" font-weight="400" fill="#17383c" text-anchor="start">Нагрузки, цепи, расчёт кабелей и защиты, падение напряжения, отключение и однолинейная схема.</text><text x="314.000" y="132.000" font-size="3.1" font-weight="400" fill="#17383c" text-anchor="start">Электропроектировщик</text><line x1="12.000" y1="153.000" x2="408.000" y2="153.000" stroke="#d9e2df" stroke-width="0.15"/><rect x="12.000" y="153.000" width="396.000" height="25.000" fill="#f0f5f3" stroke="none" stroke-width="0.3" /><text x="14.000" y="157.000" font-size="3.1" font-weight="400" fill="#17383c" text-anchor="start">Свет</text><text x="60.000" y="157.000" font-size="3.1" font-weight="400" fill="#17383c" text-anchor="start">Изделия, оптика, высоты креплений и подвесов, диммеры/драйверы, светорасчёт.</text><text x="314.000" y="157.000" font-size="3.1" font-weight="400" fill="#17383c" text-anchor="start">Светодизайнер + электропроектировщик</text><line x1="12.000" y1="178.000" x2="408.000" y2="178.000" stroke="#d9e2df" stroke-width="0.15"/><rect x="12.000" y="178.000" width="396.000" height="25.000" fill="white" stroke="none" stroke-width="0.3" /><text x="14.000" y="182.000" font-size="3.1" font-weight="400" fill="#17383c" text-anchor="start">Санузлы / улица</text><text x="60.000" y="182.000" font-size="3.1" font-weight="400" fill="#17383c" text-anchor="start">Применимые зоны, исполнение оборудования и условия электрической защиты.</text><text x="314.000" y="182.000" font-size="3.1" font-weight="400" fill="#17383c" text-anchor="start">Электропроектировщик</text><line x1="12.000" y1="203.000" x2="408.000" y2="203.000" stroke="#d9e2df" stroke-width="0.15"/><rect x="12.000" y="203.000" width="396.000" height="25.000" fill="#f0f5f3" stroke="none" stroke-width="0.3" /><text x="14.000" y="207.000" font-size="3.1" font-weight="400" fill="#17383c" text-anchor="start">Отопление P83</text><text x="60.000" y="207.000" font-size="3.1" font-weight="400" fill="#17383c" text-anchor="start">Водяные полы/радиаторы не являются отдельными электрическими нагревателями. Нужны питание источника, насосов и согласованное управление.</text><text x="314.000" y="207.000" font-size="3.1" font-weight="400" fill="#17383c" text-anchor="start">HVAC + электропроектировщик</text><line x1="12.000" y1="228.000" x2="408.000" y2="228.000" stroke="#d9e2df" stroke-width="0.15"/><rect x="12.000" y="228.000" width="396.000" height="25.000" fill="white" stroke="none" stroke-width="0.3" /><text x="14.000" y="232.000" font-size="3.1" font-weight="400" fill="#17383c" text-anchor="start">Проверка / выпуск</text><text x="60.000" y="232.000" font-size="3.1" font-weight="400" fill="#17383c" text-anchor="start">Согласованные чертежи, расчёты, маркировка, план измерений и профессиональное принятие.</text><text x="314.000" y="232.000" font-size="3.1" font-weight="400" fill="#17383c" text-anchor="start">Ответственный проектировщик / монтажник</text><line x1="12.000" y1="253.000" x2="408.000" y2="253.000" stroke="#d9e2df" stroke-width="0.15"/><text x="12.000" y="258.000" font-size="3.2" font-weight="400" fill="#17383c" text-anchor="start">P84 закрывает подготовку материалов для обсуждения расположения и управления. Не подтверждает электробезопасность, доступную мощность или готовность к монтажу.</text></g></svg>