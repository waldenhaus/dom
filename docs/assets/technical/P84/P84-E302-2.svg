<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297"><rect width="420" height="297" fill="white"/><g font-family="Arial,DejaVu Sans,sans-serif"><text x="12.000" y="9.000" font-size="3" font-weight="700" fill="#176c73" text-anchor="start">DBR-P11  /  ЭЛЕКТРИКА  /  P84</text><text x="408.000" y="9.000" font-size="2.8" font-weight="700" fill="#176c73" text-anchor="end">09.09.2026 · ДЛЯ СОГЛАСОВАНИЯ</text><text x="12.000" y="23.000" font-size="6" font-weight="700" fill="#17383c" text-anchor="start">Прихожая: развёртки стен</text><text x="12.000" y="31.000" font-size="3" font-weight="400" fill="#697878" text-anchor="start">Физический взгляд из помещения. u отсчитывается слева на каждой развёртке; X/Y сохраняют общий ноль.</text><line x1="10.000" y1="36.000" x2="410.000" y2="36.000" stroke="#176c73" stroke-width="0.5"/><text x="12.000" y="285.000" font-size="2.7" font-weight="700" fill="#a45322" text-anchor="start">НЕ ДЛЯ МОНТАЖА  ·  h от локального чистого пола; числовые h — предложения, не нормы.</text><text x="12.000" y="291.000" font-size="2.5" font-weight="400" fill="#697878" text-anchor="start">Проходки, кабели, защита, влажные зоны, изделия и окончательные отметки требуют проектного решения.</text><text x="408.000" y="285.000" font-size="3.3" font-weight="700" fill="#176c73" text-anchor="end">P84-E302-2</text><text x="408.000" y="291.000" font-size="2.6" font-weight="400" fill="#697878" text-anchor="end">A3 · схемы NTS</text><text x="12.000" y="47.000" font-size="3.5" font-weight="700" fill="#176c73" text-anchor="start">Стена 5 · взгляд на юг</text><text x="12.000" y="52.000" font-size="2.4" font-weight="400" fill="#697878" text-anchor="start">Слева (7960; 3960) → справа (5960; 3960)</text><polygon points="94.398,130.000 94.398,84.694 124.602,84.694 124.602,130.000" fill="#fbfcf9" stroke="#9daea6" stroke-width="0.25" stroke-dasharray="1.5,1"/><line x1="94.398" y1="130.000" x2="124.602" y2="130.000" stroke="#176c73" stroke-width="0.5"/><text x="92.398" y="131.000" font-size="2.2" font-weight="400" fill="#176c73" text-anchor="end">±0</text><polygon points="95.455,130.000 95.455,98.286 109.047,98.286 109.047,130.000" fill="#e7eff0" stroke="#8ba8ac" stroke-width="0.23" stroke-dasharray="1,1"/><text x="102.251" y="114.143" font-size="2.4" font-weight="400" fill="#176c73" text-anchor="middle">D04*</text><polygon points="118.863,130.000 118.863,98.286 124.602,98.286 124.602,130.000" fill="#e7eff0" stroke="#8ba8ac" stroke-width="0.23" stroke-dasharray="1,1"/><text x="121.733" y="114.143" font-size="2.4" font-weight="400" fill="#176c73" text-anchor="middle">D06*</text><line x1="94.398" y1="141.000" x2="124.602" y2="141.000" stroke="#697878" stroke-width="0.2"/><text x="109.500" y="140.000" font-size="2.4" font-weight="400" fill="#697878" text-anchor="middle">2000 мм</text><text x="213.000" y="47.000" font-size="3.5" font-weight="700" fill="#176c73" text-anchor="start">Стена 6 · взгляд на запад</text><text x="213.000" y="52.000" font-size="2.4" font-weight="400" fill="#697878" text-anchor="start">Слева (5960; 3960) → справа (5960; 400)</text><polygon points="283.618,130.000 283.618,84.694 337.382,84.694 337.382,130.000" fill="#fbfcf9" stroke="#9daea6" stroke-width="0.25" stroke-dasharray="1.5,1"/><line x1="283.618" y1="130.000" x2="337.382" y2="130.000" stroke="#176c73" stroke-width="0.5"/><text x="281.618" y="131.000" font-size="2.2" font-weight="400" fill="#176c73" text-anchor="end">±0</text><line x1="301.439" y1="128.000" x2="337.382" y2="128.000" stroke="#719c76" stroke-width="1.1"/><text x="213.000" y="57.000" font-size="2.25" font-weight="400" fill="#668574" text-anchor="start">Полосы у пола: F01; высоты мебели TBC</text><polygon points="283.618,130.000 283.618,84.694 301.439,84.694 301.439,130.000" fill="#e7eff0" stroke="#8ba8ac" stroke-width="0.23" stroke-dasharray="1,1"/><text x="292.529" y="107.347" font-size="2.4" font-weight="400" fill="#176c73" text-anchor="middle">OC01*</text><line x1="283.618" y1="141.000" x2="337.382" y2="141.000" stroke="#697878" stroke-width="0.2"/><text x="310.500" y="140.000" font-size="2.4" font-weight="400" fill="#697878" text-anchor="middle">3560 мм</text><text x="12.000" y="267.000" font-size="2.6" font-weight="400" fill="#17383c" text-anchor="start">* Контуры проёмов/потолка и числовые h показаны как предложения. TBC не изображается высотой 0. Мебельные/потолочные точки вне плоскости стены — в плане и полной ведомости.</text></g></svg>