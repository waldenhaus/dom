<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297"><rect width="420" height="297" fill="white"/><g font-family="Arial,DejaVu Sans,sans-serif"><text x="12.000" y="9.000" font-size="3" font-weight="700" fill="#176c73" text-anchor="start">DBR-P11  /  ЭЛЕКТРИКА  /  P84</text><text x="408.000" y="9.000" font-size="2.8" font-weight="700" fill="#176c73" text-anchor="end">09.09.2026 · ДЛЯ СОГЛАСОВАНИЯ</text><text x="12.000" y="23.000" font-size="6" font-weight="700" fill="#17383c" text-anchor="start">Адресные вопросы для согласования 2</text><text x="12.000" y="31.000" font-size="3" font-weight="400" fill="#697878" text-anchor="start">База P81/P83. Пробные привязки и высоты. Монтажное решение ещё не принято.</text><line x1="10.000" y1="36.000" x2="410.000" y2="36.000" stroke="#176c73" stroke-width="0.5"/><text x="12.000" y="285.000" font-size="2.7" font-weight="700" fill="#a45322" text-anchor="start">НЕ ДЛЯ МОНТАЖА  ·  h от локального чистого пола; числовые h — предложения, не нормы.</text><text x="12.000" y="291.000" font-size="2.5" font-weight="400" fill="#697878" text-anchor="start">Проходки, кабели, защита, влажные зоны, изделия и окончательные отметки требуют проектного решения.</text><text x="408.000" y="285.000" font-size="3.3" font-weight="700" fill="#176c73" text-anchor="end">P84-E702</text><text x="408.000" y="291.000" font-size="2.6" font-weight="400" fill="#697878" text-anchor="end">A3 · NTS</text><rect x="12.000" y="45.000" width="396.000" height="8.000" fill="#176c73" stroke="none" stroke-width="0.3" /><text x="14.000" y="50.400" font-size="2.8" font-weight="700" fill="white" text-anchor="start">№</text><text x="29.000" y="50.400" font-size="2.8" font-weight="700" fill="white" text-anchor="start">Вопрос</text><text x="119.000" y="50.400" font-size="2.8" font-weight="700" fill="white" text-anchor="start">Что нужно получить / проверить</text><text x="341.000" y="50.400" font-size="2.8" font-weight="700" fill="white" text-anchor="start">Владелец</text><rect x="12.000" y="53.000" width="396.000" height="19.800" fill="#f0f5f3" stroke="none" stroke-width="0.3" /><text x="14.000" y="57.000" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">012</text><text x="29.000" y="57.000" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">Монтажные высоты и поверхности не утверждены</text><text x="119.000" y="57.000" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">Согласовать FFL/сборки отделки, механизмы и оборудование. Сохранённые1100/950/1200/1250/650/300/1450мм — пространственная примерка. Все</text><text x="119.000" y="61.300" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">actual_installation_height_mm остаются null.</text><text x="341.000" y="57.000" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">electrical-designer</text><line x1="12.000" y1="72.800" x2="408.000" y2="72.800" stroke="#d9e2df" stroke-width="0.15"/><rect x="12.000" y="72.800" width="396.000" height="19.800" fill="white" stroke="none" stroke-width="0.3" /><text x="14.000" y="76.800" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">013</text><text x="29.000" y="76.800" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">Коридоры не являются полной разводкой</text><text x="119.000" y="76.800" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">После щита/конструкций/MEP выпустить board→circuit→route→каждый вывод, спуски, отметки, проходки, отделение ICT, кабели/защиты/длины. Сейчас места</text><text x="119.000" y="81.100" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">проходок и z неизвестны.</text><text x="341.000" y="76.800" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">electrical-designer</text><line x1="12.000" y1="92.600" x2="408.000" y2="92.600" stroke="#d9e2df" stroke-width="0.15"/><rect x="12.000" y="92.600" width="396.000" height="19.800" fill="#f0f5f3" stroke="none" stroke-width="0.3" /><text x="14.000" y="96.600" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">014</text><text x="29.000" y="96.600" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">Мокрые помещения, лаундж и наружные точки</text><text x="119.000" y="96.600" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">Электрик определяет допустимость каждой точки, зоны, IP/защиту/уравнивание потенциалов по выбранной юрисдикции и изделиям. Мебельный зазор не</text><text x="119.000" y="100.900" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">электрический безопасный отступ.</text><text x="341.000" y="96.600" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">electrical-designer</text><line x1="12.000" y1="112.400" x2="408.000" y2="112.400" stroke="#d9e2df" stroke-width="0.15"/><rect x="12.000" y="112.400" width="396.000" height="19.800" fill="white" stroke="none" stroke-width="0.3" /><text x="14.000" y="116.400" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">015</text><text x="29.000" y="116.400" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">P83: термостаты, UFH, насосы и сезонный лаундж</text><text x="119.000" y="116.400" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">HVAC выдаёт управляемые зоны, коллектор/приводы, котёл/насосы, точные питания, датчики, блокировки. Гидравлические радиаторы не превращены в</text><text x="119.000" y="120.700" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">электронагрузки.</text><text x="341.000" y="116.400" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">hvac-designer-and-electrical-designer</text><line x1="12.000" y1="132.200" x2="408.000" y2="132.200" stroke="#d9e2df" stroke-width="0.15"/><rect x="12.000" y="132.200" width="396.000" height="19.800" fill="#f0f5f3" stroke="none" stroke-width="0.3" /><text x="14.000" y="136.200" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">016</text><text x="29.000" y="136.200" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">ICT/датчики/life-safety: объём и независимые питания TBC</text><text x="119.000" y="136.200" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">Owner low-voltage/fire определяет интернет/TV, сигнализацию, утечки/дым/CO и обязательные системы, линии связи и необходимые питания. Неизвестный</text><text x="119.000" y="140.500" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">scope не означает не требуется. Общий свет-off не отключает холодильник/инженерию/защиту.</text><text x="341.000" y="136.200" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">low-voltage-and-fire-specialists</text><line x1="12.000" y1="152.000" x2="408.000" y2="152.000" stroke="#d9e2df" stroke-width="0.15"/><rect x="12.000" y="152.000" width="396.000" height="19.800" fill="white" stroke="none" stroke-width="0.3" /><text x="14.000" y="156.000" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">017</text><text x="29.000" y="156.000" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">Lightning/EV/PV/battery/backup — applicability TBC</text><text x="119.000" y="156.000" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">Для каждого scope получить решение применимости от ответственного специалиста; не подставлять размеры, мощности, необходимость либо отсутствие из</text><text x="119.000" y="160.300" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">типовой схемы.</text><text x="341.000" y="156.000" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">electrical-designer</text><line x1="12.000" y1="171.800" x2="408.000" y2="171.800" stroke="#d9e2df" stroke-width="0.15"/><rect x="12.000" y="171.800" width="396.000" height="19.800" fill="#f0f5f3" stroke="none" stroke-width="0.3" /><text x="14.000" y="175.800" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">018</text><text x="29.000" y="175.800" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">Прикроватные блоки и бра: нет габаритов тумб по высоте</text><text x="119.000" y="175.800" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">Сверить650мм розеток и950мм клавиш с реальной высотой тумб/изголовья и светильниками; механизм бра может оказаться на той же XY. Проверить</text><text x="119.000" y="180.100" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">стеновые коробки с соседними комнатами.</text><text x="341.000" y="175.800" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">interior-and-electrical-designer</text><line x1="12.000" y1="191.600" x2="408.000" y2="191.600" stroke="#d9e2df" stroke-width="0.15"/><rect x="12.000" y="191.600" width="396.000" height="19.800" fill="white" stroke="none" stroke-width="0.3" /><text x="14.000" y="195.600" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">019</text><text x="29.000" y="195.600" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">P83 радиаторы и варианты гостиной: пересечения после</text><text x="29.000" y="199.900" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">выбора</text><text x="119.000" y="195.600" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">RAD01 резервx8960..10280 иRAD02 x5600..6600 на южной стене сохранены. Северо-западный радиатор гостиной A не выбран и может конфликтовать со SW04;</text><text x="119.000" y="199.900" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">проверить при выборе. Конвектор B вдоль W01 не означает разрешённый электрический ввод.</text><text x="341.000" y="195.600" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">hvac-and-electrical-designer</text><line x1="12.000" y1="211.400" x2="408.000" y2="211.400" stroke="#d9e2df" stroke-width="0.15"/><rect x="12.000" y="211.400" width="396.000" height="19.800" fill="#f0f5f3" stroke="none" stroke-width="0.3" /><text x="14.000" y="215.400" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">020</text><text x="29.000" y="215.400" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">Сцены P84: согласовать исправленную логику и аппаратуру</text><text x="119.000" y="215.400" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">DINNER и LOUNGE_DINNER исправлены как P84 proposals; исходные source_conflict_group_ids/source_unmapped_tags сохранены. Утвердить текущие</text><text x="119.000" y="219.700" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">on/optional/off, реальные клавиши/сцены и проверить offline/restart на изделиях.</text><text x="341.000" y="215.400" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">lighting-and-low-voltage-designers</text><line x1="12.000" y1="231.200" x2="408.000" y2="231.200" stroke="#d9e2df" stroke-width="0.15"/><rect x="12.000" y="231.200" width="396.000" height="19.800" fill="white" stroke="none" stroke-width="0.3" /><text x="14.000" y="235.200" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">021</text><text x="29.000" y="235.200" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">У нового северного дивана нет местной зарядной точки</text><text x="119.000" y="235.200" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">Проверить потребность Alex в локальной зарядке у P81-L-SOFA. Северный host — стекло; не назначать розетку на стекле и не тянуть шнур через проход.</text><text x="119.000" y="239.500" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">При подтверждении выбрать неподвижную панель/мебельный интерфейс с доступом.</text><text x="341.000" y="235.200" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">client-and-electrical-designer</text><line x1="12.000" y1="251.000" x2="408.000" y2="251.000" stroke="#d9e2df" stroke-width="0.15"/></g></svg>