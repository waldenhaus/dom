<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297"><rect width="420" height="297" fill="white"/><g font-family="Arial,DejaVu Sans,sans-serif"><text x="12.000" y="9.000" font-size="3" font-weight="700" fill="#176c73" text-anchor="start">DBR-P11  /  ЭЛЕКТРИКА  /  P84</text><text x="408.000" y="9.000" font-size="2.8" font-weight="700" fill="#176c73" text-anchor="end">09.09.2026 · ДЛЯ СОГЛАСОВАНИЯ</text><text x="12.000" y="23.000" font-size="6" font-weight="700" fill="#17383c" text-anchor="start">Адресные вопросы для согласования 1</text><text x="12.000" y="31.000" font-size="3" font-weight="400" fill="#697878" text-anchor="start">База P81/P83. Пробные привязки и высоты. Монтажное решение ещё не принято.</text><line x1="10.000" y1="36.000" x2="410.000" y2="36.000" stroke="#176c73" stroke-width="0.5"/><text x="12.000" y="285.000" font-size="2.7" font-weight="700" fill="#a45322" text-anchor="start">НЕ ДЛЯ МОНТАЖА  ·  h от локального чистого пола; числовые h — предложения, не нормы.</text><text x="12.000" y="291.000" font-size="2.5" font-weight="400" fill="#697878" text-anchor="start">Проходки, кабели, защита, влажные зоны, изделия и окончательные отметки требуют проектного решения.</text><text x="408.000" y="285.000" font-size="3.3" font-weight="700" fill="#176c73" text-anchor="end">P84-E701</text><text x="408.000" y="291.000" font-size="2.6" font-weight="400" fill="#697878" text-anchor="end">A3 · NTS</text><rect x="12.000" y="45.000" width="396.000" height="8.000" fill="#176c73" stroke="none" stroke-width="0.3" /><text x="14.000" y="50.400" font-size="2.8" font-weight="700" fill="white" text-anchor="start">№</text><text x="29.000" y="50.400" font-size="2.8" font-weight="700" fill="white" text-anchor="start">Вопрос</text><text x="119.000" y="50.400" font-size="2.8" font-weight="700" fill="white" text-anchor="start">Что нужно получить / проверить</text><text x="341.000" y="50.400" font-size="2.8" font-weight="700" fill="white" text-anchor="start">Владелец</text><rect x="12.000" y="53.000" width="396.000" height="19.800" fill="#f0f5f3" stroke="none" stroke-width="0.3" /><text x="14.000" y="57.000" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">001</text><text x="29.000" y="57.000" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">P15 — привязка/доступ HOLD</text><text x="119.000" y="57.000" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">Не в двери гардероба. Мастер: неподвижная секция западного фасада шкафа требует отдельного согласования мебельщика; существующий фасад сам по себе</text><text x="119.000" y="61.300" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">не подтверждает поверхность для розетки, mount HOLD. Согласовать механизм, рамку, чистовую поверхность, доступ и высоту с фактической мебелью;</text><text x="119.000" y="65.600" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">проверить применимые требования.</text><text x="341.000" y="57.000" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">electrical-designer</text><line x1="12.000" y1="72.800" x2="408.000" y2="72.800" stroke="#d9e2df" stroke-width="0.15"/><rect x="12.000" y="72.800" width="396.000" height="19.800" fill="white" stroke="none" stroke-width="0.3" /><text x="14.000" y="76.800" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">002</text><text x="29.000" y="76.800" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">P21 — привязка/доступ HOLD</text><text x="119.000" y="76.800" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">Два потребителя, не двойник/удлинитель. Вынести доступные точки из-за машин после выбранных инструкций; мокрые зоны не рассчитаны. P84: прежний</text><text x="119.000" y="81.100" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">маркер [7985,1915] — центр корпуса колонны 650×650. Физическое подключение удержано null; два раздельных прибора не подменены двойником. Выбрать</text><text x="119.000" y="85.400" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">изделие и определить доступный вывод, тип подключения, точные XY/высоту и сервисный доступ по его документации.</text><text x="341.000" y="76.800" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">electrical-designer</text><line x1="12.000" y1="92.600" x2="408.000" y2="92.600" stroke="#d9e2df" stroke-width="0.15"/><rect x="12.000" y="92.600" width="396.000" height="19.800" fill="#f0f5f3" stroke="none" stroke-width="0.3" /><text x="14.000" y="96.600" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">003</text><text x="29.000" y="96.600" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">P27 — привязка/доступ HOLD</text><text x="119.000" y="96.600" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">Внутри тумбы не означает вне мокрой зоны. Продукт, зона, доступ и отделка не подтверждены. Выбрать изделие и определить доступный вывод, тип</text><text x="119.000" y="100.900" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">подключения, точные XY/высоту и сервисный доступ по его документации.</text><text x="341.000" y="96.600" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">electrical-designer</text><line x1="12.000" y1="112.400" x2="408.000" y2="112.400" stroke="#d9e2df" stroke-width="0.15"/><rect x="12.000" y="112.400" width="396.000" height="19.800" fill="white" stroke="none" stroke-width="0.3" /><text x="14.000" y="116.400" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">004</text><text x="29.000" y="116.400" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">P30 — привязка/доступ HOLD</text><text x="119.000" y="116.400" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">Актуальный простенок от конца столешницы x6300 до D01 x6560 =260мм; центр x6360:60мм от столешницы,200мм от D01. Высота850 — старое графическое</text><text x="119.000" y="120.700" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">предположение; высота столешницы лаунджа неизвестна. HOLD до изделия/мокрой зоны/рамы. Согласовать механизм, рамку, чистовую поверхность, доступ и</text><text x="119.000" y="125.000" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">высоту с фактической мебелью; проверить применимые требования.</text><text x="341.000" y="116.400" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">electrical-designer</text><line x1="12.000" y1="132.200" x2="408.000" y2="132.200" stroke="#d9e2df" stroke-width="0.15"/><rect x="12.000" y="132.200" width="396.000" height="19.800" fill="#f0f5f3" stroke="none" stroke-width="0.3" /><text x="14.000" y="136.200" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">005</text><text x="29.000" y="136.200" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">SW01 — привязка/доступ HOLD</text><text x="119.000" y="136.200" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">P84: от края D01 x7460 до центра7550 =90мм; рамка/наличник TBC. Утвердить число клавиш/сцен, рамку, наличник, чистовую стену и глубину коробки;</text><text x="119.000" y="140.500" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">проверить доступ. 1100/950мм — сохранённая примерка, не норма.</text><text x="341.000" y="136.200" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">electrical-designer</text><line x1="12.000" y1="152.000" x2="408.000" y2="152.000" stroke="#d9e2df" stroke-width="0.15"/><rect x="12.000" y="152.000" width="396.000" height="19.800" fill="white" stroke="none" stroke-width="0.3" /><text x="14.000" y="156.000" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">006</text><text x="29.000" y="156.000" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">SW06 — привязка/доступ HOLD</text><text x="119.000" y="156.000" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">P84: простенок150мм y400..550, центр475; по75мм от краёв. HOLD. Утвердить число клавиш/сцен, рамку, наличник, чистовую стену и глубину коробки;</text><text x="119.000" y="160.300" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">проверить доступ. 1100/950мм — сохранённая примерка, не норма.</text><text x="341.000" y="156.000" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">electrical-designer</text><line x1="12.000" y1="171.800" x2="408.000" y2="171.800" stroke="#d9e2df" stroke-width="0.15"/><rect x="12.000" y="171.800" width="396.000" height="19.800" fill="#f0f5f3" stroke="none" stroke-width="0.3" /><text x="14.000" y="175.800" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">007</text><text x="29.000" y="175.800" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">SW07 — привязка/доступ HOLD</text><text x="119.000" y="175.800" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">P84: parked D04 до8790, D05 от8910; центр8850, по60мм. HOLD. Утвердить число клавиш/сцен, рамку, наличник, чистовую стену и глубину коробки;</text><text x="119.000" y="180.100" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">проверить доступ. 1100/950мм — сохранённая примерка, не норма.</text><text x="341.000" y="175.800" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">electrical-designer</text><line x1="12.000" y1="191.600" x2="408.000" y2="191.600" stroke="#d9e2df" stroke-width="0.15"/><rect x="12.000" y="191.600" width="396.000" height="19.800" fill="white" stroke="none" stroke-width="0.3" /><text x="14.000" y="195.600" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">008</text><text x="29.000" y="195.600" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">SW11 — привязка/доступ HOLD</text><text x="119.000" y="195.600" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">P84: край D06 x6340, точка6460, граница6600;120мм/140мм. HOLD до проверки рамки и открывания. Утвердить число клавиш/сцен, рамку, наличник,</text><text x="119.000" y="199.900" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">чистовую стену и глубину коробки; проверить доступ. 1100/950мм — сохранённая примерка, не норма.</text><text x="341.000" y="195.600" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">electrical-designer</text><line x1="12.000" y1="211.400" x2="408.000" y2="211.400" stroke="#d9e2df" stroke-width="0.15"/><rect x="12.000" y="211.400" width="396.000" height="19.800" fill="#f0f5f3" stroke="none" stroke-width="0.3" /><text x="14.000" y="215.400" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">009</text><text x="29.000" y="215.400" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">SW16 — привязка/доступ HOLD</text><text x="119.000" y="215.400" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">P84: конец столешницы6300; D01 начинается6560. Простенок260мм, центр6390:90/170мм. HOLD до рамки/влаги. Утвердить число клавиш/сцен, рамку,</text><text x="119.000" y="219.700" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">наличник, чистовую стену и глубину коробки; проверить доступ. 1100/950мм — сохранённая примерка, не норма.</text><text x="341.000" y="215.400" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">electrical-designer</text><line x1="12.000" y1="231.200" x2="408.000" y2="231.200" stroke="#d9e2df" stroke-width="0.15"/><rect x="12.000" y="231.200" width="396.000" height="19.800" fill="white" stroke="none" stroke-width="0.3" /><text x="14.000" y="235.200" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">010</text><text x="29.000" y="235.200" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">Потолочная схема P79 объединяет несколько прежних функций</text><text x="119.000" y="235.200" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">Проверить рабочий свет острова/столешницы, душа/постирочной и шкафа гостиной; фотометрия должна показать достаточность текущих групп. Акцент печи</text><text x="119.000" y="239.500" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">A4 не имеет действующего светильника. Утвердить объединение либо добавить адресные приборы.</text><text x="341.000" y="235.200" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">lighting-designer</text><line x1="12.000" y1="251.000" x2="408.000" y2="251.000" stroke="#d9e2df" stroke-width="0.15"/><rect x="12.000" y="251.000" width="396.000" height="19.800" fill="#f0f5f3" stroke="none" stroke-width="0.3" /><text x="14.000" y="255.000" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">011</text><text x="29.000" y="255.000" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">Ввод, щит, цепи и защиты не рассчитаны</text><text x="119.000" y="255.000" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">Получить подтверждённый ввод/фазы/мощность/earthing/fault, нагрузки изделий и current adopted requirements; назначить электрического</text><text x="119.000" y="259.300" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">проектировщика. Затем выполнить однолинейную схему, расчёты и щит.</text><text x="341.000" y="255.000" font-size="2.75" font-weight="400" fill="#17383c" text-anchor="start">electrical-designer</text><line x1="12.000" y1="270.800" x2="408.000" y2="270.800" stroke="#d9e2df" stroke-width="0.15"/></g></svg>