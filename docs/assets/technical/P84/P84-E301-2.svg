<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297"><rect width="420" height="297" fill="white"/><g font-family="Arial,DejaVu Sans,sans-serif"><text x="12.000" y="9.000" font-size="3" font-weight="700" fill="#176c73" text-anchor="start">DBR-P11  /  ЭЛЕКТРИКА  /  P84</text><text x="408.000" y="9.000" font-size="2.8" font-weight="700" fill="#176c73" text-anchor="end">09.09.2026 · ДЛЯ СОГЛАСОВАНИЯ</text><text x="12.000" y="23.000" font-size="6" font-weight="700" fill="#17383c" text-anchor="start">Кухня / столовая / гостиная: развёртки стен</text><text x="12.000" y="31.000" font-size="3" font-weight="400" fill="#697878" text-anchor="start">Физический взгляд из помещения. u отсчитывается слева на каждой развёртке; X/Y сохраняют общий ноль.</text><line x1="10.000" y1="36.000" x2="410.000" y2="36.000" stroke="#176c73" stroke-width="0.5"/><text x="12.000" y="285.000" font-size="2.7" font-weight="700" fill="#a45322" text-anchor="start">НЕ ДЛЯ МОНТАЖА  ·  h от локального чистого пола; числовые h — предложения, не нормы.</text><text x="12.000" y="291.000" font-size="2.5" font-weight="400" fill="#697878" text-anchor="start">Проходки, кабели, защита, влажные зоны, изделия и окончательные отметки требуют проектного решения.</text><text x="408.000" y="285.000" font-size="3.3" font-weight="700" fill="#176c73" text-anchor="end">P84-E301-2</text><text x="408.000" y="291.000" font-size="2.6" font-weight="400" fill="#697878" text-anchor="end">A3 · схемы NTS</text><text x="12.000" y="47.000" font-size="3.5" font-weight="700" fill="#176c73" text-anchor="start">Стена 5 · взгляд на юг</text><text x="12.000" y="52.000" font-size="2.4" font-weight="400" fill="#697878" text-anchor="start">Слева (3300; 7760) → справа (100; 7760)</text><polygon points="85.337,130.000 85.337,82.932 133.663,82.932 133.663,130.000" fill="#fbfcf9" stroke="#9daea6" stroke-width="0.25" stroke-dasharray="1.5,1"/><line x1="85.337" y1="130.000" x2="133.663" y2="130.000" stroke="#176c73" stroke-width="0.5"/><text x="83.337" y="131.000" font-size="2.2" font-weight="400" fill="#176c73" text-anchor="end">±0</text><line x1="95.123" y1="128.000" x2="123.877" y2="128.000" stroke="#719c76" stroke-width="1.1"/><line x1="89.867" y1="128.000" x2="126.112" y2="128.000" stroke="#719c76" stroke-width="1.1"/><line x1="85.337" y1="128.000" x2="89.867" y2="128.000" stroke="#719c76" stroke-width="1.1"/><text x="12.000" y="57.000" font-size="2.25" font-weight="400" fill="#668574" text-anchor="start">Полосы у пола: F32, F37, F38; высоты мебели TBC</text><g data-point-id="P65-P-09"><circle cx="109.500" cy="112.633" r="1.32" fill="white" stroke="#b24630" stroke-width="0.45"/><line x1="109.020" y1="112.113" x2="109.020" y2="113.153" stroke="#b24630" stroke-width="0.3"/><line x1="109.980" y1="112.113" x2="109.980" y2="113.153" stroke="#b24630" stroke-width="0.3"/></g><line x1="109.500" y1="130.000" x2="109.500" y2="112.633" stroke="#b24630" stroke-width="0.18" stroke-dasharray="1,1"/><rect x="111.000" y="108.283" width="29.840" height="3.350" fill="#ffffff" stroke="none" stroke-width="0.3" /><text x="111.500" y="110.633" font-size="2.35" font-weight="700" fill="#b24630" text-anchor="start">P09  u=1600  h=1150*</text><g data-point-id="P65-P-10"><circle cx="95.908" cy="125.469" r="1.32" fill="white" stroke="#b24630" stroke-width="0.45"/><line x1="95.428" y1="124.949" x2="95.428" y2="125.989" stroke="#b24630" stroke-width="0.3"/><line x1="96.388" y1="124.949" x2="96.388" y2="125.989" stroke="#b24630" stroke-width="0.3"/></g><line x1="95.908" y1="130.000" x2="95.908" y2="125.469" stroke="#b24630" stroke-width="0.18" stroke-dasharray="1,1"/><rect x="97.408" y="121.119" width="26.926" height="3.350" fill="#ffffff" stroke="none" stroke-width="0.3" /><text x="97.908" y="123.469" font-size="2.35" font-weight="700" fill="#b24630" text-anchor="start">P10  u=700  h=300*</text><text x="15.000" y="135.500" font-size="2.35" font-weight="400" fill="#a45322" text-anchor="start">Высота TBC: V2-01; X/Y см. ведомость</text><line x1="85.337" y1="141.000" x2="133.663" y2="141.000" stroke="#697878" stroke-width="0.2"/><text x="109.500" y="140.000" font-size="2.4" font-weight="400" fill="#697878" text-anchor="middle">3200 мм</text><text x="213.000" y="47.000" font-size="3.5" font-weight="700" fill="#176c73" text-anchor="start">Стена 6 · взгляд на запад</text><text x="213.000" y="52.000" font-size="2.4" font-weight="400" fill="#697878" text-anchor="start">Слева (100; 7760) → справа (100; 400)</text><polygon points="254.924,130.000 254.924,82.932 310.500,59.776 366.076,82.932 366.076,130.000" fill="#fbfcf9" stroke="#9daea6" stroke-width="0.25" stroke-dasharray="1.5,1"/><line x1="254.924" y1="130.000" x2="366.076" y2="130.000" stroke="#176c73" stroke-width="0.5"/><text x="252.924" y="131.000" font-size="2.2" font-weight="400" fill="#176c73" text-anchor="end">±0</text><polygon points="261.116,130.000 261.116,84.694 362.300,84.694 362.300,130.000" fill="#e7eff0" stroke="#8ba8ac" stroke-width="0.23" stroke-dasharray="1,1"/><text x="311.708" y="107.347" font-size="2.4" font-weight="400" fill="#176c73" text-anchor="middle">W01*</text><line x1="254.924" y1="141.000" x2="366.076" y2="141.000" stroke="#697878" stroke-width="0.2"/><text x="310.500" y="140.000" font-size="2.4" font-weight="400" fill="#697878" text-anchor="middle">7360 мм</text><text x="12.000" y="267.000" font-size="2.6" font-weight="400" fill="#17383c" text-anchor="start">* Контуры проёмов/потолка и числовые h показаны как предложения. TBC не изображается высотой 0. Мебельные/потолочные точки вне плоскости стены — в плане и полной ведомости.</text></g></svg>