<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297"><rect width="420" height="297" fill="white"/><g font-family="Arial,DejaVu Sans,sans-serif"><text x="12.000" y="9.000" font-size="3" font-weight="700" fill="#176c73" text-anchor="start">DBR-P11  /  ЭЛЕКТРИКА  /  P84</text><text x="408.000" y="9.000" font-size="2.8" font-weight="700" fill="#176c73" text-anchor="end">09.09.2026 · ДЛЯ СОГЛАСОВАНИЯ</text><text x="12.000" y="23.000" font-size="6" font-weight="700" fill="#17383c" text-anchor="start">Управление актуальными группами света 2</text><text x="12.000" y="31.000" font-size="3" font-weight="400" fill="#697878" text-anchor="start">Связи управления — функциональная схема. Это не схема коммутации проводников.</text><line x1="10.000" y1="36.000" x2="410.000" y2="36.000" stroke="#176c73" stroke-width="0.5"/><text x="12.000" y="285.000" font-size="2.7" font-weight="700" fill="#a45322" text-anchor="start">НЕ ДЛЯ МОНТАЖА  ·  h от локального чистого пола; числовые h — предложения, не нормы.</text><text x="12.000" y="291.000" font-size="2.5" font-weight="400" fill="#697878" text-anchor="start">Проходки, кабели, защита, влажные зоны, изделия и окончательные отметки требуют проектного решения.</text><text x="408.000" y="285.000" font-size="3.3" font-weight="700" fill="#176c73" text-anchor="end">P84-E502</text><text x="408.000" y="291.000" font-size="2.6" font-weight="400" fill="#697878" text-anchor="end">A3 · NTS</text><rect x="12.000" y="46.000" width="396.000" height="8.000" fill="#176c73" stroke="none" stroke-width="0.3" /><text x="14.000" y="51.400" font-size="2.8" font-weight="700" fill="white" text-anchor="start">Управление</text><text x="45.000" y="51.400" font-size="2.8" font-weight="700" fill="white" text-anchor="start">Группы</text><text x="126.000" y="51.400" font-size="2.8" font-weight="700" fill="white" text-anchor="start">Актуальные светильники / точки</text><text x="255.000" y="51.400" font-size="2.8" font-weight="700" fill="white" text-anchor="start">Действие / что уточнить</text><rect x="12.000" y="54.000" width="396.000" height="20.500" fill="#f0f5f3" stroke="none" stroke-width="0.3" /><text x="14.000" y="58.000" font-size="2.8" font-weight="400" fill="#17383c" text-anchor="start">SW11</text><text x="45.000" y="58.000" font-size="2.8" font-weight="400" fill="#17383c" text-anchor="start">P26-A-R05-GENERAL, P26-A-R05-WARDROBE</text><text x="126.000" y="58.000" font-size="2.8" font-weight="400" fill="#17383c" text-anchor="start">L09, L10</text><text x="255.000" y="58.000" font-size="2.8" font-weight="400" fill="#17383c" text-anchor="start">Предложенная логика; число клавиш/сцен и диммирование уточнить по выбранному оборудованию. Место</text><text x="255.000" y="62.300" font-size="2.8" font-weight="400" fill="#17383c" text-anchor="start">управления HOLD.</text><line x1="12.000" y1="74.500" x2="408.000" y2="74.500" stroke="#d9e2df" stroke-width="0.15"/><rect x="12.000" y="74.500" width="396.000" height="20.500" fill="white" stroke="none" stroke-width="0.3" /><text x="14.000" y="78.500" font-size="2.8" font-weight="400" fill="#17383c" text-anchor="start">SW12</text><text x="45.000" y="78.500" font-size="2.8" font-weight="400" fill="#17383c" text-anchor="start">P26-A-R05-GENERAL, P65-L-C2, P65-L-C4</text><text x="126.000" y="78.500" font-size="2.8" font-weight="400" fill="#17383c" text-anchor="start">C2-01, C4-01, L09</text><text x="255.000" y="78.500" font-size="2.8" font-weight="400" fill="#17383c" text-anchor="start">Предложенная логика; число клавиш/сцен и диммирование уточнить по выбранному оборудованию.</text><line x1="12.000" y1="95.000" x2="408.000" y2="95.000" stroke="#d9e2df" stroke-width="0.15"/><rect x="12.000" y="95.000" width="396.000" height="20.500" fill="#f0f5f3" stroke="none" stroke-width="0.3" /><text x="14.000" y="99.000" font-size="2.8" font-weight="400" fill="#17383c" text-anchor="start">SW13</text><text x="45.000" y="99.000" font-size="2.8" font-weight="400" fill="#17383c" text-anchor="start">P26-A-R05-GENERAL, P65-L-C3, P65-L-C4</text><text x="126.000" y="99.000" font-size="2.8" font-weight="400" fill="#17383c" text-anchor="start">C3-01, C4-01, L09</text><text x="255.000" y="99.000" font-size="2.8" font-weight="400" fill="#17383c" text-anchor="start">Предложенная логика; число клавиш/сцен и диммирование уточнить по выбранному оборудованию.</text><line x1="12.000" y1="115.500" x2="408.000" y2="115.500" stroke="#d9e2df" stroke-width="0.15"/><rect x="12.000" y="115.500" width="396.000" height="20.500" fill="white" stroke="none" stroke-width="0.3" /><text x="14.000" y="119.500" font-size="2.8" font-weight="400" fill="#17383c" text-anchor="start">SW14</text><text x="45.000" y="119.500" font-size="2.8" font-weight="400" fill="#17383c" text-anchor="start">LOUNGE-DINING, LOUNGE-PASSAGE, P65-L-E1, P65-L-E2</text><text x="126.000" y="119.500" font-size="2.8" font-weight="400" fill="#17383c" text-anchor="start">E1-01, E1-02, E2-01, L15, L17</text><text x="255.000" y="119.500" font-size="2.8" font-weight="400" fill="#17383c" text-anchor="start">Предложенная логика; число клавиш/сцен и диммирование уточнить по выбранному оборудованию.</text><line x1="12.000" y1="136.000" x2="408.000" y2="136.000" stroke="#d9e2df" stroke-width="0.15"/><rect x="12.000" y="136.000" width="396.000" height="20.500" fill="#f0f5f3" stroke="none" stroke-width="0.3" /><text x="14.000" y="140.000" font-size="2.8" font-weight="400" fill="#17383c" text-anchor="start">SW15</text><text x="45.000" y="140.000" font-size="2.8" font-weight="400" fill="#17383c" text-anchor="start">LOUNGE-DINING, LOUNGE-PASSAGE, LOUNGE-WORK</text><text x="126.000" y="140.000" font-size="2.8" font-weight="400" fill="#17383c" text-anchor="start">L15, L16, L17</text><text x="255.000" y="140.000" font-size="2.8" font-weight="400" fill="#17383c" text-anchor="start">Предложенная логика; число клавиш/сцен и диммирование уточнить по выбранному оборудованию.</text><line x1="12.000" y1="156.500" x2="408.000" y2="156.500" stroke="#d9e2df" stroke-width="0.15"/><rect x="12.000" y="156.500" width="396.000" height="20.500" fill="white" stroke="none" stroke-width="0.3" /><text x="14.000" y="160.500" font-size="2.8" font-weight="400" fill="#17383c" text-anchor="start">SW16</text><text x="45.000" y="160.500" font-size="2.8" font-weight="400" fill="#17383c" text-anchor="start">LOUNGE-WORK</text><text x="126.000" y="160.500" font-size="2.8" font-weight="400" fill="#17383c" text-anchor="start">L16</text><text x="255.000" y="160.500" font-size="2.8" font-weight="400" fill="#17383c" text-anchor="start">Предложенная логика; число клавиш/сцен и диммирование уточнить по выбранному оборудованию. Место</text><text x="255.000" y="164.800" font-size="2.8" font-weight="400" fill="#17383c" text-anchor="start">управления HOLD.</text><line x1="12.000" y1="177.000" x2="408.000" y2="177.000" stroke="#d9e2df" stroke-width="0.15"/><rect x="12.000" y="177.000" width="396.000" height="20.500" fill="#f0f5f3" stroke="none" stroke-width="0.3" /><text x="14.000" y="181.000" font-size="2.8" font-weight="400" fill="#17383c" text-anchor="start">SW00</text><text x="45.000" y="181.000" font-size="2.8" font-weight="400" fill="#17383c" text-anchor="start">Все группы света</text><text x="126.000" y="181.000" font-size="2.8" font-weight="400" fill="#17383c" text-anchor="start">Все актуальные точки света: 32</text><text x="255.000" y="181.000" font-size="2.8" font-weight="400" fill="#17383c" text-anchor="start">Общее выключение только света. Розетки, техника и защита сохраняют своё питание.</text><line x1="12.000" y1="197.500" x2="408.000" y2="197.500" stroke="#d9e2df" stroke-width="0.15"/><text x="12.000" y="264.000" font-size="2.9" font-weight="400" fill="#17383c" text-anchor="start">Местное управление — без обязательного интернета. Соединения показаны логически; электрические схемы, клавиши/диммеры/драйверы ещё не выбраны.</text></g></svg>