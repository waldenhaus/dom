<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 1680 1188" role="img">
<title>Свес и скрытый водосток</title>
<desc>DBR-P11. Размеры в миллиметрах. Площади по геометрии P81, согласованной с P89. Для согласования.</desc>
<rect width="1680" height="1188" fill="#fffdf8"/>
<text x="64.00" y="57.00" font-family="Arial, sans-serif" font-size="17" fill="#697066" text-anchor="start" font-weight="600">ДОМ У ВОДЫ / DBR—P11</text>
<text x="64.00" y="104.00" font-family="Arial, sans-serif" font-size="34" fill="#303832" text-anchor="start" font-weight="600">Свес и скрытый водосток</text>
<text x="64.00" y="137.00" font-family="Arial, sans-serif" font-size="17" fill="#697066" text-anchor="start" font-weight="400">Предлагаемый принцип: закрытая деревянная подшивка, объёмная лобовая часть и обслуживаемый скрытый жёлоб.</text>
<line x1="64.00" y1="160.00" x2="1616.00" y2="160.00" stroke="#d6d7cd" stroke-width="1"/>
<polygon points="110.00,290.00 510.00,455.00 510.00,540.00 110.00,386.00" fill="#c4ab88" stroke="#303832" stroke-width="2"/>
<line x1="110.00" y1="280.00" x2="560.00" y2="465.00" stroke="#3b4140" stroke-width="8"/>
<line x1="110.00" y1="310.00" x2="505.00" y2="473.00" stroke="#828d87" stroke-width="2" stroke-dasharray="9 5"/>
<line x1="115.00" y1="397.00" x2="510.00" y2="551.00" stroke="#b9986f" stroke-width="10"/>
<rect x="588.00" y="455.00" width="28.00" height="155.00" fill="#3b4140" stroke="none" stroke-width="1"/>
<path d="M 532 472 L 532 550 L 584 550 L 584 455" fill="none" stroke="#527f8c" stroke-width="8"/>
<line x1="558.00" y1="551.00" x2="558.00" y2="693.00" stroke="#527f8c" stroke-width="14"/>
<rect x="475.00" y="600.00" width="170.00" height="280.00" fill="#d4cfbf" stroke="#303832" stroke-width="1"/>
<line x1="558.00" y1="610.00" x2="558.00" y2="868.00" stroke="#527f8c" stroke-width="12" stroke-dasharray="18 5"/>
<rect x="522.00" y="725.00" width="72.00" height="65.00" fill="none" stroke="#986a3e" stroke-width="2"/>
<line x1="602.00" y1="512.00" x2="695.00" y2="512.00" stroke="#bb764b" stroke-width="5"/>
<text x="90.00" y="221.00" font-family="Arial, sans-serif" font-size="23" fill="#303832" text-anchor="start" font-weight="600">Принцип карнизного узла</text>
<text x="125.00" y="255.00" font-family="Arial, sans-serif" font-size="17" fill="#303832" text-anchor="start" font-weight="400">Фальц</text>
<text x="85.00" y="472.00" font-family="Arial, sans-serif" font-size="17" fill="#303832" text-anchor="start" font-weight="400">Несущая часть — по расчёту</text>
<text x="92.00" y="586.00" font-family="Arial, sans-serif" font-size="17" fill="#303832" text-anchor="start" font-weight="400">Вентилируемая деревянная подшивка</text>
<text x="679.00" y="453.00" font-family="Arial, sans-serif" font-size="17" fill="#303832" text-anchor="start" font-weight="400">Скрытый жёлоб</text>
<text x="679.00" y="543.00" font-family="Arial, sans-serif" font-size="17" fill="#303832" text-anchor="start" font-weight="400">Отдельный аварийный перелив</text>
<text x="679.00" y="617.00" font-family="Arial, sans-serif" font-size="17" fill="#303832" text-anchor="start" font-weight="400">Лобовая часть</text>
<text x="679.00" y="749.00" font-family="Arial, sans-serif" font-size="17" fill="#303832" text-anchor="start" font-weight="400">Доступ к воронке и стояку</text>
<text x="679.00" y="850.00" font-family="Arial, sans-serif" font-size="17" fill="#303832" text-anchor="start" font-weight="400">Стояк за съёмной облицовкой</text>
<text x="92.00" y="935.00" font-family="Arial, sans-serif" font-size="18" fill="#303832" text-anchor="start" font-weight="600">Открытый фронтонный вынос над западным стеклом — 2 500 мм по модели.</text>
<text x="92.00" y="970.00" font-family="Arial, sans-serif" font-size="18" fill="#303832" text-anchor="start" font-weight="400">Подшивка закрывает конструкцию, но не является несущей опорой.</text>
<text x="92.00" y="1005.00" font-family="Arial, sans-serif" font-size="18" fill="#303832" text-anchor="start" font-weight="400">Сечения, опоры, крепёж и прогиб выноса должен рассчитать конструктор.</text>
<text x="1065.00" y="215.00" font-family="Arial, sans-serif" font-size="23" fill="#303832" text-anchor="start" font-weight="600">ГДЕ СОБИРАТЬ ВОДУ</text>
<text x="1065.00" y="256.00" font-family="Arial, sans-serif" font-size="18" fill="#303832" text-anchor="start" font-weight="400">Конёк дома идёт запад—восток.</text>
<text x="1065.00" y="288.00" font-family="Arial, sans-serif" font-size="18" fill="#303832" text-anchor="start" font-weight="400">Жёлоба — по северному и южному</text>
<text x="1065.00" y="320.00" font-family="Arial, sans-serif" font-size="18" fill="#303832" text-anchor="start" font-weight="400">карнизам, у нижних кромок скатов.</text>
<text x="1065.00" y="352.00" font-family="Arial, sans-serif" font-size="18" fill="#303832" text-anchor="start" font-weight="400">Западная кромка над стеклом —</text>
<text x="1065.00" y="384.00" font-family="Arial, sans-serif" font-size="18" fill="#303832" text-anchor="start" font-weight="400">фронтон: жёлоб вдоль ската не ставим.</text>
<text x="1065.00" y="446.00" font-family="Arial, sans-serif" font-size="23" fill="#303832" text-anchor="start" font-weight="600">Обслуживание и выпуск</text>
<text x="1065.00" y="486.00" font-family="Arial, sans-serif" font-size="18" fill="#303832" text-anchor="start" font-weight="400">Доступ сверху к жёлобу и воронке.</text>
<text x="1065.00" y="518.00" font-family="Arial, sans-serif" font-size="18" fill="#303832" text-anchor="start" font-weight="400">Ревизия стояка за съёмной панелью.</text>
<text x="1065.00" y="550.00" font-family="Arial, sans-serif" font-size="18" fill="#303832" text-anchor="start" font-weight="400">Аварийный перелив видимый,</text>
<text x="1065.00" y="582.00" font-family="Arial, sans-serif" font-size="18" fill="#303832" text-anchor="start" font-weight="400">отдельный от основного стояка.</text>
<text x="1065.00" y="614.00" font-family="Arial, sans-serif" font-size="18" fill="#303832" text-anchor="start" font-weight="400">Выпуск воды — по проекту участка;</text>
<text x="1065.00" y="646.00" font-family="Arial, sans-serif" font-size="18" fill="#303832" text-anchor="start" font-weight="400">не назначен на соседний участок</text>
<text x="1065.00" y="678.00" font-family="Arial, sans-serif" font-size="18" fill="#303832" text-anchor="start" font-weight="400">и не направлен автоматически в озеро.</text>
<text x="1065.00" y="740.00" font-family="Arial, sans-serif" font-size="23" fill="#303832" text-anchor="start" font-weight="600">Расчётные входные данные</text>
<text x="1065.00" y="780.00" font-family="Arial, sans-serif" font-size="18" fill="#303832" text-anchor="start" font-weight="400">Осадки, снег, обледенение, водосбор.</text>
<text x="1065.00" y="812.00" font-family="Arial, sans-serif" font-size="18" fill="#303832" text-anchor="start" font-weight="400">Размеры жёлоба и труб не назначены.</text>
<text x="1065.00" y="844.00" font-family="Arial, sans-serif" font-size="18" fill="#303832" text-anchor="start" font-weight="400">Уклон навеса и сбор с него уточнить.</text>
<text x="1065.00" y="876.00" font-family="Arial, sans-serif" font-size="18" fill="#303832" text-anchor="start" font-weight="400">Конструкция и гидравлика не утверждены.</text>
<line x1="64.00" y1="1094.00" x2="1616.00" y2="1094.00" stroke="#c7c9c0" stroke-width="1"/>
<text x="64.00" y="1127.00" font-family="Arial, sans-serif" font-size="15" fill="#697066" text-anchor="start" font-weight="400">WEB-UPDATE-01 · геометрия P81 / P89 · 14.09.2026</text>
<text x="64.00" y="1153.00" font-family="Arial, sans-serif" font-size="15" fill="#697066" text-anchor="start" font-weight="400">Предложение для согласования. Геодезия, конструктив и изделия требуют проверки. Не для строительства.</text>
<text x="1616.00" y="1127.00" font-family="Arial, sans-serif" font-size="15" fill="#303832" text-anchor="end" font-weight="400">RF-01 / WEB-UPDATE-01 · схемы, NTS</text>
<text x="1616.00" y="1153.00" font-family="Arial, sans-serif" font-size="13" fill="#697066" text-anchor="end" font-weight="400">Автор: Codex · проверка и утверждение специалистом: не выполнены</text>
</svg>