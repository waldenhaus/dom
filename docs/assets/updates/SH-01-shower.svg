<text x="270.00" y="469.00" font-family="Arial, sans-serif" font-size="16" fill="#303832" text-anchor="middle" font-weight="400">500</text>
<text x="119.00" y="659.00" font-family="Arial, sans-serif" font-size="16" fill="#697066" text-anchor="start" font-weight="400">С ↑ · габариты сантехники условные</text>
<text x="119.00" y="700.00" font-family="Arial, sans-serif" font-size="15" fill="#697066" text-anchor="start" font-weight="400">Пунктирная дверь помещения: навеска D05 ещё не выбрана.</text>
<text x="119.00" y="730.00" font-family="Arial, sans-serif" font-size="15" fill="#697066" text-anchor="start" font-weight="400">520 мм — расстояние до стены, без полотенцесушителя.</text>
<text x="119.00" y="760.00" font-family="Arial, sans-serif" font-size="15" fill="#697066" text-anchor="start" font-weight="400">В зоне полотенцесушителя глубиной 100 мм остаётся 420 мм.</text>
<text x="806.00" y="215.00" font-family="Arial, sans-serif" font-size="24" fill="#303832" text-anchor="start" font-weight="600">РЕКОМЕНДУЮ ДВЕ СТВОРКИ</text>
<text x="806.00" y="255.00" font-family="Arial, sans-serif" font-size="18" fill="#303832" text-anchor="start" font-weight="400">Два равных полотна: номинально 500 + 500 мм.</text>
<text x="806.00" y="289.00" font-family="Arial, sans-serif" font-size="18" fill="#303832" text-anchor="start" font-weight="400">Оба открываются внутрь душа; боковая панель неподвижна.</text>
<text x="806.00" y="323.00" font-family="Arial, sans-serif" font-size="18" fill="#303832" text-anchor="start" font-weight="400">Радиус движения каждой створки — 500 мм.</text>
<text x="806.00" y="357.00" font-family="Arial, sans-serif" font-size="18" fill="#303832" text-anchor="start" font-weight="400">При 90° остаётся 1000 − 500 = 500 мм до задней стены.</text>
<text x="806.00" y="391.00" font-family="Arial, sans-serif" font-size="18" fill="#303832" text-anchor="start" font-weight="400">Перед душем полотно не занимает узкую полосу прохода.</text>
<text x="806.00" y="450.00" font-family="Arial, sans-serif" font-size="23" fill="#303832" text-anchor="start" font-weight="600">Вариант с одной створкой</text>
<text x="806.00" y="488.00" font-family="Arial, sans-serif" font-size="18" fill="#303832" text-anchor="start" font-weight="400">800 мм дверь + 200 мм неподвижный участок.</text>
<text x="806.00" y="520.00" font-family="Arial, sans-serif" font-size="18" fill="#303832" text-anchor="start" font-weight="400">Радиус 800 мм; до задней стены остаётся 200 мм.</text>
<text x="806.00" y="552.00" font-family="Arial, sans-serif" font-size="18" fill="#303832" text-anchor="start" font-weight="400">Одна створка на все 1000 мм достигает задней стены:</text>
<text x="806.00" y="584.00" font-family="Arial, sans-serif" font-size="18" fill="#303832" text-anchor="start" font-weight="400">запаса под ручку и арматуру в номинальной схеме нет.</text>
<text x="806.00" y="616.00" font-family="Arial, sans-serif" font-size="18" fill="#303832" text-anchor="start" font-weight="400">Поэтому широкую цельную створку здесь не выбираю.</text>
<text x="806.00" y="673.00" font-family="Arial, sans-serif" font-size="23" fill="#303832" text-anchor="start" font-weight="600">Что проверяем перед заказом</text>
<text x="806.00" y="711.00" font-family="Arial, sans-serif" font-size="18" fill="#303832" text-anchor="start" font-weight="400">Ширина чистого входа после вычета петель и уплотнений.</text>
<text x="806.00" y="743.00" font-family="Arial, sans-serif" font-size="18" fill="#303832" text-anchor="start" font-weight="400">Фактические выступы смесителя, ручек и лейки.</text>
<text x="806.00" y="775.00" font-family="Arial, sans-serif" font-size="18" fill="#303832" text-anchor="start" font-weight="400">Петли: рабочее открывание внутрь и аварийный доступ.</text>
<text x="806.00" y="807.00" font-family="Arial, sans-serif" font-size="18" fill="#303832" text-anchor="start" font-weight="400">Стекло, крепление к боковой панели, уплотнения, порог.</text>
<text x="806.00" y="839.00" font-family="Arial, sans-serif" font-size="18" fill="#303832" text-anchor="start" font-weight="400">Навеска D05 и перенос полотенцесушителя при коллизии.</text>
<text x="806.00" y="933.00" font-family="Arial, sans-serif" font-size="17" fill="#697066" text-anchor="start" font-weight="400">Это геометрическая проверка номинальных полотен.</text>
<text x="806.00" y="963.00" font-family="Arial, sans-serif" font-size="17" fill="#697066" text-anchor="start" font-weight="400">Изделие и безопасные рабочие зазоры пока не выбраны.</text>
<text x="119.00" y="1006.00" font-family="Arial, sans-serif" font-size="17" fill="#303832" text-anchor="start" font-weight="400">Тёплая песочная плитка A и светлый greige B сохранены как варианты отделки.</text>
<line x1="64.00" y1="1094.00" x2="1616.00" y2="1094.00" stroke="#c7c9c0" stroke-width="1"/>
<text x="64.00" y="1127.00" font-family="Arial, sans-serif" font-size="15" fill="#697066" text-anchor="start" font-weight="400">WEB-UPDATE-01 · геометрия P81 / P89 · 14.09.2026</text>
