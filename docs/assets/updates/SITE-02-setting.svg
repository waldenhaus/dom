<text x="1190.00" y="686.00" font-family="Arial, sans-serif" font-size="18" fill="#303832" text-anchor="start" font-weight="600">ОПОРА ДЛЯ ПРОВЕРКИ</text>
<text x="1190.00" y="717.00" font-family="Arial, sans-serif" font-size="15" fill="#697066" text-anchor="start" font-weight="400">Ноль модели, предложение:</text>
<text x="1190.00" y="743.00" font-family="Arial, sans-serif" font-size="15" fill="#697066" text-anchor="start" font-weight="400">E 2179747,00 / N 6132128,50 м</text>
<text x="1190.00" y="769.00" font-family="Arial, sans-serif" font-size="15" fill="#697066" text-anchor="start" font-weight="400">СЗ угол дома:</text>
