<text x="1190.00" y="821.00" font-family="Arial, sans-serif" font-size="15" fill="#697066" text-anchor="start" font-weight="400">Без поворота / X восток, Y юг.</text>
<text x="1190.00" y="847.00" font-family="Arial, sans-serif" font-size="15" fill="#697066" text-anchor="start" font-weight="400">Площадь контура: ≈ 1605,19 м².</text>
<text x="1190.00" y="873.00" font-family="Arial, sans-serif" font-size="15" fill="#697066" text-anchor="start" font-weight="400">Сетка: 50 м = 2362 CAD единицы.</text>
