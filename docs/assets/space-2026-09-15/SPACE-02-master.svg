<text x="1580.00" y="332.00" font-family="Arial, sans-serif" font-size="21" fill="#a6502f" text-anchor="end" font-weight="600">420 мм</text>
<text x="930.00" y="356.00" font-family="Arial, sans-serif" font-size="16" fill="#303832" text-anchor="start" font-weight="400">Перед душевой у полотенцесушителя</text>
<text x="930.00" y="392.00" font-family="Arial, sans-serif" font-size="15" fill="#697066" text-anchor="start" font-weight="400">M3</text>
<text x="1580.00" y="392.00" font-family="Arial, sans-serif" font-size="21" fill="#246c71" text-anchor="end" font-weight="600">1070 мм</text>
<text x="930.00" y="416.00" font-family="Arial, sans-serif" font-size="16" fill="#303832" text-anchor="start" font-weight="400">Перед раковиной до противоположной стены</text>
<text x="930.00" y="452.00" font-family="Arial, sans-serif" font-size="15" fill="#697066" text-anchor="start" font-weight="400">M4</text>
<text x="1580.00" y="452.00" font-family="Arial, sans-serif" font-size="21" fill="#246c71" text-anchor="end" font-weight="600">1050 мм</text>
<text x="930.00" y="476.00" font-family="Arial, sans-serif" font-size="16" fill="#303832" text-anchor="start" font-weight="400">Перед WC до бокового стекла душа</text>
<text x="930.00" y="512.00" font-family="Arial, sans-serif" font-size="15" fill="#697066" text-anchor="start" font-weight="400">M5</text>
<text x="1580.00" y="512.00" font-family="Arial, sans-serif" font-size="21" fill="#a6502f" text-anchor="end" font-weight="600">385 мм</text>
<text x="930.00" y="536.00" font-family="Arial, sans-serif" font-size="16" fill="#303832" text-anchor="start" font-weight="400">Сбоку чаши WC до тумбы</text>
<text x="930.00" y="572.00" font-family="Arial, sans-serif" font-size="15" fill="#697066" text-anchor="start" font-weight="400">M6</text>
<text x="1580.00" y="572.00" font-family="Arial, sans-serif" font-size="21" fill="#a6502f" text-anchor="end" font-weight="600">315 мм</text>
<text x="930.00" y="596.00" font-family="Arial, sans-serif" font-size="16" fill="#303832" text-anchor="start" font-weight="400">Сбоку чаши WC до южной стены</text>
<text x="930.00" y="817.00" font-family="Arial, sans-serif" font-size="16" fill="#303832" text-anchor="start" font-weight="400">WC смотрит на запад, не на север.</text>
<text x="930.00" y="846.00" font-family="Arial, sans-serif" font-size="16" fill="#303832" text-anchor="start" font-weight="400">До тумбы сбоку чаши — 385, до южной стены — 315.</text>
<text x="930.00" y="875.00" font-family="Arial, sans-serif" font-size="16" fill="#303832" text-anchor="start" font-weight="400">От оси WC: 570 до тумбы и 500 до южной стены.</text>
<text x="930.00" y="904.00" font-family="Arial, sans-serif" font-size="16" fill="#303832" text-anchor="start" font-weight="400">Перед раковиной 1070; эта зона пересекается</text>
<text x="930.00" y="933.00" font-family="Arial, sans-serif" font-size="16" fill="#303832" text-anchor="start" font-weight="400">с подходом к душу и WC при двух пользователях.</text>
<text x="130.00" y="950.00" font-family="Arial, sans-serif" font-size="15" fill="#697066" text-anchor="start" font-weight="400">Голубой пунктир — условный резерв: 600 × 600 у раковины, 800 × 600 для плеч / коленей у WC.</text>
<text x="130.00" y="982.00" font-family="Arial, sans-serif" font-size="15" fill="#697066" text-anchor="start" font-weight="400">Это примерка для обсуждения, не антропометрическая норма и не проверка доступности.</text>
<text x="130.00" y="1014.00" font-family="Arial, sans-serif" font-size="15" fill="#697066" text-anchor="start" font-weight="400">Сектора душа — 500 мм. Ручки, петли, смеситель и чистый вход проверяются по реальным изделиям.</text>
<line x1="64.00" y1="1094.00" x2="1616.00" y2="1094.00" stroke="#c7c9c0" stroke-width="1"/>
