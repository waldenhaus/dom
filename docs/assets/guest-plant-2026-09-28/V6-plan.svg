<text x="195.00" y="936.00" font-family="Arial, sans-serif" font-size="16" fill="#65736c" text-anchor="start" font-weight="400">M1/M2 — две гребёнки · WD — стиралка/сушилка · B — раковина</text>
<text x="195.00" y="965.00" font-family="Arial, sans-serif" font-size="16" fill="#65736c" text-anchor="start" font-weight="400">Контуры зелёные: рабочие зоны WC/раковины. Охра: открытая техника/загрузка.</text>
<text x="195.00" y="994.00" font-family="Arial, sans-serif" font-size="16" fill="#65736c" text-anchor="start" font-weight="400">Дверь D03 — номинальные 900 наружу; её чистый проём и петли не выбраны.</text>
<text x="195.00" y="1023.00" font-family="Arial, sans-serif" font-size="16" fill="#65736c" text-anchor="start" font-weight="400">В 6 использует общий стеновой шкаф со стороны прихожей. Оборудование не вынесено в пристройку.</text>
<text x="1138.00" y="825.00" font-family="Arial, sans-serif" font-size="13" fill="#65736c" text-anchor="start" font-weight="400">Душ, WC и раковина остаются. Гребёнки в западной</text>
<text x="1138.00" y="849.00" font-family="Arial, sans-serif" font-size="13" fill="#65736c" text-anchor="start" font-weight="400">перегородке 200, сервис из прихожей.</text>
<text x="1138.00" y="885.00" font-family="Arial, sans-serif" font-size="13" fill="#65736c" text-anchor="start" font-weight="400">Тела двух коробок и обвязка в общем стеновом шкафу;</text>
<text x="1138.00" y="909.00" font-family="Arial, sans-serif" font-size="13" fill="#65736c" text-anchor="start" font-weight="400">это изменение перегородки и доступ с сухой стороны.</text>
