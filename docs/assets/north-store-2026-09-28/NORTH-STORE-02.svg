<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 1120" role="img" aria-labelledby="title desc">
<title id="title">Лаундж и кладовая в линию фасадов — план для согласования</title>
<desc id="desc">Дом 11560 на 8160 мм. Тёплый лаундж расширен к западу до 8700 на 4900 мм: его западная стена совпадает с западной стеной дома X минус 300 мм. Кладовая 2860 на 4900 мм совпадает с восточным фасадом дома X 11260 мм. Северная дверь кладовой символическая.</desc>
<rect width="1300" height="1120" fill="#f7f5ef"/>
<text x="80" y="65" font-size="38" font-family="Arial,sans-serif" font-weight="700" fill="#273831">Лаундж и кладовая в линию фасада</text>
<text x="80" y="102" font-size="19" font-family="Arial,sans-serif" fill="#637169">28.09.2026 · схема для согласования · север сверху · размеры по граничным контурам</text>
<text x="1080" y="160" font-size="25" font-family="Arial,sans-serif" fill="#273831">С ↑</text>
