<text x="220" y="218" font-size="18" font-family="Arial,sans-serif" fill="#28594f">западная стена X = −300 мм — вровень с домом</text>
<line x1="685.5" y1="132" x2="871.4" y2="132" stroke="#263831" stroke-width="2"/>
