<text x="1000" y="625" font-size="20" font-family="Arial,sans-serif" fill="#256b5c">X = 11 260 мм</text>
<line x1="871.4" y1="425" x2="910.4" y2="425" stroke="#a74d3b" stroke-width="3" stroke-dasharray="8 6"/>
<line x1="910.4" y1="155" x2="910.4" y2="420" stroke="#a74d3b" stroke-width="2" stroke-dasharray="8 6"/>
<text x="945" y="335" font-size="17" font-family="Arial,sans-serif" fill="#a74d3b">Прежний край</text>
<text x="945" y="359" font-size="17" font-family="Arial,sans-serif" fill="#a74d3b">навеса +600 мм</text>
<text x="945" y="383" font-size="17" font-family="Arial,sans-serif" fill="#a74d3b">убирается</text>
<rect x="756" y="144" width="58" height="13" fill="#f7f5ef"/>
<text x="701" y="250" font-size="20" font-family="Arial,sans-serif" font-weight="700" fill="#633b20">КЛАДОВАЯ</text>
