<text x="704" y="314" font-size="16" font-family="Arial,sans-serif" fill="#633b20">без техкомнаты</text>
<text x="390" y="290" font-size="25" font-family="Arial,sans-serif" font-weight="700" fill="#28594f">ТЁПЛЫЙ ЛАУНДЖ</text>
<text x="400" y="325" text-anchor="middle" font-size="20" font-family="Arial,sans-serif" fill="#28594f">8700 × 4900 · 42,63 м²</text>
<text x="425" y="730" font-size="30" font-family="Arial,sans-serif" font-weight="700" fill="#273831">ОСНОВНОЙ ДОМ</text>
<text x="475" y="770" font-size="20" font-family="Arial,sans-serif" fill="#273831">11 560 × 8160</text>
