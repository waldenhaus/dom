<text x="940" y="270" font-size="19" font-family="Arial,sans-serif" fill="#273831">4900</text>
<text x="705" y="367" font-size="16" font-family="Arial,sans-serif" fill="#633b20">дверь с севера ↑</text>
<text x="705" y="392" font-size="15" font-family="Arial,sans-serif" fill="#633b20">размер/створка TBC</text>
<rect x="65" y="1030" width="1170" height="58" rx="8" fill="#e8e5da"/>
<text x="84" y="1055" font-size="17" font-family="Arial,sans-serif" fill="#273831">Лаундж +300 мм к озеру. Тепловой режим кладовой, кровля, основание и дверь уточняются.</text>
<text x="84" y="1078" font-size="16" font-family="Arial,sans-serif" fill="#69736d">Западный фасад лаунджа X = −300 мм; восточный фасад кладовой X = 11 260 мм. Не для строительства.</text>
</svg>
