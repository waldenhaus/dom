ll="#a56e35" text-anchor="middle" font-weight="normal">НОВЫЙ ВХОД · P88</text><text x="570.43" y="577.56" font-size="18" fill="#253a36" text-anchor="middle" font-weight="normal">Диван P81 · северные стулья заменены</text><text x="570.43" y="704.64" font-size="21" fill="#253a36" text-anchor="middle" font-weight="normal">F47 · стол из дерева</text><text x="1031.78" y="790.28" font-size="18" fill="#a56e35" text-anchor="middle" font-weight="normal">К1 · одно кресло</text><text x="363.24" y="967.09" font-size="17" fill="#367761" text-anchor="middle" font-weight="normal">Существующий выход P55-LD01</text><text x="897.80" y="1001.62" font-size="18" fill="#253a36" text-anchor="middle" font-weight="normal">Закрытый бар внутри F48</text><line x1="1390.00" y1="310.00" x2="1390.00" y2="265.00" stroke="#253a36" stroke-width="3"/><path d="M1383,278 L1390,265 L1397,278" fill="none" stroke="#253a36" stroke-width="3"/><text x="1390.00" y="253.00" font-size="19" fill="#253a36" text-anchor="middle" font-weight="bold">N / С</text><text x="1420.00" y="301.00" font-size="16" fill="#65736e" text-anchor="start" font-weight="normal">E</text><line x1="85.00" y1="1255.00" x2="361.26" y2="1255.00" stroke="#253a36" stroke-width="5"/><line x1="85.00" y1="1249.00" x2="85.00" y2="1261.00" stroke="#253a36" stroke-width="2"/><line x1="223.13" y1="1249.00" x2="223.13" y2="1261.00" stroke="#253a36" stroke-width="2"/><line x1="361.26" y1="1249.00" x2="361.26" y2="1261.00" stroke="#253a36" stroke-width="2"/><text x="85.00" y="1284.00" font-size="16" fill="#65736e" text-anchor="start" font-weight="normal">0</text><text x="361.26" y="1284.00" font-size="16" fill="#65736e" text-anchor="end" font-weight="normal">2 м</text><text x="1510.00" y="260.00" font-size="23" fill="#253a36" text-anchor="start" font-weight="bold">ПОСЛЕДНИЕ РЕШЕНИЯ</text><text x="1510.00" y="310.00" font-size="21" fill="#a56e35" text-anchor="start" font-weight="bold">Одна новая дверь</text><text x="1510.00" y="342.00" font-size="19" fill="#65736e" text-anchor="start" font-weight="normal">P88-ENTRY-01 внутри</text><text x="1510.00" y="370.00" font-size="19" fill="#65736e" text-anchor="start" font-weight="normal">существующего байа X6300…7350,</text><text x="1510.00" y="398.00" font-size="19" fill="#65736e" text-anchor="start" font-weight="normal">Y−4900. Стойки и верхний</text><text x="1510.00" y="426.00" font-size="19" fill="#65736e" text-anchor="start" font-weight="normal">фрагмент сохранены.</text><text x="1510.00" y="482.00" font-size="21" fill="#a56e35" text-anchor="start" font-weight="bold">Кресло без перегородки</text><text x="1510.00" y="514.00" font-size="19" fill="#65736e" text-anchor="start" font-weight="normal">Кресло 900×900 мм сохранено.</text><text x="1510.00" y="542.00" font-size="19" fill="#65736e" text-anchor="start" font-weight="normal">P87-LOUNGE-DIVIDER-01 исключён.</text><text x="1510.00" y="598.00" font-size="21" fill="#a56e35" text-anchor="start" font-weight="bold">ШМ · мокрая одежда</text><text x="1510.00" y="630.00" font-size="19" fill="#65736e" text-anchor="start" font-weight="normal">800×600×2300 мм — предложение</text><text x="1510.00" y="658.00" font-size="19" fill="#65736e" text-anchor="start" font-weight="normal">P89. Две створки, штанга,</text><text x="1510.00" y="686.00" font-size="19" fill="#65736e" text-anchor="start" font-weight="normal">крючки, поддон и прорези; без</text><text x="1510.00" y="714.00" font-size="19" fill="#65736e" text-anchor="start" font-weight="normal">обещания сушки.</text><text x="1510.00" y="770.00" font-size="21" fill="#a56e35" text-anchor="start" font-weight="bold">Направление подхода</text><text x="1510.00" y="802.00" font-size="19" fill="#65736e" text-anchor="start" font-weight="normal">Пунктир ведёт от новой двери по</text><text x="1510.00" y="830.00" font-size="19" fill="#65736e" text-anchor="start" font-weight="normal">свободной стороне к D01. Это не</text><text x="1510.00" y="858.00" font-size="19" fill="#65736e" text-anchor="start" font-weight="normal">доказанная полоса нормативного</text><text x="1510.00" y="886.00" font-size="19" fill="#65736e" text-anchor="start" font-weight="normal">прохода.</text><text x="1510.00" y="942.00" font-size="21" fill="#a56e35" text-anchor="start" font-weight="bold">Граница проработки</text><text x="1510.00" y="974.00" font-size="19" fill="#65736e" text-anchor="start" font-weight="normal">Наружное открывание показано</text><text x="1510.00" y="1002.00" font-size="19" fill="#65736e" text-anchor="start" font-weight="normal">пробно. Площадка, порог, грунт,</text><text x="1510.00" y="1030.00" font-size="19" fill="#65736e" text-anchor="start" font-weight="normal">фурнитура и безопасность будут</text><text x="1510.00" y="1058.00" font-size="19" fill="#65736e" text-anchor="start" font-weight="normal">проверены отдельно.</text><text x="75.00" y="1218.00" font-size="17" fill="#65736e" text-anchor="start" font-weight="normal">Светлые полосы — исходные зоны подхода P81. Проверка закрытых габаритов не подтверждает эксплуатационный fit.</text></g></svg>